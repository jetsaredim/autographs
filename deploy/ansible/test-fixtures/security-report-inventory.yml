all:
  hosts:
    localhost:
      ansible_connection: local
    production:
      security_patching_update_advisory_ids:
        - ELSA-2025-11111
        - ELSA-2025-22222
        - ELSA-2025-33333
      security_patching_update_ksplice_aware_advisory_ids:
        - ELSA-2025-11111
      security_patching_update_entries:
        - advisory_id: ELSA-2025-11111
          severity: Important
          ksplice_aware: true
          packages:
            - kernel
            - kernel-core
          package_count: 2
          cves:
            - CVE-2025-0001
        - advisory_id: ELSA-2025-22222
          severity: Moderate
          ksplice_aware: false
          packages:
            - openssl
          package_count: 1
          cves:
            - CVE-2025-0002
        - advisory_id: ELSA-2025-33333
          severity: Low
          ksplice_aware: false
          packages:
            - acl
            - sudo
          package_count: 2
          cves: []
