- name: Validate runtime kernel persistence contracts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_role_dir: "{{ playbook_dir }}/../roles/autographs_deploy"
    runtime_defaults: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/defaults/main.yml') | from_yaml }}
    runtime_main_tasks: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/tasks/main.yml') | from_yaml }}
    runtime_kernel_tasks: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/tasks/kernel_persistence.yml') | from_yaml }}
    runtime_image_assertion_tasks: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/tasks/assert_kernel_images.yml') | from_yaml }}
    runtime_owner_assertion_tasks: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/tasks/assert_kernel_ownership.yml') | from_yaml }}
    runtime_handlers: >-
      {{ lookup('ansible.builtin.file', runtime_role_dir ~ '/handlers/main.yml') | from_yaml }}
    autographs_deploy_controller_container_name: contract-controller
    autographs_controller_image: ghcr.io/example/controller:v0.0.0
    autographs_deploy_env_path: /opt/autographs/env
    autographs_deploy_wallet_path: /opt/autographs/wallet
    runtime_controller_quadlet: >-
      {{ lookup('ansible.builtin.template', runtime_role_dir ~ '/templates/autographs-controller.container.j2') }}
    runtime_coredump_config: >-
      {{ lookup('ansible.builtin.template', runtime_role_dir ~ '/templates/autographs-coredump.conf.j2') }}
    runtime_controller_service_section: >-
      {{ runtime_controller_quadlet | regex_search('(?ms)^\[Service\]\n.*?(?=^\[|\Z)') }}
    runtime_controller_service_ini: >-
      {{ runtime_controller_service_section | community.general.from_ini }}
    runtime_coredump_ini: >-
      {{ runtime_coredump_config | community.general.from_ini }}
    runtime_expected_pid_format: !unsafe "{% raw %}{{.State.Pid}}{% endraw %}"
    runtime_expected_container_name: !unsafe "{{ autographs_deploy_controller_container_name }}"
    runtime_expected_limits_path: !unsafe "/proc/{{ autographs_deploy_controller_pid.stdout | trim }}/limits"
    runtime_expected_service_assertion: >-
      autographs_deploy_controller_service_core_limit.stdout | trim == '0'
    runtime_expected_pid_assertion: >-
      autographs_deploy_controller_pid.stdout | trim is match('^[1-9][0-9]*$')
    runtime_expected_process_assertion: >-
      autographs_deploy_controller_process_limits.content | b64decode
      | regex_search('(?m)^Max core file size\s+0\s+0\s+bytes\s*$') is not none
  tasks:
    - name: Select persistence contract tasks
      ansible.builtin.set_fact:
        runtime_include_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Apply kernel persistence controls') | list }}
        runtime_package_install_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Ensure runtime packages are installed') | list }}
        runtime_running_kernel_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect running kernel release') | list }}
        runtime_default_kernel_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect default boot kernel') | list }}
        runtime_uek_assert_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Require running and default UEK kernels before package convergence') | list }}
        runtime_kernel_path_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Derive running kernel image path') | list }}
        runtime_running_image_stat_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect running UEK kernel image') | list }}
        runtime_default_image_stat_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect default UEK kernel image') | list }}
        runtime_image_assert_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Require bootable running and default UEK kernel images') | list }}
        runtime_running_owner_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect running UEK kernel image RPM owner') | list }}
        runtime_default_owner_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect default UEK kernel image RPM owner') | list }}
        runtime_owner_assert_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Require installed UEK RPM ownership for bootable kernel images') | list }}
        runtime_rhck_remove_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Remove managed RHCK kernel packages from UEK runtime') | list }}
        runtime_rhck_exclude_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Prevent managed RHCK kernel packages from being installed') | list }}
        runtime_dnf_preserve_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Preserve existing DNF exclusions with managed RHCK exclusions') | list }}
        runtime_stale_entry_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Remove stale missing non-rescue kernel boot entries') | list }}
        runtime_kdump_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Stop and mask Kdump') | list }}
        runtime_grubby_info_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect installed kernel boot arguments') | list }}
        runtime_grubby_remove_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Remove crashkernel from installed kernel boot entries') | list }}
        runtime_cmdline_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Inspect running kernel boot arguments') | list }}
        runtime_reboot_notice_matches: >-
          {{ runtime_kernel_tasks | selectattr('name', 'equalto', 'Report required operator-approved reboot') | list }}
        runtime_service_limit_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Require generated controller service core limit is zero') | list }}
        runtime_service_limit_read_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Read generated controller service core limit') | list }}
        runtime_pid_inspect_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Inspect live controller container PID') | list }}
        runtime_pid_assert_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Require a live controller container PID') | list }}
        runtime_process_limit_read_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Read live controller process limits') | list }}
        runtime_process_limit_matches: >-
          {{ runtime_main_tasks | selectattr('name', 'equalto', 'Require live controller soft and hard core limits are zero') | list }}
        runtime_controller_restart_matches: >-
          {{ runtime_handlers | selectattr('name', 'equalto', 'Restart controller container') | list }}

    - name: Require every persistence contract task exactly once
      ansible.builtin.assert:
        that:
          - runtime_include_matches | length == 1
          - runtime_package_install_matches | length == 1
          - runtime_running_kernel_matches | length == 1
          - runtime_default_kernel_matches | length == 1
          - runtime_uek_assert_matches | length == 1
          - runtime_kernel_path_matches | length == 1
          - runtime_running_image_stat_matches | length == 1
          - runtime_default_image_stat_matches | length == 1
          - runtime_image_assert_matches | length == 1
          - runtime_running_owner_matches | length == 1
          - runtime_default_owner_matches | length == 1
          - runtime_owner_assert_matches | length == 1
          - runtime_rhck_remove_matches | length == 1
          - runtime_rhck_exclude_matches | length == 1
          - runtime_dnf_preserve_matches | length == 1
          - runtime_stale_entry_matches | length == 1
          - runtime_kdump_matches | length == 1
          - runtime_grubby_info_matches | length == 1
          - runtime_grubby_remove_matches | length == 1
          - runtime_cmdline_matches | length == 1
          - runtime_reboot_notice_matches | length == 1
          - runtime_service_limit_matches | length == 1
          - runtime_service_limit_read_matches | length == 1
          - runtime_pid_inspect_matches | length == 1
          - runtime_pid_assert_matches | length == 1
          - runtime_process_limit_read_matches | length == 1
          - runtime_process_limit_matches | length == 1
          - runtime_controller_restart_matches | length == 1

    - name: Capture structured persistence tasks
      ansible.builtin.set_fact:
        runtime_include_task: "{{ runtime_include_matches | first }}"
        runtime_package_install_task: "{{ runtime_package_install_matches | first }}"
        runtime_running_kernel_task: "{{ runtime_running_kernel_matches | first }}"
        runtime_default_kernel_task: "{{ runtime_default_kernel_matches | first }}"
        runtime_uek_assert_task: "{{ runtime_uek_assert_matches | first }}"
        runtime_kernel_path_task: "{{ runtime_kernel_path_matches | first }}"
        runtime_running_image_stat_task: "{{ runtime_running_image_stat_matches | first }}"
        runtime_default_image_stat_task: "{{ runtime_default_image_stat_matches | first }}"
        runtime_image_assert_task: "{{ runtime_image_assert_matches | first }}"
        runtime_running_owner_task: "{{ runtime_running_owner_matches | first }}"
        runtime_default_owner_task: "{{ runtime_default_owner_matches | first }}"
        runtime_owner_assert_task: "{{ runtime_owner_assert_matches | first }}"
        runtime_image_guard_task: "{{ runtime_image_assertion_tasks | first }}"
        runtime_owner_guard_task: "{{ runtime_owner_assertion_tasks | first }}"
        runtime_rhck_remove_task: "{{ runtime_rhck_remove_matches | first }}"
        runtime_rhck_exclude_task: "{{ runtime_rhck_exclude_matches | first }}"
        runtime_dnf_preserve_task: "{{ runtime_dnf_preserve_matches | first }}"
        runtime_stale_entry_task: "{{ runtime_stale_entry_matches | first }}"
        runtime_kdump_task: "{{ runtime_kdump_matches | first }}"
        runtime_grubby_info_task: "{{ runtime_grubby_info_matches | first }}"
        runtime_grubby_remove_task: "{{ runtime_grubby_remove_matches | first }}"
        runtime_cmdline_task: "{{ runtime_cmdline_matches | first }}"
        runtime_reboot_notice_task: "{{ runtime_reboot_notice_matches | first }}"
        runtime_service_limit_task: "{{ runtime_service_limit_matches | first }}"
        runtime_service_limit_read_task: "{{ runtime_service_limit_read_matches | first }}"
        runtime_pid_inspect_task: "{{ runtime_pid_inspect_matches | first }}"
        runtime_pid_assert_task: "{{ runtime_pid_assert_matches | first }}"
        runtime_process_limit_read_task: "{{ runtime_process_limit_read_matches | first }}"
        runtime_process_limit_task: "{{ runtime_process_limit_matches | first }}"
        runtime_controller_restart_task: "{{ runtime_controller_restart_matches | first }}"

    - name: Require unguarded fail-closed task wiring
      ansible.builtin.assert:
        that:
          - runtime_include_task['ansible.builtin.include_tasks'] == 'kernel_persistence.yml'
          - runtime_main_tasks.index(runtime_include_task) < runtime_main_tasks.index(runtime_package_install_task)
          - "'when' not in runtime_include_task"
          - "'failed_when' not in runtime_include_task"
          - "'ignore_errors' not in runtime_include_task"
          - runtime_kdump_task['ansible.builtin.systemd'].name == 'kdump.service'
          - runtime_kdump_task['ansible.builtin.systemd'].state == 'stopped'
          - runtime_kdump_task['ansible.builtin.systemd'].enabled == false
          - runtime_kdump_task['ansible.builtin.systemd'].masked == true
          - "'failed_when' not in runtime_kdump_task"
          - "'ignore_errors' not in runtime_kdump_task"
          - runtime_running_kernel_task['ansible.builtin.command'].argv == ['uname', '-r']
          - runtime_default_kernel_task['ansible.builtin.command'].argv == ['grubby', '--default-kernel']
          - runtime_uek_assert_task['ansible.builtin.assert'].that | length == 2
          - runtime_uek_assert_task['ansible.builtin.assert'].that[0] is search('el10uek')
          - runtime_uek_assert_task['ansible.builtin.assert'].that[1] is search('el10uek')
          - runtime_kernel_path_task['ansible.builtin.set_fact'].autographs_deploy_running_kernel_image is search('/boot/vmlinuz-')
          - runtime_running_image_stat_task['ansible.builtin.stat'].follow == true
          - runtime_default_image_stat_task['ansible.builtin.stat'].follow == true
          - runtime_image_assert_task['ansible.builtin.import_tasks'] == 'assert_kernel_images.yml'
          - runtime_image_guard_task['ansible.builtin.assert'].that | length == 4
          - runtime_running_owner_task['ansible.builtin.command'].argv[0:4] == ['rpm', '-qf', '--qf', '%{NAME}\n']
          - runtime_default_owner_task['ansible.builtin.command'].argv[0:4] == ['rpm', '-qf', '--qf', '%{NAME}\n']
          - runtime_owner_assert_task['ansible.builtin.import_tasks'] == 'assert_kernel_ownership.yml'
          - runtime_owner_guard_task['ansible.builtin.assert'].that | length == 4
          - runtime_owner_guard_task['ansible.builtin.assert'].that[1] is search('kernel-uek')
          - runtime_owner_guard_task['ansible.builtin.assert'].that[3] is search('kernel-uek')
          - runtime_kernel_tasks.index(runtime_image_assert_task) < runtime_kernel_tasks.index(runtime_running_owner_task)
          - runtime_kernel_tasks.index(runtime_owner_assert_task) < runtime_kernel_tasks.index(runtime_rhck_remove_task)
          - runtime_rhck_remove_task['ansible.builtin.dnf'].name == runtime_expected_rhck_packages_variable
          - runtime_rhck_remove_task['ansible.builtin.dnf'].state == 'absent'
          - runtime_rhck_remove_task['ansible.builtin.dnf'].autoremove == false
          - runtime_rhck_remove_task['ansible.builtin.dnf'].disable_excludes == 'main'
          - runtime_rhck_exclude_task['community.general.ini_file'].section == 'main'
          - runtime_rhck_exclude_task['community.general.ini_file'].option == 'exclude'
          - runtime_rhck_exclude_task['community.general.ini_file'].value == runtime_expected_rhck_exclude_value
          - runtime_dnf_preserve_task['ansible.builtin.set_fact'].autographs_deploy_effective_dnf_excludes is search('autographs_deploy_rhck_packages')
          - runtime_dnf_preserve_task['ansible.builtin.set_fact'].autographs_deploy_effective_dnf_excludes is search('regex_findall')
          - "'kernel-headers' not in runtime_defaults.autographs_deploy_rhck_packages"
          - "'kernel-tools' not in runtime_defaults.autographs_deploy_rhck_packages"
          - "'kernel-tools-libs' not in runtime_defaults.autographs_deploy_rhck_packages"
          - runtime_stale_entry_task['ansible.builtin.shell'].executable == '/bin/bash'
          - runtime_stale_entry_task['ansible.builtin.shell'].cmd is search('/boot/vmlinuz-0-rescue-')
          - runtime_stale_entry_task['ansible.builtin.shell'].cmd is search('grubby --remove-kernel=')
          - runtime_stale_entry_task.changed_when is search('removed stale boot entry:')
          - runtime_grubby_info_task['ansible.builtin.command'].argv == ['grubby', '--info=ALL']
          - runtime_grubby_remove_task['ansible.builtin.command'].argv == ['grubby', '--update-kernel=ALL', '--remove-args=crashkernel']
          - runtime_grubby_remove_task.when is defined
          - runtime_grubby_remove_task.when == "'crashkernel' in autographs_deploy_grubby_info.stdout"
          - "'failed_when' not in runtime_grubby_remove_task"
          - "'ignore_errors' not in runtime_grubby_remove_task"
          - runtime_cmdline_task['ansible.builtin.command'].argv == ['cat', '/proc/cmdline']
          - runtime_reboot_notice_task.when is defined
          - "'autographs_deploy_running_kernel_cmdline.stdout' in runtime_reboot_notice_task.when"
          - "'is search' in runtime_reboot_notice_task.when"
          - >-
            runtime_service_limit_read_task['ansible.builtin.command'].argv
            == ['systemctl', 'show', 'autographs-controller.service',
                '--property=LimitCORE', '--value']
          - runtime_service_limit_read_task.register == 'autographs_deploy_controller_service_core_limit'
          - >-
            runtime_service_limit_task['ansible.builtin.assert'].that
            == [runtime_expected_service_assertion]
          - "'when' not in runtime_service_limit_task"
          - "'failed_when' not in runtime_service_limit_task"
          - "'ignore_errors' not in runtime_service_limit_task"
          - >-
            runtime_pid_inspect_task['ansible.builtin.command'].argv
            == ['podman', 'inspect', '--format', runtime_expected_pid_format,
                runtime_expected_container_name]
          - runtime_pid_inspect_task.register == 'autographs_deploy_controller_pid'
          - >-
            runtime_pid_assert_task['ansible.builtin.assert'].that
            == [runtime_expected_pid_assertion]
          - runtime_process_limit_read_task['ansible.builtin.slurp'].src == runtime_expected_limits_path
          - runtime_process_limit_read_task.register == 'autographs_deploy_controller_process_limits'
          - >-
            runtime_process_limit_task['ansible.builtin.assert'].that
            == [runtime_expected_process_assertion]
          - "'when' not in runtime_process_limit_task"
          - "'failed_when' not in runtime_process_limit_task"
          - "'ignore_errors' not in runtime_process_limit_task"
          - runtime_controller_restart_task['ansible.builtin.systemd'].name == 'autographs-controller.service'
          - runtime_controller_restart_task['ansible.builtin.systemd'].state == 'restarted'
          - "'failed_when' not in runtime_controller_restart_task"
          - "'ignore_errors' not in runtime_controller_restart_task"
      vars:
        runtime_expected_rhck_packages_variable: !unsafe "{{ autographs_deploy_rhck_packages }}"
        runtime_expected_rhck_exclude_value: !unsafe "{{ autographs_deploy_effective_dnf_excludes | join(' ') }}"

    - name: Require rendered persistence configuration semantics
      ansible.builtin.assert:
        that:
          - runtime_controller_quadlet | regex_findall('(?m)^LimitCORE=0$') | length == 1
          - runtime_coredump_config | regex_findall('(?m)^Storage=none$') | length == 1
          - runtime_coredump_config | regex_findall('(?m)^ProcessSizeMax=0$') | length == 1
          - runtime_controller_service_ini.Service.LimitCORE == '0'
          - runtime_coredump_ini.Coredump.Storage == 'none'
          - runtime_coredump_ini.Coredump.ProcessSizeMax == '0'

- name: Validate missing default UEK image fails before RHCK mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_kernel_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/autographs_deploy/tasks/kernel_persistence.yml') | from_yaml }}
    runtime_image_assertion_path: >-
      {{ playbook_dir }}/../roles/autographs_deploy/tasks/assert_kernel_images.yml
  tasks:
    - name: Record stale default UEK fixture
      ansible.builtin.set_fact:
        autographs_deploy_running_kernel_image_stat:
          stat:
            exists: true
            isreg: true
        autographs_deploy_default_kernel_image_stat:
          stat:
            exists: false
            isreg: false
        autographs_deploy_running_kernel_image: /boot/vmlinuz-fixture.el10uek.x86_64
        autographs_deploy_default_kernel_image: /boot/vmlinuz-stale.el10uek.x86_64
        runtime_kernel_guard_failed: false
        runtime_kernel_mutation_reached: false

    - name: Apply stale default UEK safety gate before simulated mutation
      block:
        - name: Evaluate production image safety assertions
          ansible.builtin.include_tasks: "{{ runtime_image_assertion_path }}"

        - name: Record forbidden simulated RHCK mutation
          ansible.builtin.set_fact:
            runtime_kernel_mutation_reached: true
      rescue:
        - name: Record expected stale default rejection
          ansible.builtin.set_fact:
            runtime_kernel_guard_failed: true

    - name: Require stale default rejection before mutation
      ansible.builtin.assert:
        that:
          - runtime_kernel_guard_failed
          - not runtime_kernel_mutation_reached

- name: Validate missing running UEK image fails before RHCK mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_kernel_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/autographs_deploy/tasks/kernel_persistence.yml') | from_yaml }}
    runtime_image_assertion_path: >-
      {{ playbook_dir }}/../roles/autographs_deploy/tasks/assert_kernel_images.yml
  tasks:
    - name: Record missing running UEK fixture
      ansible.builtin.set_fact:
        autographs_deploy_running_kernel_image_stat:
          stat:
            exists: false
            isreg: false
        autographs_deploy_default_kernel_image_stat:
          stat:
            exists: true
            isreg: true
        autographs_deploy_running_kernel_image: /boot/vmlinuz-missing.el10uek.x86_64
        autographs_deploy_default_kernel_image: /boot/vmlinuz-fixture.el10uek.x86_64
        runtime_kernel_guard_failed: false
        runtime_kernel_mutation_reached: false

    - name: Apply missing running UEK safety gate before simulated mutation
      block:
        - name: Evaluate production image safety assertions
          ansible.builtin.include_tasks: "{{ runtime_image_assertion_path }}"

        - name: Record forbidden simulated RHCK mutation
          ansible.builtin.set_fact:
            runtime_kernel_mutation_reached: true
      rescue:
        - name: Record expected missing running rejection
          ansible.builtin.set_fact:
            runtime_kernel_guard_failed: true

    - name: Require missing running rejection before mutation
      ansible.builtin.assert:
        that:
          - runtime_kernel_guard_failed
          - not runtime_kernel_mutation_reached

- name: Validate non-UEK image ownership fails before RHCK mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_kernel_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/autographs_deploy/tasks/kernel_persistence.yml') | from_yaml }}
    runtime_owner_assertion_path: >-
      {{ playbook_dir }}/../roles/autographs_deploy/tasks/assert_kernel_ownership.yml
  tasks:
    - name: Record invalid UEK ownership fixture
      ansible.builtin.set_fact:
        autographs_deploy_running_kernel_image_owner:
          rc: 0
          stdout: kernel-uek-core
        autographs_deploy_default_kernel_image_owner:
          rc: 0
          stdout: kernel-core
        runtime_kernel_guard_failed: false
        runtime_kernel_mutation_reached: false

    - name: Apply invalid UEK ownership gate before simulated mutation
      block:
        - name: Evaluate production ownership safety assertions
          ansible.builtin.include_tasks: "{{ runtime_owner_assertion_path }}"

        - name: Record forbidden simulated RHCK mutation
          ansible.builtin.set_fact:
            runtime_kernel_mutation_reached: true
      rescue:
        - name: Record expected ownership rejection
          ansible.builtin.set_fact:
            runtime_kernel_guard_failed: true

    - name: Require invalid ownership rejection before mutation
      ansible.builtin.assert:
        that:
          - runtime_kernel_guard_failed
          - not runtime_kernel_mutation_reached
