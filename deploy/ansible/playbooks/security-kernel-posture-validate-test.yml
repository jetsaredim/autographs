    security_patching_fixture_initramfs: "{{ security_patching_kernel_boot_dir }}/initramfs-{{ security_patching_fixture_release }}.img"
    security_patching_installed_package_names_probe_override:
      rc: 0
      stdout: "kernel-core\n"
      stdout_lines:
        - kernel-core
      stderr: ""
    security_patching_running_kernel_probe_override:
      rc: 0
      stdout: "{{ security_patching_fixture_release }}"
      stderr: ""
    security_patching_default_kernel_probe_override:
      rc: 0
      stdout: "{{ security_patching_fixture_image }}"
      stderr: ""
    security_patching_running_kernel_owner_probe_override: &missing_uek_owner
      rc: 0
      stdout: kernel-uek-core
      stderr: ""
    security_patching_default_kernel_owner_probe_override: *missing_uek_owner
    security_patching_kernel_boot_entry_probe_overrides:
      running: &missing_entry
        rc: 0
        stdout: |-
          kernel="{{ security_patching_fixture_image }}"
          initrd="{{ security_patching_fixture_initramfs }}"
        stderr: ""
      default: *missing_entry
    security_patching_scan_status: complete
    security_patching_update_entries: []
    security_patching_update_advisory_ids: []
    security_patching_classification_dnf_probe_override:
      rc: 0
      stdout: Nothing to do.
      stderr: ""
  tasks:
    - name: Create missing-initramfs scanner fixture boot directory
      ansible.builtin.file:
        path: "{{ security_patching_kernel_boot_dir }}"
        state: directory
        mode: "0700"

    - name: Create missing-initramfs scanner fixture kernel image
      ansible.builtin.copy:
        content: fixture
        dest: "{{ security_patching_fixture_image }}"
        mode: "0600"

    - name: Ensure release-matched initramfs is absent
      ansible.builtin.file:
        path: "{{ security_patching_fixture_initramfs }}"
        state: absent

    - name: Collect missing-initramfs kernel posture fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: kernel_posture

    - name: Classify missing-initramfs kernel posture fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert missing release-matched initramfs cannot configure or approve
      ansible.builtin.assert:
        that:
          - not (security_patching_running_kernel_is_valid_uek | bool)
          - not (security_patching_default_kernel_is_valid_uek | bool)
          - security_patching_next_action | trim == 'investigate'
          - security_patching_next_action_label | trim | length == 0

