- name: Validate UEK-only scanner inventory contract
  hosts: localhost
  gather_facts: false
  vars:
    security_role_dir: "{{ playbook_dir }}/../roles/security_patching"
    deploy_role_dir: "{{ playbook_dir }}/../roles/autographs_deploy"
    security_defaults: >-
      {{ lookup('ansible.builtin.file', security_role_dir ~ '/defaults/main.yml') | from_yaml }}
    deploy_defaults: >-
      {{ lookup('ansible.builtin.file', deploy_role_dir ~ '/defaults/main.yml') | from_yaml }}
    security_kernel_posture_tasks: >-
      {{ lookup('ansible.builtin.file', security_role_dir ~ '/tasks/kernel_posture.yml') | from_yaml }}
  tasks:
    - name: Select kernel posture inventory tasks
      ansible.builtin.set_fact:
        security_inventory_package_matches: >-
          {{ security_kernel_posture_tasks | selectattr('name', 'equalto', 'Inventory installed package names for kernel posture') | list }}
        security_record_rhck_matches: >-
          {{ security_kernel_posture_tasks | selectattr('name', 'equalto', 'Record installed RHCK configuration drift') | list }}
        security_running_kernel_matches: >-
          {{ security_kernel_posture_tasks | selectattr('name', 'equalto', 'Inspect running kernel release for kernel posture') | list }}
        security_default_kernel_matches: >-
          {{ security_kernel_posture_tasks | selectattr('name', 'equalto', 'Inspect default boot kernel for kernel posture') | list }}
        security_record_uek_matches: >-
          {{ security_kernel_posture_tasks | selectattr('name', 'equalto', 'Record verified UEK kernel posture') | list }}

    - name: Require exact UEK-only scanner inventory semantics
      ansible.builtin.assert:
        that:
          - security_inventory_package_matches | length == 1
          - security_record_rhck_matches | length == 1
          - security_running_kernel_matches | length == 1
          - security_default_kernel_matches | length == 1
          - security_record_uek_matches | length == 1
          - security_defaults.security_patching_rhck_packages == deploy_defaults.autographs_deploy_rhck_packages
          - "'kernel-headers' not in security_defaults.security_patching_rhck_packages"
          - "'kernel-tools' not in security_defaults.security_patching_rhck_packages"
          - "'kernel-tools-libs' not in security_defaults.security_patching_rhck_packages"
          - "'kernel-abi-stablelists' in security_defaults.security_patching_rhck_packages"
          - "'kernel-doc' in security_defaults.security_patching_rhck_packages"
          - "'kernel-uki-virt' in security_defaults.security_patching_rhck_packages"
          - "'kernel-uki-virt-addons' in security_defaults.security_patching_rhck_packages"
          - "'kernel-debug-uki-virt' in security_defaults.security_patching_rhck_packages"
          - "'kernel-debug-devel-matched' in security_defaults.security_patching_rhck_packages"
          - "'kernel-uek-core' is match(security_defaults.security_patching_reboot_allowed_package_regex)"
          - "'kernel-uek64k' is match(security_defaults.security_patching_reboot_allowed_package_regex)"
          - "'kernel-uek64k-modules-wireless' is match(security_defaults.security_patching_reboot_allowed_package_regex)"
          - "'kernel-uek64kextra' is not match(security_defaults.security_patching_reboot_allowed_package_regex)"
          - "'kernel-core' is not match(security_defaults.security_patching_reboot_allowed_package_regex)"
          - security_inventory_package_matches[0]['ansible.builtin.command'].argv == ['rpm', '-qa', '--qf', '%{NAME}\n']
          - security_record_rhck_matches[0]['ansible.builtin.set_fact'].security_patching_installed_rhck_packages is search('intersect')
          - security_running_kernel_matches[0]['ansible.builtin.command'].argv == ['uname', '-r']
          - security_default_kernel_matches[0]['ansible.builtin.command'].argv == ['grubby', '--default-kernel']
          - security_default_kernel_matches[0].failed_when == false
          - security_record_uek_matches[0]['ansible.builtin.set_fact'].security_patching_running_kernel_is_valid_uek is search('kernel-uek')
          - security_record_uek_matches[0]['ansible.builtin.set_fact'].security_patching_default_kernel_is_valid_uek is search('kernel-uek')
          - security_record_uek_matches[0]['ansible.builtin.set_fact'].security_patching_running_kernel_is_valid_uek is search('boot_entry.valid')
          - security_record_uek_matches[0]['ansible.builtin.set_fact'].security_patching_default_kernel_is_valid_uek is search('boot_entry.valid')
