- name: Validate authoritative security finding next actions
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_kernel_inventory_is_complete: true
    security_patching_running_kernel_is_valid_uek: true
    security_patching_default_kernel_is_valid_uek: true
  tasks:
    - name: Record DNF-applicable finding fixture
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-11111
        security_patching_update_entries:
          - advisory_id: ELSA-2026-11111
            packages:
              - openssl
        security_patching_classification_dnf_probe_override:
          rc: 1
          stdout: |-
            Upgrading:
              openssl x86_64 3.5.1-1
            Transaction Summary
          stderr: ""

    - name: Classify DNF-applicable finding fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert DNF-applicable findings request normal update approval
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'update'
          - security_patching_next_action_label | trim == 'approved-production-update'
          - security_patching_classification_dnf_work | bool
          - not (security_patching_classification_dnf_noop | bool)

    - name: Record reboot-only finding fixture
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-22222
        security_patching_update_entries:
          - advisory_id: ELSA-2026-22222
            packages:
              - kernel-uek-core
              - kernel-uek-modules
              - perf
        security_patching_classification_dnf_probe_override:
          rc: 0
          stdout: Nothing to do.
          stderr: ""

    - name: Classify reboot-only finding fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert reboot-only findings request separate reboot approval
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'reboot'
          - security_patching_next_action_label | trim == 'approved-production-reboot'
          - security_patching_classification_dnf_noop | bool
          - security_patching_classification_disallowed_packages == []

    - name: Record mixed unclassifiable finding fixture
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-33333
        security_patching_update_entries:
          - advisory_id: ELSA-2026-33333
            packages:
              - kernel-uek-core
              - openssl
        security_patching_classification_dnf_probe_override:
          rc: 0
          stdout: Nothing to do.
          stderr: ""

    - name: Classify mixed unclassifiable finding fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert mixed no-op findings require investigation
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'investigate'
          - security_patching_next_action_label | trim | length == 0
          - security_patching_classification_disallowed_packages == ['openssl']

    - name: Record clean finding fixture
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_update_advisory_ids: []
        security_patching_update_entries: []
        security_patching_classification_dnf_probe_override:
          rc: 0
          stdout: ""
          stderr: ""

    - name: Classify clean finding fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert clean findings close the scanner issue
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'close'
          - security_patching_next_action_label | trim | length == 0

    - name: Record RHCK configuration drift fixture
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_installed_rhck_packages:
          - kernel
          - kernel-core
        security_patching_update_advisory_ids:
          - ELSA-2026-44444
        security_patching_update_entries:
          - advisory_id: ELSA-2026-44444
            packages:
              - kernel-core
        security_patching_classification_dnf_probe_override:
          rc: 1
          stdout: |-
            Upgrading:
              kernel-core x86_64 6.12.0-999
            Transaction Summary
          stderr: ""

    - name: Classify RHCK configuration drift before package work
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert RHCK drift requests deployment convergence without approval
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'configure'
          - security_patching_next_action_label | trim | length == 0
          - security_patching_classification_rhck_packages == ['kernel', 'kernel-core']
          - security_patching_classification_dnf_work | bool
          - security_patching_next_action_reason is search('without rebooting')

- name: Validate production-shaped UEK advisories and failed probe gate
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record production-shaped no-op DNF probe
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_kernel_inventory_is_complete: true
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: true
        security_patching_installed_rhck_packages: []
        security_patching_update_advisory_ids:
          - ELSA-2026-500374
          - ELSA-2026-500394
          - ELSA-2026-500399
        security_patching_update_entries:
          - advisory_id: ELSA-2026-500374
            packages:
              - kernel-uek
              - kernel-uek-core
              - kernel-uek-modules
              - kernel-uek64k
              - kernel-uek64k-core
              - kernel-uek64k-devel
              - kernel-uek64k-modules
              - kernel-uek64k-modules-core
              - kernel-uek64k-modules-deprecated
              - kernel-uek64k-modules-desktop
              - kernel-uek64k-modules-extra
              - kernel-uek64k-modules-extra-netfilter
              - kernel-uek64k-modules-usb
              - kernel-uek64k-modules-wireless
              - perf
          - advisory_id: ELSA-2026-500394
            packages: [kernel-uek-core, kernel-uek-debug-core, bpftool]
          - advisory_id: ELSA-2026-500399
            packages: [kernel-uek-core, kernel-uek-devel, python3-perf]
        security_patching_classification_dnf_probe_override:
          rc: 0
          stdout: |-
            Dependencies resolved.
            Nothing to do.
            Complete!
            token=fixture-secret https://user:fixture-secret@example.invalid/repo
            Authorization: Bearer fixture-secret
          stderr: ""

    - name: Classify production-shaped no-op
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Require reboot-only classification with recorded evidence
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'reboot'
          - security_patching_next_action_label | trim == 'approved-production-reboot'
          - security_patching_classification_dnf_evidence.rc | int == 0
          - security_patching_classification_dnf_evidence.noop | bool
          - security_patching_classification_dnf_evidence.stdout_signals | length == 1
          - "'fixture-secret' not in (security_patching_classification_dnf_evidence | to_json)"
          - security_patching_classification_dnf_evidence.stdout_sha256 | length == 64
          - security_patching_classification_dnf_evidence.stdout_preview is not defined
          - security_patching_classification_disallowed_packages == []

    - name: Record ambiguous DNF probe
      ansible.builtin.set_fact:
        security_patching_classification_dnf_probe_override:
          rc: 0
          stdout: Dependencies resolved.
          stderr: ""

    - name: Classify ambiguous DNF probe
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Require ambiguous probe to block reboot
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'investigate'
          - security_patching_next_action_label | trim | length == 0
          - security_patching_next_action_reason is search('rc=0')
          - not (security_patching_classification_dnf_evidence.noop | bool)

    - name: Record failed DNF probe
      ansible.builtin.set_fact:
        security_patching_classification_dnf_probe_override:
          rc: 2
          stdout: Nothing to do.
          stderr: "Error: repository unavailable"

    - name: Classify failed DNF probe
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Require failed probe to block reboot despite no-op words
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'investigate'
          - security_patching_next_action_label | trim | length == 0
          - security_patching_classification_dnf_evidence.rc | int == 2
          - not (security_patching_classification_dnf_evidence.noop | bool)
          - security_patching_classification_dnf_evidence.stderr_signals | length == 1

- name: Validate running RHCK requires recovery instead of convergence
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_scan_status: complete
    security_patching_kernel_inventory_is_complete: true
    security_patching_running_kernel_release: 6.12.0-211.56.1.el10_2.x86_64
    security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
    security_patching_running_kernel_is_valid_uek: false
    security_patching_default_kernel_is_valid_uek: true
    security_patching_installed_rhck_packages:
      - kernel-core
    security_patching_update_advisory_ids:
      - ELSA-2026-44444
    security_patching_update_entries:
      - advisory_id: ELSA-2026-44444
        packages:
          - kernel-core
    security_patching_classification_dnf_probe_override:
      rc: 1
      stdout: Transaction Summary
      stderr: ""
  tasks:
    - name: Restore running RHCK fixture after prior classification play
      ansible.builtin.set_fact:
        security_patching_scan_status: complete
        security_patching_kernel_inventory_is_complete: true
        security_patching_running_kernel_release: 6.12.0-211.56.1.el10_2.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: false
        security_patching_default_kernel_is_valid_uek: true
        security_patching_installed_rhck_packages: [kernel-core]
        security_patching_update_advisory_ids: [ELSA-2026-44444]
        security_patching_update_entries:
          - advisory_id: ELSA-2026-44444
            packages: [kernel-core]
        security_patching_classification_dnf_probe_override:
          rc: 1
          stdout: Transaction Summary
          stderr: ""

    - name: Classify running RHCK fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_findings

    - name: Assert running RHCK cannot enter approval or configure loops
      ansible.builtin.assert:
        that:
          - security_patching_next_action | trim == 'investigate'
          - security_patching_next_action_label | trim | length == 0
          - security_patching_next_action_reason is search('Kernel recovery is required')
          - security_patching_next_action_reason is search('schedule a reboot')

