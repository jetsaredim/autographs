---
- name: Reload the controller after an approved credential change
  hosts: runtime
  gather_facts: false
  become: true
  vars:
    autographs_deploy_explicit_cutover: true
    rotation_credential: "{{ lookup('env', 'ROTATION_CREDENTIAL') }}"
  tasks:
    - name: Check prerequisites for credential rotation
      tags: [rotation_preflight]
      block:
        - name: Check the publish freeze record
          ansible.builtin.stat:
            path: "{{ autographs_deploy_path }}/private/publish-freeze.json"
          register: rotation_freeze

        - name: Check the controller service
          ansible.builtin.command:
            argv: [systemctl, show, --property=LoadState, --value, autographs-controller.service]
          register: rotation_service
          changed_when: false

        - name: Check the deployed wallet directory
          ansible.builtin.stat:
            path: "{{ autographs_deploy_path }}/wallet"
          register: rotation_wallet_dir
          when: rotation_credential == 'oracle_db_wallet_password'

        - name: Require an installed controller and no interrupted deploy
          ansible.builtin.assert:
            that:
              - rotation_credential in ['admin_password_hash', 'oracle_db_wallet_password']
              - not rotation_freeze.stat.exists
              - rotation_service.stdout | trim == 'loaded'
              - rotation_credential != 'oracle_db_wallet_password' or rotation_wallet_dir.stat.isdir | default(false)
            fail_msg: Rotation requires an installed controller and a completed deployment.

    - name: Replace the wallet while the controller is stopped
      when: rotation_credential == 'oracle_db_wallet_password'
      block:
        - name: Stop controller before replacing its wallet
          ansible.builtin.systemd_service:
            name: autographs-controller.service
            state: stopped

        - name: Apply the deployment wallet tasks
          ansible.builtin.include_role:
            name: autographs_deploy
            tasks_from: wallet

    - name: Restart controller with the current Vault values
      ansible.builtin.systemd_service:
        name: autographs-controller.service
        state: restarted

    - name: Verify the restarted Oracle-backed controller
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/admin/api/health
        status_code: 200
        use_proxy: false
      register: rotation_health
      retries: 30
      delay: 3
      until:
        - rotation_health.status | default(0) == 200
        - (rotation_health.json | default({})).controllerDbProvider | default('') == 'oracle'
        - (rotation_health.json | default({})).oracleConfigured | default(false) | bool
