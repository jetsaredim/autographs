---
- name: Validate or resume credential rotation within a frozen publisher cutover
  hosts: runtime
  gather_facts: false
  become: true
  vars:
    autographs_deploy_explicit_cutover: true
    rotation_credential: "{{ lookup('env', 'ROTATION_CREDENTIAL') }}"
  tasks:
    - name: Verify credential-only cutover uses the installed release
      tags: [rotation_identity]
      block:
        - name: Read installed controller release mapping
          ansible.builtin.slurp:
            src: "{{ autographs_deploy_path }}/env/app.env"
          register: rotation_deployed_env
          no_log: true

        - name: Check installed wallet directory before freezing
          ansible.builtin.stat:
            path: "{{ autographs_deploy_path }}/wallet"
          register: rotation_wallet_dir
          when: rotation_credential == 'oracle_db_wallet_password'

        - name: Require the installed release mapping and wallet directory
          ansible.builtin.assert:
            that:
              - "('AUTOGRAPHS_REPO_VERSION=' ~ autographs_deploy_repo_version) in rotation_env_lines"
              - "('AUTOGRAPHS_CONTROLLER_DIGEST=' ~ autographs_deploy_controller_digest) in rotation_env_lines"
              - "('AUTOGRAPHS_SOURCE_REVISION=' ~ autographs_deploy_source_revision) in rotation_env_lines"
              - rotation_credential != 'oracle_db_wallet_password' or rotation_wallet_dir.stat.isdir | default(false)
          vars:
            rotation_env_lines: "{{ (rotation_deployed_env.content | b64decode).splitlines() }}"
          no_log: true

    - name: Prove credential rotation is within the stopped-controller window
      tags: [rotation_stopped, rotation_resume]
      block:
        - name: Read the durable publish freeze record
          ansible.builtin.slurp:
            src: "{{ autographs_deploy_path }}/private/publish-freeze.json"
          register: rotation_freeze_file

        - name: Read the controller systemd state
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, autographs-controller.service]
          register: rotation_service
          changed_when: false

        - name: Check whether Podman still has the controller container
          ansible.builtin.command:
            argv: [podman, container, exists, autographs-controller]
          register: rotation_container
          changed_when: false
          failed_when: rotation_container.rc not in [0, 1]

        - name: Check whether the existing controller container is stopped
          ansible.builtin.command:
            argv: [podman, inspect, --format, "{% raw %}{{.State.Running}}{% endraw %}", autographs-controller]
          register: rotation_container_state
          changed_when: false
          when: rotation_container.rc == 0

        - name: Require the matching freeze record and a stopped controller
          ansible.builtin.assert:
            that:
              - rotation_credential in ['admin_password_hash', 'oracle_db_wallet_password']
              - rotation_freeze.release_tag == autographs_deploy_repo_version
              - rotation_freeze.controller_digest == autographs_deploy_controller_digest
              - rotation_service.stdout | trim in ['inactive', 'failed']
              - rotation_container.rc == 1 or rotation_container_state.stdout | trim == 'false'
            fail_msg: Secret rotation requires the reviewed cutover freeze and a stopped controller.
          vars:
            rotation_freeze: "{{ rotation_freeze_file.content | b64decode | from_json }}"

    - name: Install the checked wallet while the controller is stopped
      tags: [rotation_resume]
      when: rotation_credential == 'oracle_db_wallet_password'
      block:
        - name: Require the wallet file verified by the rotation job
          ansible.builtin.assert:
            that:
              - lookup('env', 'AUTOGRAPHS_VERIFIED_WALLET_FILE') | length > 0

        - name: Apply the deployment wallet tasks
          ansible.builtin.include_role:
            name: autographs_deploy
            tasks_from: wallet
            apply:
              tags: [rotation_resume]

    - name: Start the current controller with the rotated Vault value
      tags: [rotation_resume]
      ansible.builtin.systemd_service:
        name: autographs-controller.service
        state: started

    - name: Verify the restarted Oracle-backed controller
      tags: [rotation_resume]
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/admin/api/health
        status_code: 200
        use_proxy: false
      register: rotation_health
      retries: 30
      delay: 3
      until:
        - rotation_health.status | default(0) == 200
        - (rotation_health.json | default({})).controllerDbProvider | default('') == 'oracle'
        - (rotation_health.json | default({})).oracleConfigured | default(false) | bool
