- name: Validate production admin credential selection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    autographs_deploy_admin_password_hash: ""
    autographs_admin_password_hash: ""
    autographs_deploy_app_env_stat:
      stat:
        exists: true
    autographs_deploy_app_env_file:
      content: >-
        {{
          (
            'AUTOGRAPHS_ADMIN_PASSWORD=\n'
            ~ 'AUTOGRAPHS_ADMIN_PASSWORD_HASH=\n'
            ~ 'AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID=retired-coordinate\n'
          ) | b64encode
        }}
  tasks:
    - name: Exercise missing current Vault coordinate and direct hash
      block:
        - name: Run production admin credential validation
          ansible.builtin.include_tasks: ../roles/autographs_deploy/tasks/admin_credentials.yml

        - name: Mark unexpected credential validation success
          ansible.builtin.set_fact:
            autographs_admin_missing_secret_failed_closed: false
      rescue:
        - name: Mark expected credential validation failure
          ansible.builtin.set_fact:
            autographs_admin_missing_secret_failed_closed: >-
              {{
                ansible_failed_task.name
                == 'Validate deployed admin authentication secret'
              }}

    - name: Confirm missing current credential fails closed
      ansible.builtin.assert:
        that:
          - autographs_admin_missing_secret_failed_closed | default(false) | bool
        fail_msg: >-
          Production deploy accepted a previous Vault deployment after both the
          current Vault coordinate and direct admin hash were removed.
