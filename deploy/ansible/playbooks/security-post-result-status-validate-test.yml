- name: Validate security update result requires complete post-update scans
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_post_result_fixture_runtime
    security_patching_request_instances:
      complete-host:
        advisory_ids:
          - ELSA-2026-11111
      degraded-host:
        advisory_ids:
          - ELSA-2026-22222
      missing-host:
        advisory_ids: []
      malformed-host:
        advisory_ids: []
    security_patching_result_guard_failed: false
    security_patching_result_guard_failure_message: ""
    security_patching_fixture_probe: &complete_probe
      rc: 0
      stdout: fixture
      stderr: ""
    security_patching_fixture_boot_entry: &valid_boot_entry
      valid: true
      expected_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
      entry_kernel_images:
        - /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
      expected_initramfs: /boot/initramfs-6.12.0-fixture.el10uek.x86_64.img
      initramfs_images:
        - /boot/initramfs-6.12.0-fixture.el10uek.x86_64.img
      probe: *complete_probe
  tasks:
    - name: Add complete post-update fixture host
      ansible.builtin.add_host:
        name: complete-host
        groups: security_post_result_fixture_runtime
        security_patching_post_update_scan_status: complete
        security_patching_post_update_running_kernel_release: 6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_running_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_default_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_installed_rhck_packages: []
        security_patching_post_update_kernel_inventory_is_complete: true
        security_patching_post_update_kernel_inventory_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_default_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_running_kernel_is_valid_uek: true
        security_patching_post_update_default_kernel_is_valid_uek: true
        security_patching_post_update_advisory_ids: []
        security_patching_post_update_entries: []
        security_patching_post_update_next_action: close
        security_patching_ksplice_available: false
        security_patching_ksplice_apply_mode: report_only
        security_patching_dnf_changed: false
        security_patching_approved_advisory_ids: []

    - name: Add degraded post-update fixture host
      ansible.builtin.add_host:
        name: degraded-host
        groups: security_post_result_fixture_runtime
        security_patching_post_update_scan_status: degraded
        security_patching_post_update_running_kernel_release: 6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_running_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_default_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_installed_rhck_packages: []
        security_patching_post_update_kernel_inventory_is_complete: true
        security_patching_post_update_kernel_inventory_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_default_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_running_kernel_is_valid_uek: true
        security_patching_post_update_default_kernel_is_valid_uek: true
        security_patching_post_update_advisory_ids: []
        security_patching_post_update_entries: []
        security_patching_post_update_next_action: investigate
        security_patching_ksplice_available: false
        security_patching_ksplice_apply_mode: report_only
        security_patching_dnf_changed: false
        security_patching_approved_advisory_ids: []

    - name: Add fixture host with an absent required snapshot field
      ansible.builtin.add_host:
        name: missing-host
        groups: security_post_result_fixture_runtime
        security_patching_post_update_scan_status: complete
        security_patching_post_update_running_kernel_release: 6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_running_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_default_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_installed_rhck_packages: []
        security_patching_post_update_kernel_inventory_is_complete: true
        security_patching_post_update_running_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_default_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_running_kernel_is_valid_uek: true
        security_patching_post_update_default_kernel_is_valid_uek: true
        security_patching_post_update_advisory_ids: []
        security_patching_post_update_entries: []
        security_patching_post_update_next_action: close

    - name: Add fixture host with malformed structured snapshot evidence
      ansible.builtin.add_host:
        name: malformed-host
        groups: security_post_result_fixture_runtime
        security_patching_post_update_scan_status: complete
        security_patching_post_update_running_kernel_release: 6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_running_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_default_kernel_image: /boot/vmlinuz-6.12.0-fixture.el10uek.x86_64
        security_patching_post_update_installed_rhck_packages: []
        security_patching_post_update_kernel_inventory_is_complete: true
        security_patching_post_update_kernel_inventory_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_default_kernel_owner_probe_facts: "{{ security_patching_fixture_probe }}"
        security_patching_post_update_running_kernel_boot_entry:
          valid: true
          probe:
            rc: 0
        security_patching_post_update_default_kernel_boot_entry: "{{ security_patching_fixture_boot_entry }}"
        security_patching_post_update_running_kernel_is_valid_uek: true
        security_patching_post_update_default_kernel_is_valid_uek: true
        security_patching_post_update_advisory_ids: []
        security_patching_post_update_entries: []
        security_patching_post_update_next_action: close

    - name: Run result publication guard against mixed post-update statuses
      block:
        - name: Attempt to publish result from mixed post-update fixtures
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: post_result
      rescue:
        - name: Record expected result publication guard failure
          ansible.builtin.set_fact:
            security_patching_result_guard_failed: true
            security_patching_result_guard_failure_message: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert mixed post-update statuses are rejected before result publication
      ansible.builtin.assert:
        that:
          - security_patching_result_guard_failed
          - security_patching_incomplete_post_update_hosts | sort == ['degraded-host', 'malformed-host', 'missing-host']
          - "'Refusing to publish a clean security update result' in security_patching_result_guard_failure_message"
