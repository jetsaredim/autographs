- name: Validate aggregate preflight blocks partial multi-host mutation
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_update_preflight_fixture_runtime
  tasks:
    - name: Add exact preflight fixture host
      ansible.builtin.add_host:
        name: exact-host
        groups: security_update_preflight_fixture_runtime
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-11111
        security_patching_next_action: update

    - name: Add drifted preflight fixture host
      ansible.builtin.add_host:
        name: drifted-host
        groups: security_update_preflight_fixture_runtime
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-33333
        security_patching_next_action: update

    - name: Record aggregate approved update fixture
      ansible.builtin.set_fact:
        security_patching_request_instances:
          exact-host:
            advisory_ids:
              - ELSA-2026-11111
          drifted-host:
            advisory_ids:
              - ELSA-2026-22222

    - name: Classify aggregate approved update fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: classify_update_request

    - name: Assert one drifted host disables all package mutation
      ansible.builtin.assert:
        that:
          - security_patching_request_reconciliation_only | bool
          - security_patching_request_reconciliation_hosts == ['drifted-host']

- name: Validate security update drift becomes reconciliation-only
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record drifted approved update fixture
      ansible.builtin.set_fact:
        security_patching_request_instances:
          localhost:
            advisory_ids:
              - ELSA-2026-11111
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-22222
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_update_advisories:
          - advisory_id: ELSA-2026-22222
            packages:
              - openssl
        security_patching_update_entries:
          - advisory_id: ELSA-2026-22222
            packages:
              - openssl
        security_patching_next_action: update
        security_patching_next_action_label: approved-production-update
        security_patching_next_action_reason: Advisory-scoped DNF reported package work.

    - name: Reconcile drifted approved update fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: patch

    - name: Assert drift preserves authoritative findings without package mutation
      ansible.builtin.assert:
        that:
          - security_patching_update_drift_detected | bool
          - security_patching_reconciliation_only | bool
          - not (security_patching_dnf_changed | bool)
          - security_patching_post_update_scan_status == 'complete'
          - security_patching_post_update_advisory_ids == ['ELSA-2026-22222']
          - security_patching_post_update_next_action == 'update'
          - security_patching_post_update_next_action_label == 'approved-production-update'

    - name: Record clean current scan against stale approval fixture
      ansible.builtin.set_fact:
        security_patching_request_instances:
          localhost:
            advisory_ids:
              - ELSA-2026-33333
        security_patching_scan_status: complete
        security_patching_update_advisory_ids: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_update_advisories: []
        security_patching_update_entries: []
        security_patching_next_action: close
        security_patching_next_action_label: ""
        security_patching_next_action_reason: The complete OpenSCAP scan is clean.

    - name: Reconcile clean current scan against stale approval fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: patch

    - name: Assert stale approval clean scan closes without package mutation
      ansible.builtin.assert:
        that:
          - security_patching_update_drift_detected | bool
          - security_patching_reconciliation_only | bool
          - not (security_patching_dnf_changed | bool)
          - security_patching_post_update_scan_status == 'complete'
          - security_patching_post_update_advisory_ids == []
          - security_patching_post_update_next_action == 'close'
          - security_patching_post_update_next_action_label | length == 0

- name: Validate clean reconciliation converges the issue to closed state
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_update_clean_reconciliation_runtime
    security_patching_scan_id: security-update-clean-reconciliation-test
    security_patching_scan_timestamp: "2026-09-15T00:00:00Z"
    security_patching_issue_number: "246"
    security_patching_github_api_url: http://127.0.0.1:1
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fixture-token
    security_patching_report_path: /tmp/autographs-security-update-clean-reconciliation-report.md
    security_patching_result_comment_path: /tmp/autographs-security-update-clean-reconciliation-comment.md
    security_patching_clean_reconciliation_reached_github: false
  tasks:
    - name: Add clean reconciliation fixture host
      ansible.builtin.add_host:
        name: production
        groups: security_update_clean_reconciliation_runtime
        security_patching_post_update_scan_status: complete
        security_patching_post_update_advisory_ids: []
        security_patching_post_update_advisories: []
        security_patching_post_update_entries: []
        security_patching_post_update_ksplice_aware_advisory_ids: []
        security_patching_post_update_next_action: close
        security_patching_post_update_next_action_label: ""
        security_patching_update_drift_detected: true
        security_patching_approved_advisory_ids:
          - ELSA-2026-33333
        security_patching_ksplice_available: false
        security_patching_ksplice_apply_mode: report_only
        security_patching_dnf_changed: false

    - name: Run clean issue reconciliation until fake GitHub endpoint
      block:
        - name: Attempt clean issue reconciliation with fake GitHub endpoint
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: post_result
      rescue:
        - name: Record expected fake GitHub clean reconciliation failure
          ansible.builtin.set_fact:
            security_patching_clean_reconciliation_reached_github: true

    - name: Assert clean reconciliation prepared authoritative closed state
      ansible.builtin.assert:
        that:
          - security_patching_clean_reconciliation_reached_github
          - security_patching_remaining_hosts == []
          - security_patching_next_action | trim == 'close'
          - security_patching_next_action_label | trim | length == 0
          - "'patch-scan-open' not in security_patching_reconciled_issue_labels"
          - "'instances: {}' in security_patching_refreshed_report_body"
          - "'No approval action is required' in security_patching_refreshed_report_body"
          - "'No package changes were attempted' in lookup('ansible.builtin.file', security_patching_result_comment_path)"
          - "'ELSA-2026-33333' in lookup('ansible.builtin.file', security_patching_result_comment_path)"
