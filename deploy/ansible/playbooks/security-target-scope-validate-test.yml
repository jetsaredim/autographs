- name: Validate missing scanner target group fails closed
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_missing_fixture_runtime
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fixture-token
    security_target_scope_missing_failed: false
  tasks:
    - name: Run scanner publication with missing target group
      block:
        - name: Attempt scanner publication with missing target group
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: create_issue
      rescue:
        - name: Record missing target group failure
          ansible.builtin.set_fact:
            security_target_scope_missing_failed: true
            security_target_scope_missing_failed_task: "{{ ansible_failed_task.name | default('') }}"

    - name: Assert missing target group failed before issue publication
      ansible.builtin.assert:
        that:
          - security_target_scope_missing_failed
          - security_target_scope_missing_failed_task == 'Require configured security patching target group'

- name: Validate empty scanner target group fails closed
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_empty_fixture_runtime
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fixture-token
