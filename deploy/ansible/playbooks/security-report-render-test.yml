- name: Test production security update report rendering
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_scan_id: security-scan-render-test
    security_patching_scan_timestamp: "2026-08-02T00:00:00Z"
    security_patching_target_group: runtime
    security_patching_approval_label: approved-production-update
    security_patching_next_action: update
    security_patching_target_hosts:
      - clean-production
      - production
    security_patching_hosts_with_findings:
      - production
    security_patching_enrichment_status: complete
    security_patching_enrichment_message: Oracle Linux OpenSCAP OVAL evaluation completed.
    security_patching_report_max_cves_per_row: 2
    security_patching_report_max_body_bytes: 60000
    security_patching_report_path: /tmp/autographs-security-report-render-test.md
    security_patching_enrichment_by_host:
      production:
        advisories:
          - advisory_id: ELSA-2025-11111
            severity: Important
            cves:
              - CVE-2025-0001
              - CVE-2025-0002
              - CVE-2025-0003
            errata_link: https://linux.oracle.com/errata/ELSA-2025-11111.html
            summary: ELSA-2025-11111 kernel security update
            package_count: 2
            packages:
              - kernel
              - kernel-core
            ksplice_aware: true
          - advisory_id: ELSA-2025-22222
            severity: Moderate
            cves:
              - CVE-2025-0004
            errata_link: https://linux.oracle.com/errata/ELSA-2025-22222.html
            summary: ELSA-2025-22222 openssl security update
            package_count: 1
            packages:
              - openssl
            ksplice_aware: false
          - advisory_id: ELSA-2025-33333
            severity: Low
            cves: []
            errata_link: https://linux.oracle.com/errata/ELSA-2025-33333.html
            summary: ELSA-2025-33333 acl and sudo security update
            package_count: 2
            packages:
              - acl
              - sudo
            ksplice_aware: false
        entries:
          - advisory_id: ELSA-2025-11111
            severity: Important
            packages:
              - kernel
              - kernel-core
            package_count: 2
            ksplice_aware: true
            cves:
              - CVE-2025-0001
            errata_link: https://linux.oracle.com/errata/ELSA-2025-11111.html
            summary: ELSA-2025-11111 kernel security update
          - advisory_id: ELSA-2025-22222
            severity: Moderate
            packages:
              - openssl
            package_count: 1
            ksplice_aware: false
            cves:
              - CVE-2025-0004
            errata_link: https://linux.oracle.com/errata/ELSA-2025-22222.html
            summary: ELSA-2025-22222 openssl security update
          - advisory_id: ELSA-2025-33333
            severity: Low
            packages:
              - acl
              - sudo
            package_count: 2
            ksplice_aware: false
            cves: []
            errata_link: https://linux.oracle.com/errata/ELSA-2025-33333.html
            summary: ELSA-2025-33333 acl and sudo security update
  tasks:
    - name: Add clean production scan fact fixture host
      ansible.builtin.add_host:
        name: clean-production
        security_patching_update_advisory_ids: []

    - name: Add production scan fact fixture host
      ansible.builtin.add_host:
        name: production
        security_patching_update_advisory_ids:
          - ELSA-2025-11111
          - ELSA-2025-22222
          - ELSA-2025-33333
        security_patching_update_ksplice_aware_advisory_ids:
          - ELSA-2025-11111
        security_patching_update_entries: "{{ security_patching_enrichment_by_host.production.entries }}"
        security_patching_running_kernel_release: 6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: true

    - name: Render security update report fixture
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/security_patching/templates/security-report.md.j2"
        dest: "{{ security_patching_report_path }}"
        mode: "0600"

    - name: Inspect rendered report fixture
      ansible.builtin.stat:
        path: "{{ security_patching_report_path }}"
      register: security_patching_render_test_file

    - name: Read rendered report fixture
      ansible.builtin.slurp:
        src: "{{ security_patching_report_path }}"
      register: security_patching_render_test_file_content

    - name: Decode rendered report fixture
      ansible.builtin.set_fact:
        security_patching_render_test_body: "{{ security_patching_render_test_file_content.content | b64decode }}"

    - name: Extract scanner metadata fixture
      ansible.builtin.set_fact:
        security_patching_render_test_metadata_blocks: "{{ security_patching_render_test_body | regex_findall(metadata_block_pattern) }}"
      vars:
        metadata_block_pattern: '(?s)<!-- autographs-security-patch-metadata[\r\n]+(.*?)[\r\n]+-->'

    - name: Parse scanner metadata fixture
      ansible.builtin.set_fact:
        security_patching_render_test_metadata: "{{ security_patching_render_test_metadata_blocks[0] | from_yaml }}"

    - name: Assert rendered report fixture contract
      ansible.builtin.assert:
        that:
          - security_patching_render_test_metadata_blocks | length == 1
          - security_patching_render_test_metadata.instances.production.advisory_ids | length == 3
          - security_patching_render_test_metadata.instances['clean-production'].advisory_ids == []
          - security_patching_render_test_metadata.instances.keys() | sort == ['clean-production', 'production']
          - security_patching_render_test_metadata.approval_label == 'approved-production-update'
          - security_patching_render_test_file.stat.size <= security_patching_report_max_body_bytes
          - "'## Advisory review summary' in security_patching_render_test_body"
          - "'## Advisory finding detail sample' not in security_patching_render_test_body"
          - "'Ksplice-specific OVAL findings' in security_patching_render_test_body"
          - "'Package sample' in security_patching_render_test_body"
          - "'`kernel`, `kernel-core`' in security_patching_render_test_body"
          - "'ELSA-2025-33333' in security_patching_render_test_body"
          - "'+1 more' in security_patching_render_test_body"
          - "'Apply the label `approved-production-update`' in security_patching_render_test_body"

- name: Test UEK-only configuration drift report rendering
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_scan_id: security-scan-kernel-drift-render-test
    security_patching_scan_timestamp: "2026-09-20T00:00:00Z"
    security_patching_target_group: runtime
    security_patching_approval_label: ""
    security_patching_report_approval_label: ""
    security_patching_next_action: configure
    security_patching_hosts_with_findings:
      - production
    security_patching_enrichment_status: complete
    security_patching_enrichment_message: Oracle Linux OpenSCAP OVAL evaluation completed.
    security_patching_report_max_cves_per_row: 2
    security_patching_report_path: /tmp/autographs-security-kernel-drift-render-test.md
    security_patching_enrichment_by_host:
      production:
        advisories: []
        entries: []
  tasks:
    - name: Add production RHCK drift fixture host
      ansible.builtin.add_host:
        name: production
        security_patching_update_advisory_ids: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_update_entries: []
        security_patching_installed_rhck_packages:
          - kernel
          - kernel-core
        security_patching_running_kernel_release: 6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: true

    - name: Render UEK-only drift report fixture
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/security_patching/templates/security-report.md.j2"
        dest: "{{ security_patching_report_path }}"
        mode: "0600"

    - name: Read UEK-only drift report fixture
      ansible.builtin.slurp:
        src: "{{ security_patching_report_path }}"
      register: security_patching_kernel_drift_report

    - name: Decode UEK-only drift report fixture
      ansible.builtin.set_fact:
        security_patching_kernel_drift_body: "{{ security_patching_kernel_drift_report.content | b64decode }}"

    - name: Assert UEK-only drift report is actionable
      ansible.builtin.assert:
        that:
          - "'next_action: \"configure\"' in security_patching_kernel_drift_body"
          - "'approval_label: \"\"' in security_patching_kernel_drift_body"
          - "'### UEK-only configuration drift on `production`' in security_patching_kernel_drift_body"
          - "'`kernel`, `kernel-core`' in security_patching_kernel_drift_body"
          - "'Do not approve package updates or a reboot' in security_patching_kernel_drift_body"
          - "'Run production deployment convergence' in security_patching_kernel_drift_body"

- name: Test unsafe kernel recovery report rendering
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_scan_id: security-scan-kernel-recovery-render-test
    security_patching_scan_timestamp: "2026-09-20T00:00:00Z"
    security_patching_target_group: runtime
    security_patching_approval_label: ""
    security_patching_report_approval_label: ""
    security_patching_next_action: investigate
    security_patching_hosts_with_findings:
      - running-rhck
      - default-rhck
    security_patching_enrichment_status: complete
    security_patching_enrichment_message: Oracle Linux OpenSCAP OVAL evaluation completed.
    security_patching_report_max_cves_per_row: 2
    security_patching_report_path: /tmp/autographs-security-kernel-recovery-render-test.md
    security_patching_enrichment_by_host:
      running-rhck:
        advisories: []
        entries: []
      default-rhck:
        advisories: []
        entries: []
  tasks:
    - name: Add running RHCK recovery fixture host
      ansible.builtin.add_host:
        name: running-rhck
        security_patching_update_advisory_ids: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_update_entries: []
        security_patching_installed_rhck_packages:
          - kernel-core
        security_patching_running_kernel_release: 6.12.0-211.56.1.el10_2.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: false
        security_patching_default_kernel_is_valid_uek: true

    - name: Add default RHCK recovery fixture host
      ansible.builtin.add_host:
        name: default-rhck
        security_patching_update_advisory_ids: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_update_entries: []
        security_patching_installed_rhck_packages:
          - kernel-core
        security_patching_running_kernel_release: 6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-211.56.1.el10_2.x86_64
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: false

    - name: Render unsafe kernel recovery report fixture
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/security_patching/templates/security-report.md.j2"
        dest: "{{ security_patching_report_path }}"
        mode: "0600"

    - name: Read unsafe kernel recovery report fixture
      ansible.builtin.slurp:
        src: "{{ security_patching_report_path }}"
      register: security_patching_kernel_recovery_report

    - name: Decode unsafe kernel recovery report fixture
      ansible.builtin.set_fact:
        security_patching_kernel_recovery_body: "{{ security_patching_kernel_recovery_report.content | b64decode }}"

    - name: Assert unsafe kernel recovery report is actionable and unapproved
      ansible.builtin.assert:
        that:
          - "'next_action: \"investigate\"' in security_patching_kernel_recovery_body"
          - "'approval_label: \"\"' in security_patching_kernel_recovery_body"
          - "security_patching_kernel_recovery_body | regex_findall('### Kernel recovery required on') | length == 2"
          - "'sudo grubby --set-default /boot/vmlinuz-<UEK release>' in security_patching_kernel_recovery_body"
          - "'schedule and perform a reboot' in security_patching_kernel_recovery_body"
          - "'selecting that running UEK image does not itself require a reboot' in security_patching_kernel_recovery_body"
          - "'Do not approve package updates or a reboot' in security_patching_kernel_recovery_body"
