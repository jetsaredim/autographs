- name: Validate security issue creation requires complete host scans
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_status_fixture_runtime
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fixture-token
    security_patching_create_issue_guard_failed: false
    security_patching_create_issue_guard_failure_message: ""
  tasks:
    - name: Add complete scan fixture host
      ansible.builtin.add_host:
        name: complete-host
        groups: security_status_fixture_runtime
        security_patching_scan_status: complete
        security_patching_update_advisory_ids:
          - ELSA-2026-11111
        security_patching_update_advisories:
          - advisory_id: ELSA-2026-11111
            severity: IMPORTANT
            cves: []
            packages:
              - glibc
            package_count: 1
            ksplice_aware: false
            errata_link: https://linux.oracle.com/errata/ELSA-2026-11111.html
            summary: ELSA-2026-11111 glibc security update
        security_patching_update_entries:
          - advisory_id: ELSA-2026-11111
            severity: IMPORTANT
            cves: []
            packages:
              - glibc
            package_count: 1
            ksplice_aware: false
            errata_link: https://linux.oracle.com/errata/ELSA-2026-11111.html
            summary: ELSA-2026-11111 glibc security update

    - name: Add degraded scan fixture host
      ansible.builtin.add_host:
        name: degraded-host
        groups: security_status_fixture_runtime
        security_patching_scan_status: degraded
        security_patching_update_advisory_ids: []
        security_patching_update_advisories: []
        security_patching_update_entries: []

    - name: Run issue creation guard against mixed scan statuses
      block:
        - name: Attempt to create issue from mixed scan fixtures
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: create_issue
      rescue:
        - name: Record expected issue creation guard failure
          ansible.builtin.set_fact:
            security_patching_create_issue_guard_failed: true
            security_patching_create_issue_guard_failure_message: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert mixed scan statuses are rejected before issue creation
      ansible.builtin.assert:
        that:
          - security_patching_create_issue_guard_failed
          - security_patching_incomplete_scan_hosts == ['degraded-host']
          - "'Refusing to create a security update issue' in security_patching_create_issue_guard_failure_message"

- name: Validate unsafe kernel posture takes precedence over convergent findings
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_target_group: security_kernel_drift_fixture_runtime
    security_patching_github_api_url: http://127.0.0.1:9
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fixture-token
    security_patching_scan_id: security-kernel-drift-fixture
    security_patching_scan_timestamp: "2026-09-20T00:00:00Z"
    security_patching_report_path: /tmp/autographs-security-kernel-drift-create-issue-test.md
    security_patching_kernel_drift_reached_github: false
  tasks:
    - name: Add RHCK-only drift fixture host
      ansible.builtin.add_host:
        name: kernel-drift-host
        groups: security_kernel_drift_fixture_runtime
        security_patching_scan_status: complete
        security_patching_next_action: configure
        security_patching_next_action_label: ""
        security_patching_update_advisory_ids: []
        security_patching_update_advisories: []
        security_patching_update_entries: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_installed_rhck_packages:
          - kernel-core
        security_patching_running_kernel_release: 6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: true

    - name: Add independently patchable fixture host
      ansible.builtin.add_host:
        name: security-update-host
        groups: security_kernel_drift_fixture_runtime
        security_patching_scan_status: complete
        security_patching_next_action: update
        security_patching_next_action_label: approved-production-update
        security_patching_update_advisory_ids:
          - ELSA-2026-88888
        security_patching_update_advisories: []
        security_patching_update_entries:
          - advisory_id: ELSA-2026-88888
            packages:
              - openssl
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_installed_rhck_packages: []
        security_patching_running_kernel_release: 6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: true
        security_patching_default_kernel_is_valid_uek: true

    - name: Add unsafe running RHCK fixture host without package findings
      ansible.builtin.add_host:
        name: unsafe-kernel-host
        groups: security_kernel_drift_fixture_runtime
        security_patching_scan_status: complete
        security_patching_next_action: investigate
        security_patching_next_action_label: ""
        security_patching_update_advisory_ids: []
        security_patching_update_advisories: []
        security_patching_update_entries: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_installed_rhck_packages: []
        security_patching_running_kernel_release: 6.12.0-211.56.1.el10_2.x86_64
        security_patching_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.4.el10uek.x86_64
        security_patching_running_kernel_is_valid_uek: false
        security_patching_default_kernel_is_valid_uek: true

    - name: Run RHCK-only drift issue convergence until fake GitHub fails
      block:
        - name: Attempt RHCK-only drift issue convergence
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: create_issue
      rescue:
        - name: Record expected fake GitHub drift failure
          ansible.builtin.set_fact:
            security_patching_kernel_drift_reached_github: true

    - name: Assert unsafe kernel posture opens investigation state without approval
      ansible.builtin.assert:
        that:
          - security_patching_kernel_drift_reached_github
          - security_patching_hosts_with_findings == ['kernel-drift-host', 'security-update-host', 'unsafe-kernel-host']
          - security_patching_scanner_issue_actions == ['configure', 'investigate', 'update']
          - security_patching_next_action | trim == 'investigate'
          - security_patching_report_approval_label | trim | length == 0
