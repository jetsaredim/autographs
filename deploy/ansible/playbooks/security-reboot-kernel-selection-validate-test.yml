- name: Validate stale default selects RPM-newest installed UEK target
  hosts: localhost
  gather_facts: false
  vars:
    reboot_fixture_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_reboot_kernel_boot_dir: "{{ reboot_fixture_boot_dir }}"
    security_patching_default_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.9.el10uek.x86_64
    security_patching_reboot_kernel_candidate_probe_override:
      rc: 0
      stdout: kernel-uek-core|0|6.12.0|206.104.4.10.el10uek|x86_64
    security_patching_reboot_kernel_owner_probe_override:
      rc: 0
      stdout: kernel-uek-core
    security_patching_reboot_kernel_boot_entry_probe_override:
      rc: 0
      stdout: |
        kernel="{{ reboot_fixture_boot_dir }}/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64"
        initrd="{{ reboot_fixture_boot_dir }}/early-uek.cpio {{ reboot_fixture_boot_dir }}/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img $tuned_initrd"
  tasks:
    - name: Create RPM-ordering UEK fixture directory
      ansible.builtin.file:
        path: "{{ security_patching_reboot_kernel_boot_dir }}"
        state: directory
        mode: "0700"

    - name: Create RPM-newest UEK image and initramfs fixtures
      ansible.builtin.copy:
        dest: "{{ security_patching_reboot_kernel_boot_dir }}/{{ item }}"
        content: fixture
        mode: "0600"
      loop:
        - vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
        - early-uek.cpio
        - initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img

    - name: Resolve RPM-newest UEK fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: resolve_reboot_kernel

    - name: Assert stale valid default requires RPM-newest UEK selection
      ansible.builtin.assert:
        that:
          - security_patching_reboot_target_kernel_valid | bool
          - security_patching_reboot_target_kernel_evr == '0:6.12.0-206.104.4.10.el10uek'
          - security_patching_reboot_target_kernel_release == '6.12.0-206.104.4.10.el10uek.x86_64'
          - security_patching_reboot_target_kernel_image == security_patching_reboot_kernel_boot_dir ~ '/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64'
          - security_patching_reboot_target_initramfs_valid | bool
          - security_patching_reboot_target_initramfs_image == security_patching_reboot_kernel_boot_dir ~ '/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img'
          - >-
            security_patching_reboot_target_initramfs_images
            == [
              security_patching_reboot_kernel_boot_dir ~ '/early-uek.cpio',
              security_patching_reboot_target_initramfs_image
            ]
          - security_patching_reboot_target_requires_default_change | bool

