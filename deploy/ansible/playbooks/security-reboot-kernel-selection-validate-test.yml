  hosts: localhost
  gather_facts: false
  vars:
    security_patching_reboot_kernel_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_default_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
    security_patching_reboot_kernel_candidate_probe_override:
      rc: 0
      stdout: kernel-uek-core|0|6.12.0|206.104.4.10.el10uek|x86_64
    security_patching_reboot_kernel_owner_probe_override:
      rc: 0
      stdout: kernel-uek-core
    security_patching_reboot_kernel_boot_entry_probe_override:
      rc: 0
      stdout: |
        kernel="/tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.9.el10uek.x86_64"
        initrd="/tmp/autographs-reboot-kernel-selection/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img $tuned_initrd"
  tasks:
    - name: Resolve mismatched UEK boot entry fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: resolve_reboot_kernel

    - name: Simulate mutation gate for mismatched boot entry
      ansible.builtin.set_fact:
        security_reboot_kernel_mutation_reached: true
      when: security_patching_reboot_target_kernel_valid | bool

    - name: Assert mismatched entry blocks reboot and cleanup mutation
      ansible.builtin.assert:
        that:
          - security_patching_reboot_target_initramfs_valid | bool
          - not (security_patching_reboot_target_kernel_valid | bool)
          - security_patching_reboot_target_entry_kernel_images == [security_patching_reboot_kernel_boot_dir ~ '/vmlinuz-6.12.0-206.104.4.9.el10uek.x86_64']
          - not (security_reboot_kernel_mutation_reached | default(false) | bool)

- name: Validate missing installed UEK candidate fails closed
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_reboot_kernel_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_default_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-rescue
    security_patching_reboot_kernel_candidate_probe_override:
      rc: 1
      stdout: ""
    security_patching_reboot_kernel_owner_probe_override:
      rc: 1
      stdout: ""
    security_patching_reboot_kernel_boot_entry_probe_override:
      rc: 1
      stdout: ""
  tasks:
    - name: Resolve missing UEK fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: resolve_reboot_kernel

    - name: Assert no UEK candidate cannot authorize reboot
      ansible.builtin.assert:
        that:
          - not (security_patching_reboot_target_kernel_valid | bool)
          - security_patching_reboot_kernel_candidate_records == []
          - security_patching_reboot_target_kernel_image == ''
          - not (security_patching_reboot_target_requires_default_change | bool)

- name: Validate boot-entry drift after preflight fails before default mutation
  hosts: localhost
  gather_facts: false
  vars:
    reboot_fixture_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_reboot_kernel_boot_dir: "{{ reboot_fixture_boot_dir }}"
    security_patching_failure_context_path: ""
    security_patching_reboot_target_kernel_valid: true
    security_patching_reboot_target_kernel_evr: 0:6.12.0-206.104.4.10.el10uek
    security_patching_reboot_target_kernel_release: 6.12.0-206.104.4.10.el10uek.x86_64
    security_patching_reboot_target_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
    security_patching_reboot_target_entry_kernel_images:
      - "{{ security_patching_reboot_target_kernel_image }}"
    security_patching_reboot_target_initramfs_valid: true
    security_patching_reboot_target_initramfs_image: /tmp/autographs-reboot-kernel-selection/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img
    security_patching_reboot_target_initramfs_images:
      - "{{ security_patching_reboot_target_initramfs_image }}"
    security_patching_reboot_premutation_candidate_probe_override:
      rc: 0
      stdout: kernel-uek-core|0|6.12.0|206.104.4.10.el10uek|x86_64
    security_patching_reboot_premutation_owner_probe_override:
      rc: 0
      stdout: kernel-uek-core
    security_patching_reboot_premutation_boot_entry_probe_override:
      rc: 0
      stdout: |
        kernel="{{ security_patching_reboot_target_kernel_image }}"
        initrd="{{ reboot_fixture_boot_dir }}/initramfs-6.12.0-206.104.4.11.el10uek.x86_64.img"
    security_reboot_kernel_revalidation_path: >-
      {{ playbook_dir }}/../roles/security_patching/tasks/revalidate_reboot_kernel.yml
  tasks:
    - name: Record preserved preflight UEK target for drift fixture
      ansible.builtin.set_fact:
        security_patching_reboot_target_kernel_valid: true
        security_patching_reboot_target_kernel_evr: 0:6.12.0-206.104.4.10.el10uek
        security_patching_reboot_target_kernel_release: 6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_reboot_target_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_reboot_target_entry_kernel_images:
          - /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_reboot_target_initramfs_valid: true
        security_patching_reboot_target_initramfs_image: /tmp/autographs-reboot-kernel-selection/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img
        security_patching_reboot_target_initramfs_images:
          - /tmp/autographs-reboot-kernel-selection/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img

    - name: Preserve originally validated UEK image and initramfs fixtures
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: fixture
        mode: "0600"
      loop:
        - "{{ security_patching_reboot_target_kernel_image }}"
        - "{{ security_patching_reboot_target_initramfs_image }}"

    - name: Ensure drifted initramfs target is absent
      ansible.builtin.file:
        path: "{{ reboot_fixture_boot_dir }}/initramfs-6.12.0-206.104.4.11.el10uek.x86_64.img"
        state: absent

    - name: Inspect preserved preflight initramfs fixture
      ansible.builtin.stat:
        path: "{{ security_patching_reboot_target_initramfs_image }}"
      register: security_reboot_preserved_initramfs_stat

    - name: Record pre-mutation drift sentinels
      ansible.builtin.set_fact:
        security_reboot_premutation_guard_failed: false
        security_reboot_default_mutation_reached: false

    - name: Apply complete UEK revalidation before simulated default mutation
      block:
        - name: Revalidate drifted exact UEK boot entry
          ansible.builtin.include_tasks: "{{ security_reboot_kernel_revalidation_path }}"

        - name: Record forbidden simulated default mutation
          ansible.builtin.set_fact:
            security_reboot_default_mutation_reached: true
      rescue:
        - name: Record expected pre-mutation boot-entry drift rejection
          ansible.builtin.set_fact:
            security_reboot_premutation_guard_failed: true

    - name: Assert boot-entry drift blocks default selection and reboot
      ansible.builtin.assert:
        that:
          - security_reboot_preserved_initramfs_stat.stat.exists
          - security_reboot_preserved_initramfs_stat.stat.isreg
          - security_reboot_premutation_guard_failed
          - not security_reboot_default_mutation_reached
          - not (security_patching_reboot_target_revalidated | bool)
          - >-
            security_patching_reboot_premutation_initramfs_images
            != security_patching_reboot_target_initramfs_images
          - not security_patching_reboot_premutation_initramfs_stats.results[0].stat.exists

- name: Validate RPM ordering and mutation task contracts
  hosts: localhost
  gather_facts: false
  vars:
    security_reboot_kernel_resolver_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/security_patching/tasks/resolve_reboot_kernel.yml') | from_yaml }}
    security_reboot_cleanup_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/security_patching/tasks/reboot_cleanup.yml') | from_yaml }}
    security_reboot_kernel_revalidation_tasks: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/security_patching/tasks/revalidate_reboot_kernel.yml') | from_yaml }}
  tasks:
    - name: Select kernel ordering and mutation contract tasks
      ansible.builtin.set_fact:
        security_reboot_kernel_query_task: >-
          {{
            security_reboot_kernel_resolver_tasks
            | selectattr('name', 'equalto', 'Query newest installed UEK core package with RPM ordering')
            | first
          }}
        security_reboot_kernel_select_task: >-
          {{
            security_reboot_cleanup_tasks
            | selectattr('name', 'equalto', 'Select verified newest installed UEK as default')
            | first
          }}
        security_reboot_kernel_revalidation_import_task: >-
          {{
            security_reboot_cleanup_tasks
            | selectattr('name', 'equalto', 'Revalidate complete selected UEK target immediately before boot mutation')
            | first
          }}
        security_reboot_kernel_candidate_recheck_task: >-
          {{ security_reboot_kernel_revalidation_tasks | first }}
        security_reboot_kernel_entry_recheck_task: >-
          {{
            security_reboot_kernel_revalidation_tasks
            | selectattr('name', 'equalto', 'Reinspect exact selected UEK boot entry before boot mutation')
            | first
          }}
        security_reboot_kernel_complete_recheck_task: >-
          {{
            security_reboot_kernel_revalidation_tasks
            | selectattr('name', 'equalto', 'Evaluate complete selected UEK proof immediately before boot mutation')
            | first
          }}
        security_reboot_kernel_verify_task: >-
          {{
            security_reboot_cleanup_tasks
            | selectattr('name', 'equalto', 'Refuse reboot unless newest installed UEK is the verified default')
            | first
          }}
        security_reboot_mutation_task: >-
          {{
            security_reboot_cleanup_tasks
            | selectattr('name', 'equalto', 'Reboot approved production runtime')
            | first
          }}

    - name: Assert DNF supplies RPM ordering before reboot mutation
      ansible.builtin.assert:
        that:
          - "'repoquery' in security_reboot_kernel_query_task['ansible.builtin.command'].argv"
          - "'--installed' in security_reboot_kernel_query_task['ansible.builtin.command'].argv"
          - "'--latest-limit=1' in security_reboot_kernel_query_task['ansible.builtin.command'].argv"
          - "'sort' not in security_reboot_kernel_query_task['ansible.builtin.command'].argv | join(' ')"
          - security_reboot_kernel_revalidation_import_task['ansible.builtin.import_tasks'] == 'revalidate_reboot_kernel.yml'
          - "'repoquery' in security_reboot_kernel_candidate_recheck_task['ansible.builtin.command'].argv"
          - security_reboot_kernel_entry_recheck_task['ansible.builtin.command'].argv[0] == 'grubby'
          - security_reboot_kernel_entry_recheck_task['ansible.builtin.command'].argv[1] is match('^--info=')
          - >-
            security_reboot_kernel_complete_recheck_task['ansible.builtin.set_fact'].security_patching_reboot_target_revalidated
            is search('premutation_candidate_records')
          - >-
            security_reboot_kernel_complete_recheck_task['ansible.builtin.set_fact'].security_patching_reboot_target_revalidated
            is search('premutation_owner_probe_effective')
          - >-
            security_reboot_kernel_complete_recheck_task['ansible.builtin.set_fact'].security_patching_reboot_target_revalidated
            is search('premutation_entry_kernel_images')
          - >-
            security_reboot_kernel_complete_recheck_task['ansible.builtin.set_fact'].security_patching_reboot_target_revalidated
            is search('premutation_initramfs_images')
          - security_reboot_kernel_select_task['ansible.builtin.command'].argv[1] is match('^--set-default=')
          - >-
            security_reboot_cleanup_tasks.index(security_reboot_kernel_revalidation_import_task)
            < security_reboot_cleanup_tasks.index(security_reboot_kernel_select_task)
          - security_reboot_cleanup_tasks.index(security_reboot_kernel_select_task) < security_reboot_cleanup_tasks.index(security_reboot_kernel_verify_task)
          - security_reboot_cleanup_tasks.index(security_reboot_kernel_verify_task) < security_reboot_cleanup_tasks.index(security_reboot_mutation_task)

- name: Validate post-reboot kernel must equal expected RPM-newest UEK
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_failure_context_path: ""
    security_patching_failure_context_max_chars: 12000
  tasks:
    - name: Record stale but otherwise valid post-reboot UEK fixture
      ansible.builtin.set_fact:
        security_patching_reboot_target_kernel_valid: true
        security_patching_reboot_target_kernel_evr: 0:6.12.0-206.104.4.10.el10uek
        security_patching_reboot_target_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_reboot_target_initramfs_valid: true
        security_patching_reboot_target_initramfs_image: /boot/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img
        security_patching_reboot_target_initramfs_images:
          - /boot/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img
        security_patching_post_reboot_running_kernel_release: 6.12.0-206.104.4.9.el10uek.x86_64
        security_patching_post_reboot_running_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.9.el10uek.x86_64
        security_patching_post_reboot_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.9.el10uek.x86_64
        security_patching_post_reboot_default_kernel:
          rc: 0
        security_patching_post_reboot_running_kernel_image_stat:
          stat:
            exists: true
            isreg: true
        security_patching_post_reboot_default_kernel_image_stat:
          stat:
            exists: true
            isreg: true
        security_patching_post_reboot_running_kernel_image_owner:
          rc: 0
          stdout: kernel-uek-core
        security_patching_post_reboot_default_kernel_image_owner:
          rc: 0
          stdout: kernel-uek-core
        security_reboot_stale_target_guard_failed: false

    - name: Reject stale but otherwise valid post-reboot UEK
      block:
        - name: Apply expected newest UEK post-reboot guard
          ansible.builtin.include_role:
            name: security_patching
            tasks_from: validate_post_reboot_kernel
      rescue:
        - name: Record expected stale UEK rejection
          ansible.builtin.set_fact:
            security_reboot_stale_target_guard_failed: true

    - name: Assert stale UEK cannot reach cleanup
      ansible.builtin.assert:
        that:
          - security_reboot_stale_target_guard_failed
          - not (security_patching_post_reboot_kernel_safe | bool)

    - name: Record expected RPM-newest post-reboot UEK fixture
      ansible.builtin.set_fact:
        security_patching_post_reboot_running_kernel_release: 6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_post_reboot_running_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
        security_patching_post_reboot_default_kernel_image: /boot/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64

    - name: Accept expected RPM-newest post-reboot UEK
      ansible.builtin.include_role:
        name: security_patching
        tasks_from: validate_post_reboot_kernel

    - name: Assert expected RPM-newest UEK passes cleanup guard
      ansible.builtin.assert:
        that:
          - security_patching_post_reboot_kernel_safe | bool
