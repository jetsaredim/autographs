  hosts: localhost
  gather_facts: false
  vars:
    reboot_fixture_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_reboot_kernel_boot_dir: "{{ reboot_fixture_boot_dir }}"
    security_patching_default_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
    security_patching_reboot_kernel_candidate_probe_override:
      rc: 0
      stdout: kernel-uek-core|0|6.12.0|206.104.4.10.el10uek|x86_64
    security_patching_reboot_kernel_owner_probe_override:
      rc: 0
      stdout: kernel-uek-core
    security_patching_reboot_kernel_boot_entry_probe_override:
      rc: 0
      stdout: |
        kernel="{{ reboot_fixture_boot_dir }}/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64"
        initrd="{{ reboot_fixture_boot_dir }}/initramfs-6.12.0-206.104.4.10.el10uek.x86_64.img $tuned_initrd"
  tasks:
    - name: Resolve already-selected RPM-newest UEK fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: resolve_reboot_kernel

    - name: Assert correct newest UEK default requires no selection change
      ansible.builtin.assert:
        that:
          - security_patching_reboot_target_kernel_valid | bool
          - security_patching_reboot_target_initramfs_valid | bool
          - not (security_patching_reboot_target_requires_default_change | bool)

- name: Validate missing selected UEK initramfs fails closed before mutation
  hosts: localhost
  gather_facts: false
  vars:
    security_patching_reboot_kernel_boot_dir: /tmp/autographs-reboot-kernel-selection
    security_patching_default_kernel_image: /tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.10.el10uek.x86_64
    security_patching_reboot_kernel_candidate_probe_override:
      rc: 0
      stdout: kernel-uek-core|0|6.12.0|206.104.4.11.el10uek|x86_64
    security_patching_reboot_kernel_owner_probe_override:
      rc: 0
      stdout: kernel-uek-core
    security_patching_reboot_kernel_boot_entry_probe_override:
      rc: 0
      stdout: |
        kernel="/tmp/autographs-reboot-kernel-selection/vmlinuz-6.12.0-206.104.4.11.el10uek.x86_64"
        initrd="/tmp/autographs-reboot-kernel-selection/initramfs-6.12.0-206.104.4.11.el10uek.x86_64.img $tuned_initrd"
  tasks:
    - name: Create missing-initramfs UEK image fixture
      ansible.builtin.copy:
        dest: "{{ security_patching_reboot_kernel_boot_dir }}/vmlinuz-6.12.0-206.104.4.11.el10uek.x86_64"
        content: fixture
        mode: "0600"

    - name: Ensure selected UEK initramfs fixture is missing
      ansible.builtin.file:
        path: "{{ security_patching_reboot_kernel_boot_dir }}/initramfs-6.12.0-206.104.4.11.el10uek.x86_64.img"
        state: absent

    - name: Resolve missing-initramfs UEK fixture
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: resolve_reboot_kernel

    - name: Simulate mutation gate for missing initramfs
      ansible.builtin.set_fact:
        security_reboot_kernel_mutation_reached: true
      when: security_patching_reboot_target_kernel_valid | bool

    - name: Assert missing initramfs blocks reboot and cleanup mutation
      ansible.builtin.assert:
        that:
          - not (security_patching_reboot_target_initramfs_valid | bool)
          - not (security_patching_reboot_target_kernel_valid | bool)
          - security_patching_reboot_target_initramfs_image in security_patching_reboot_target_initramfs_images
          - security_patching_reboot_target_initramfs_image_stats.results[0].stat.exists == false
          - not (security_reboot_kernel_mutation_reached | default(false) | bool)

