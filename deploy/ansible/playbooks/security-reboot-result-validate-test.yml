          - advisory_id: "{{ item.advisory_id }}"
            severity: Important
            cves: []
            errata_link: "https://linux.oracle.com/errata/{{ item.advisory_id }}.html"
            summary: "{{ item.advisory_id }} package update now available"
            package_count: 1
            packages:
              - openssl
            ksplice_aware: false
      loop:
        - name: update-one
          advisory_id: ELSA-2026-44441
        - name: update-two
          advisory_id: ELSA-2026-44442

    - name: Classify update-reclassified reboot result targets
