      ansible.builtin.assert:
        that:
          - security_reboot_update_refresh_path_reached
          - security_patching_reboot_reconciliation_only | bool
          - not (security_patching_reboot_mutation_allowed | bool)
          - security_patching_reboot_blocked_hosts == []
          - security_patching_reboot_reclassified_hosts == ['update-one', 'update-two']
          - security_patching_remaining_hosts == ['update-one', 'update-two']
          - security_patching_hosts_with_findings == ['update-one', 'update-two']
          - security_reboot_update_metadata.next_action == 'update'
          - security_reboot_update_metadata.approval_label == 'approved-production-update'
          - security_reboot_update_metadata.instances.keys() | list | sort == ['update-one', 'update-two']
          - "'Apply the label `approved-production-update`' in security_patching_refreshed_report_body"
          - "'Reboot approval reclassified' in security_patching_reboot_result_comment_body"
          - "'No reboot or installonly cleanup was attempted' in security_patching_reboot_result_comment_body"
          - "'Current action: `update`' in security_patching_reboot_result_comment_body"
          - "'update-one' in security_patching_reboot_result_comment_body"
          - "'update-two' in security_patching_reboot_result_comment_body"

