- name: Validate matching security reboot state
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record matching approved reboot issue metadata
      ansible.builtin.set_fact:
        security_patching_request_instances:
          localhost:
            advisory_ids:
              - ELSA-2026-22222
        security_patching_update_advisory_ids:
          - ELSA-2026-22222
        security_patching_scan_status: complete
        security_patching_next_action: reboot
        security_patching_next_action_label: approved-production-reboot
        security_patching_update_entries:
          - advisory_id: ELSA-2026-22222
            packages:
              - kernel-uek-core
              - kernel-uek-modules
              - perf
        security_patching_reboot_validate_dnf_noop: false

    - name: Validate current matching reboot finding set
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: validate_reboot_state

    - name: Assert matching reboot state is accepted
      ansible.builtin.assert:
        that:
          - security_patching_reboot_approved_advisory_ids == ['ELSA-2026-22222']
          - security_patching_reboot_current_advisory_ids == ['ELSA-2026-22222']
          - security_patching_reboot_disallowed_packages == []
          - not (security_patching_reboot_completed | bool)

- name: Validate skipped clean security reboot state
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record clean approved reboot issue metadata
      ansible.builtin.set_fact:
        security_patching_request_instances: {}
        security_patching_update_advisory_ids: []
        security_patching_update_entries: []

    - name: Validate current clean reboot finding set
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: validate_reboot_state

    - name: Assert clean reboot state is skipped
      ansible.builtin.assert:
        that:
          - security_patching_reboot_approved_advisory_ids == []
          - security_patching_reboot_current_advisory_ids == []
          - not security_patching_reboot_completed

- name: Validate drifted security reboot state blocks mutation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record drifted approved reboot issue metadata
      ansible.builtin.set_fact:
        security_patching_request_instances:
          localhost:
            advisory_ids:
              - ELSA-2026-33333
              - ELSA-2026-55555
        security_patching_update_advisory_ids:
          - ELSA-2026-44444
          - ELSA-2026-55555
        security_patching_scan_status: complete
        security_patching_next_action: reboot
        security_patching_next_action_label: approved-production-reboot
        security_patching_update_advisories:
          - advisory_id: ELSA-2026-44444
            severity: IMPORTANT
            cves:
              - CVE-2026-44444
            ksplice_aware: false
            packages:
              - kernel-uek-core
            package_count: 1
            summary: ELSA-2026-44444 new kernel finding
        security_patching_update_entries:
          - advisory_id: ELSA-2026-44444
            packages:
              - kernel-uek-core
        security_patching_update_ksplice_aware_advisory_ids: []

    - name: Classify drifted reboot finding set
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: validate_reboot_state

    - name: Assert drifted reboot state blocks mutation
      ansible.builtin.assert:
        that:
          - security_patching_reboot_drift_detected | bool
          - not (security_patching_reboot_preflight_ready | bool)
          - not (security_patching_reboot_completed | bool)
          - not (security_patching_installonly_cleanup_changed | bool)
          - security_patching_reboot_added_advisory_ids == ['ELSA-2026-44444']
          - security_patching_reboot_removed_advisory_ids == ['ELSA-2026-33333']
          - security_patching_post_reboot_scan_status == 'complete'
          - security_patching_post_reboot_advisory_ids == ['ELSA-2026-44444', 'ELSA-2026-55555']
          - security_patching_post_reboot_next_action == 'reboot'
          - security_patching_post_reboot_next_action_label == 'approved-production-reboot'

- name: Create exact-ID reboot action reclassification fixtures
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add update-reclassified host state
      ansible.builtin.add_host:
        name: exact-update-host
        groups: security_reboot_action_reclassification_runtime
        security_patching_scan_status: complete
        security_patching_next_action: update
        security_patching_next_action_label: approved-production-update
        security_patching_update_advisory_ids:
          - ELSA-2026-66666
        security_patching_update_entries:
          - advisory_id: ELSA-2026-66666
            packages:
              - openssl
        security_patching_update_advisories: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_reboot_validate_dnf_noop: true

    - name: Add investigate-reclassified host state
      ansible.builtin.add_host:
        name: exact-investigate-host
        groups: security_reboot_action_reclassification_runtime
        security_patching_scan_status: complete
        security_patching_next_action: investigate
        security_patching_next_action_label: ""
        security_patching_update_advisory_ids:
          - ELSA-2026-77777
        security_patching_update_entries:
          - advisory_id: ELSA-2026-77777
            packages: []
        security_patching_update_advisories: []
        security_patching_update_ksplice_aware_advisory_ids: []
        security_patching_reboot_validate_dnf_noop: true

    - name: Record exact-ID approved reboot metadata
      ansible.builtin.set_fact:
        security_patching_request_instances:
          exact-update-host:
            advisory_ids:
              - ELSA-2026-66666
          exact-investigate-host:
            advisory_ids:
              - ELSA-2026-77777

- name: Validate exact-ID reboot action changes preserve authoritative scan state
  hosts: security_reboot_action_reclassification_runtime
  gather_facts: false
  tasks:
    - name: Validate current reclassified reboot finding set
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: validate_reboot_state

    - name: Assert action reclassification skips reboot safety proof and mutation
      ansible.builtin.assert:
        that:
          - not (security_patching_reboot_drift_detected | bool)
          - security_patching_reboot_reclassified | bool
          - not (security_patching_reboot_preflight_ready | bool)
          - not (security_patching_reboot_completed | bool)
          - not (security_patching_installonly_cleanup_changed | bool)
          - security_patching_reboot_entries_without_packages | default([]) == []
          - security_patching_reboot_disallowed_packages | default([]) == []
          - security_patching_post_reboot_scan_status == 'complete'
          - security_patching_post_reboot_advisory_ids == security_patching_reboot_approved_advisory_ids
          - security_patching_post_reboot_next_action == security_patching_next_action

- name: Validate failed reboot cleanup refreshes drifted scanner issue
  hosts: localhost
  gather_facts: false
  vars:
    security_reboot_cleanup_refresh_failed_at_github: false
    security_reboot_cleanup_refresh_context_path: /tmp/autographs-security-reboot-cleanup-context-test.md
    security_reboot_cleanup_refresh_payload_path: /tmp/autographs-security-reboot-cleanup-refresh-test.json
    security_patching_github_api_url: http://127.0.0.1:9
    security_patching_github_repository: jetsaredim/autographs
    security_patching_github_token: fake-token
    security_patching_issue_number: 198
    security_patching_approval_label: approved-production-reboot
    security_patching_workflow_outcome: failure
    security_patching_failure_context_path: "{{ security_reboot_cleanup_refresh_context_path }}"
    security_patching_failure_refresh_path: "{{ security_reboot_cleanup_refresh_payload_path }}"
    security_patching_report_path: /tmp/autographs-security-reboot-cleanup-refresh-report-test.md
    security_patching_scan_id: security-reboot-cleanup-refresh-test
    security_patching_scan_timestamp: "2026-08-14T19:20:00Z"
  tasks:
    - name: Record failed cleanup refresh fixture paths
      ansible.builtin.set_fact:
        security_patching_failure_context_path: "{{ security_reboot_cleanup_refresh_context_path }}"
        security_patching_failure_refresh_path: "{{ security_reboot_cleanup_refresh_payload_path }}"

    - name: Write failed cleanup context fixture
      ansible.builtin.copy:
        dest: "{{ security_reboot_cleanup_refresh_context_path }}"
        mode: "0600"
        content: |
          Validation failed before reboot: current OpenSCAP advisories drifted from the approved issue metadata.

          Added advisories:
          - `ELSA-2026-77777`

    - name: Write failed cleanup refresh payload fixture
      ansible.builtin.copy:
        dest: "{{ security_reboot_cleanup_refresh_payload_path }}"
        mode: "0600"
        content: >-
          {{
            {
              'reason': 'reboot_advisory_drift',
              'host': 'production',
              'scan_status': 'complete',
              'advisory_ids': ['ELSA-2026-77777'],
              'advisories': [
                {
                  'advisory_id': 'ELSA-2026-77777',
                  'severity': 'IMPORTANT',
                  'cves': ['CVE-2026-77777'],
                  'ksplice_aware': false,
                  'packages': ['kernel-uek-core'],
                  'package_count': 1,
                  'summary': 'ELSA-2026-77777 new kernel finding'
                }
              ],
              'entries': [
                {
                  'advisory_id': 'ELSA-2026-77777',
                  'definition_id': 'oval:com.oracle.elsa:def:202677777',
                  'packages': ['kernel-uek-core'],
                  'title': 'ELSA-2026-77777 new kernel finding'
                }
              ],
              'ksplice_aware_advisory_ids': [],
              'next_action': 'reboot',
              'approval_label': 'approved-production-reboot',
              'added_advisory_ids': ['ELSA-2026-77777'],
              'removed_advisory_ids': []
            } | to_nice_json
          }}

    - name: Run failed cleanup until fake GitHub comment fails
      block:
        - name: Attempt failed cleanup with drift refresh payload
          ansible.builtin.import_role:
            name: security_patching
            tasks_from: cleanup_failed_request
      rescue:
        - name: Record expected fake GitHub cleanup failure
          ansible.builtin.set_fact:
            security_reboot_cleanup_refresh_failed_at_github: true

    - name: Assert failed cleanup rendered refreshed scanner issue body
      ansible.builtin.assert:
        that:
          - security_reboot_cleanup_refresh_failed_at_github
          - security_patching_refreshed_report_body is defined
          - "'ELSA-2026-77777' in security_patching_refreshed_report_body"
          - "'approved-production-reboot' in security_patching_refreshed_report_body"
          - "'approved-production-update' not in security_patching_refreshed_report_body"
          - "'security-reboot-cleanup-refresh-test' in security_patching_refreshed_report_body"

