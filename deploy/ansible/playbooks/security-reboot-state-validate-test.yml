- name: Validate failed reboot cleanup truncates oversized failure context
  hosts: localhost
  gather_facts: false
  vars:
    security_reboot_cleanup_truncate_failed_at_github: false
    security_reboot_cleanup_truncate_context_path: /tmp/autographs-security-reboot-cleanup-truncate-context-test.md
    security_reboot_cleanup_truncate_payload_path: /tmp/autographs-security-reboot-cleanup-truncate-refresh-test.json
