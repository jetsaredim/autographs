- name: Validate non-kernel security reboot state blocks mutation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record non-kernel approved reboot issue metadata
      ansible.builtin.set_fact:
        security_patching_request_instances:
          localhost:
            advisory_ids:
              - ELSA-2026-55555
        security_patching_update_advisory_ids:
          - ELSA-2026-55555
        security_patching_update_entries:
          - advisory_id: ELSA-2026-55555
            packages:
              - openssl
        security_patching_reboot_validate_dnf_noop: false

    - name: Classify non-kernel reboot finding set
      ansible.builtin.import_role:
        name: security_patching
        tasks_from: validate_reboot_state

    - name: Assert non-kernel reboot state blocks mutation
      ansible.builtin.assert:
        that:
          - not (security_patching_reboot_preflight_ready | bool)
          - security_patching_reboot_disallowed_packages == ['openssl']
