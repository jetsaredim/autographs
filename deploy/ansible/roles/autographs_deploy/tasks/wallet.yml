---
- name: Install wallet from a temporary archive
  when: not ansible_check_mode
  block:
    - name: Create private wallet staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: autographs-wallet-
      register: autographs_deploy_wallet_staging

    - name: Write Oracle DB wallet archive
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', autographs_verified_wallet_file)
             if autographs_verified_wallet_file else
             lookup('env', 'ORACLE_DB_WALLET_ZIP_BASE64') }}
        dest: "{{ autographs_deploy_wallet_staging.path }}/wallet.zip.b64"
        mode: "0600"
      no_log: true
      vars:
        autographs_verified_wallet_file: "{{ lookup('env', 'AUTOGRAPHS_VERIFIED_WALLET_FILE') }}"

    - name: Decode Oracle DB wallet archive
      ansible.builtin.shell:
        cmd: "base64 -d wallet.zip.b64 > wallet.zip"
        chdir: "{{ autographs_deploy_wallet_staging.path }}"
      no_log: true
      changed_when: true

    - name: Extract Oracle DB wallet archive
      ansible.builtin.unarchive:
        src: "{{ autographs_deploy_wallet_staging.path }}/wallet.zip"
        dest: "{{ autographs_deploy_wallet_path }}"
        remote_src: true
        owner: "{{ autographs_deploy_user }}"
        group: "{{ autographs_deploy_user }}"
        mode: "0600"
      no_log: true
      notify:
        - Restart controller container
  always:
    - name: Remove the private wallet staging directory
      ansible.builtin.file:
        path: "{{ autographs_deploy_wallet_staging.path }}"
        state: absent
      when: autographs_deploy_wallet_staging.path is defined

- name: Normalize Oracle DB wallet network configuration
  ansible.builtin.copy:
    src: sqlnet.ora
    dest: "{{ autographs_deploy_wallet_path }}/sqlnet.ora"
    owner: "{{ autographs_deploy_user }}"
    group: "{{ autographs_deploy_user }}"
    mode: "0600"
  no_log: true
  notify:
    - Restart controller container
