security_patching_github_api_url: https://api.github.com
security_patching_github_repository: "{{ lookup('env', 'GITHUB_REPOSITORY') }}"
security_patching_github_token: "{{ lookup('env', 'GH_TOKEN') }}"
security_patching_github_headers:
  Accept: application/vnd.github+json
  Authorization: "Bearer {{ security_patching_github_token }}"
  X-GitHub-Api-Version: "2022-11-28"
security_patching_scan_id: "security-scan-{{ lookup('env', 'GITHUB_RUN_ID') | default('local', true) }}"
security_patching_scan_timestamp: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
security_patching_issue_number: ""
security_patching_approver: "{{ lookup('env', 'PATCH_APPROVER') | default('', true) }}"
security_patching_report_path: "/tmp/autographs-security-report-{{ security_patching_scan_id }}.md"
security_patching_result_comment_path: "/tmp/autographs-security-update-result-{{ security_patching_issue_number | default('unknown', true) }}.md"
security_patching_oval_url: https://linux.oracle.com/security/oval/com.oracle.elsa-all.xml.bz2
security_patching_errata_base_url: https://linux.oracle.com/errata/
security_patching_oval_download_path: "/tmp/autographs-security-oval-{{ security_patching_scan_id }}-{{ inventory_hostname | default('localhost') }}.xml.bz2"
security_patching_oval_xml_path: "/tmp/autographs-security-oval-{{ security_patching_scan_id }}-{{ inventory_hostname | default('localhost') }}.xml"
security_patching_oscap_results_path: "/tmp/autographs-security-oscap-{{ security_patching_scan_id }}-{{ inventory_hostname | default('localhost') }}.xml"
security_patching_oscap_report_path: "/tmp/autographs-security-oscap-{{ security_patching_scan_id }}-{{ inventory_hostname | default('localhost') }}.html"
security_patching_oscap_parsed_path: "/tmp/autographs-security-oscap-{{ security_patching_scan_id }}-{{ inventory_hostname | default('localhost') }}.json"
security_patching_ssh_private_key_path: "{{ lookup('env', 'SECURITY_PATCHING_SSH_PRIVATE_KEY_PATH') | default('', true) }}"
security_patching_ssh_additional_options: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o IdentitiesOnly=yes
  {% if security_patching_ssh_private_key_path | trim | length > 0 %}-i {{ security_patching_ssh_private_key_path | trim }}{% endif %}
security_patching_approval_label: approved-production-update
security_patching_target_group: runtime
security_patching_enrichment_status: unknown
security_patching_enrichment_message: OpenSCAP advisory evaluation has not run.
security_patching_report_max_detail_rows: 50
security_patching_report_max_cves_per_row: 4
security_patching_report_max_body_bytes: 60000

security_patching_managed_labels:
  - name: security-patching
    color: b60205
    description: Production security update scanner output
  - name: production
    color: 5319e7
    description: Production runtime maintenance
  - name: patch-scan-open
    color: fbca04
    description: Open security update scan finding
  - name: approved-production-update
    color: 0e8a16
    description: Apply the scanner-approved production security updates

security_patching_issue_labels:
  - security-patching
  - production
  - patch-scan-open
