- name: Verify oscap-ssh is available on the runner
  ansible.builtin.command:
    argv:
      - oscap-ssh
      - --help
  delegate_to: localhost
  become: false
  register: security_patching_oscap_ssh_version
  changed_when: false
  failed_when: security_patching_oscap_ssh_version.rc not in [0, 1]

- name: Download Oracle Linux OVAL definitions
  ansible.builtin.get_url:
    url: "{{ security_patching_oval_url }}"
    dest: "{{ security_patching_oval_download_path }}"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false

- name: Decompress Oracle Linux OVAL definitions # noqa command-instead-of-module
  ansible.builtin.shell:
    cmd: "bzip2 -dc {{ security_patching_oval_download_path | quote }} > {{ security_patching_oval_xml_path | quote }}"
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false

- name: Run OpenSCAP Oracle Linux OVAL scan via SSH # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - oscap-ssh
      - --sudo
      - "{{ security_patching_oscap_ssh_target }}"
      - "{{ ansible_port | default(22) | string }}"
      - oval
      - eval
      - --skip-validation
      - --results
      - "{{ security_patching_oscap_results_path }}"
      - --report
      - "{{ security_patching_oscap_report_path }}"
      - "{{ security_patching_oval_xml_path }}"
  delegate_to: localhost
  become: false
  environment:
    SSH_ADDITIONAL_OPTIONS: "{{ security_patching_ssh_additional_options }}"
  register: security_patching_oscap_scan
  changed_when: false
  failed_when: security_patching_oscap_scan.rc not in [0, 2]

- name: Parse OpenSCAP OVAL findings # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../../scripts/oracle_linux_oscap_results.py"
      - --results
      - "{{ security_patching_oscap_results_path }}"
      - --oval-definitions
      - "{{ security_patching_oval_xml_path }}"
      - --output
      - "{{ security_patching_oscap_parsed_path }}"
      - --host
      - "{{ inventory_hostname }}"
      - --errata-base-url
      - "{{ security_patching_errata_base_url }}"
  delegate_to: localhost
  become: false
  register: security_patching_oscap_parse
  changed_when: false

- name: Read parsed OpenSCAP findings
  ansible.builtin.slurp:
    src: "{{ security_patching_oscap_parsed_path }}"
  delegate_to: localhost
  become: false
  register: security_patching_oscap_parsed_json
  changed_when: false

- name: Decode parsed OpenSCAP findings
  ansible.builtin.set_fact:
    security_patching_oscap_result: "{{ security_patching_oscap_parsed_json.content | b64decode | from_json }}"

- name: Set OpenSCAP security finding facts
  ansible.builtin.set_fact:
    security_patching_update_entries: "{{ security_patching_oscap_result.entries | default([]) }}"
    security_patching_update_advisories: "{{ security_patching_oscap_result.advisories | default([]) }}"
    security_patching_update_advisory_ids: >-
      {{ security_patching_oscap_result.advisory_ids | default([]) | unique | sort | list }}
    security_patching_update_ksplice_aware_advisory_ids: >-
      {{ security_patching_oscap_result.ksplice_aware_advisory_ids | default([]) | unique | sort | list }}
    security_patching_scan_source: openscap-oval
    security_patching_scan_status: "{{ security_patching_oscap_result.status | default('complete') }}"
    security_patching_scan_message: >-
      {{ security_patching_oscap_result.message | default('Oracle Linux OpenSCAP OVAL evaluation completed.') }}
