- name: Validate approved update target scope
  ansible.builtin.import_tasks: validate_target_scope.yml
  vars:
    security_patching_require_request_instance_match: true

- name: Initialize update approval host lists
  ansible.builtin.set_fact:
    security_patching_request_reconciliation_hosts: []
    security_patching_request_clean_hosts: []

- name: Collect clean targets that require no approved update
  ansible.builtin.set_fact:
    security_patching_request_clean_hosts: >-
      {{ security_patching_request_clean_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when:
    - hostvars[item].security_patching_scan_status | default('missing') == 'complete'
    - >-
      hostvars[item].security_patching_update_advisory_ids
      | default([])
      | unique
      | sort
      | list
      | length == 0
    - >-
      (security_patching_request_instances | default({}))
      .get(item, {})
      .get('advisory_ids', [])
      | unique
      | sort
      | list
      | length == 0
    - hostvars[item].security_patching_next_action | default('investigate') | trim == 'close'

- name: Collect targets requiring reconciliation instead of mutation
  ansible.builtin.set_fact:
    security_patching_request_reconciliation_hosts: >-
      {{ security_patching_request_reconciliation_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when: >-
    item not in security_patching_request_clean_hosts
    and (
      hostvars[item].security_patching_scan_status | default('missing') != 'complete'
      or (
        hostvars[item].security_patching_update_advisory_ids | default([]) | unique | sort | list
      ) != (
        (security_patching_request_instances | default({}))
        .get(item, {})
        .get('advisory_ids', [])
        | unique
        | sort
        | list
      )
      or hostvars[item].security_patching_next_action | default('investigate') | trim != 'update'
    )

- name: Record aggregate update reconciliation mode
  ansible.builtin.set_fact:
    security_patching_request_actionable_hosts: >-
      {{ security_patching_target_hosts | difference(security_patching_request_clean_hosts) | sort }}
    security_patching_request_reconciliation_only: >-
      {{ security_patching_request_reconciliation_hosts | length > 0 }}
