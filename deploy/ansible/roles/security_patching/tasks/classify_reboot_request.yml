- name: Validate approved reboot target scope
  ansible.builtin.import_tasks: validate_target_scope.yml
  vars:
    security_patching_require_request_instance_match: true

- name: Initialize aggregate reboot preflight host lists
  ansible.builtin.set_fact:
    security_patching_reboot_drift_hosts: []
    security_patching_reboot_reclassified_hosts: []
    security_patching_reboot_blocked_hosts: []
    security_patching_reboot_clean_hosts: []

- name: Collect clean targets that require no approved reboot
  ansible.builtin.set_fact:
    security_patching_reboot_clean_hosts: >-
      {{ security_patching_reboot_clean_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when: hostvars[item].security_patching_reboot_clean_skip | default(false) | bool

- name: Collect reboot targets with advisory drift
  ansible.builtin.set_fact:
    security_patching_reboot_drift_hosts: >-
      {{ security_patching_reboot_drift_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when: hostvars[item].security_patching_reboot_drift_detected | default(false) | bool

- name: Collect reboot targets with authoritative action reclassification
  ansible.builtin.set_fact:
    security_patching_reboot_reclassified_hosts: >-
      {{ security_patching_reboot_reclassified_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when:
    - item not in security_patching_reboot_clean_hosts
    - hostvars[item].security_patching_scan_status | default('missing') == 'complete'
    - not (hostvars[item].security_patching_reboot_drift_detected | default(false) | bool)
    - >-
      hostvars[item].security_patching_post_reboot_next_action
      | default(hostvars[item].security_patching_next_action | default('investigate'))
      | trim != 'reboot'

- name: Collect reboot targets that failed operational preflight
  ansible.builtin.set_fact:
    security_patching_reboot_blocked_hosts: >-
      {{ security_patching_reboot_blocked_hosts + [item] }}
  loop: "{{ security_patching_target_hosts }}"
  when: >-
    item not in security_patching_reboot_clean_hosts
    and (
      hostvars[item].security_patching_scan_status | default('missing') != 'complete'
      or (
        not (hostvars[item].security_patching_reboot_drift_detected | default(false) | bool)
        and (
          hostvars[item].security_patching_post_reboot_next_action
          | default(hostvars[item].security_patching_next_action | default('investigate'))
          | trim == 'reboot'
        )
        and not (hostvars[item].security_patching_reboot_preflight_ready | default(false) | bool)
      )
    )

- name: Record aggregate reboot reconciliation hosts
  ansible.builtin.set_fact:
    security_patching_reboot_reconciliation_hosts: >-
      {{
        (security_patching_reboot_drift_hosts + security_patching_reboot_reclassified_hosts)
        | unique
        | sort
      }}

- name: Record aggregate reboot mutation decision
  ansible.builtin.set_fact:
    security_patching_reboot_actionable_hosts: >-
      {{ security_patching_target_hosts | difference(security_patching_reboot_clean_hosts) | sort }}
    security_patching_reboot_reconciliation_only: >-
      {{ security_patching_reboot_reconciliation_hosts | length > 0 }}
    security_patching_reboot_mutation_allowed: >-
      {{
        security_patching_reboot_reconciliation_hosts | length == 0
        and security_patching_reboot_blocked_hosts | length == 0
      }}

- name: Require every target to pass reboot operational preflight
  ansible.builtin.assert:
    that:
      - security_patching_reboot_blocked_hosts | length == 0
    fail_msg: >-
      Refusing reboot mutation because these hosts did not complete a safe reboot preflight:
      {{ security_patching_reboot_blocked_hosts }}. No target was rebooted.
