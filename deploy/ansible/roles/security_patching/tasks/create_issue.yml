- name: Require GitHub repository context
  ansible.builtin.assert:
    that:
      - security_patching_github_repository | length > 0
      - security_patching_github_token | length > 0
    fail_msg: GitHub repository and token context are required to create security update issues.

- name: Initialize incomplete scan host list
  ansible.builtin.set_fact:
    security_patching_incomplete_scan_hosts: []

- name: Collect hosts without complete OpenSCAP scan results
  ansible.builtin.set_fact:
    security_patching_incomplete_scan_hosts: "{{ security_patching_incomplete_scan_hosts + [item] }}"
  loop: "{{ groups[security_patching_target_group] | default([]) }}"
  when: hostvars[item].security_patching_scan_status | default('missing') != 'complete'

- name: Require complete OpenSCAP scan results for all target hosts
  ansible.builtin.assert:
    that:
      - security_patching_incomplete_scan_hosts | length == 0
    fail_msg: >-
      Refusing to create a security update issue because these hosts do not have complete OpenSCAP scan results:
      {{ security_patching_incomplete_scan_hosts }}

- name: Initialize report host list
  ansible.builtin.set_fact:
    security_patching_hosts_with_findings: []

- name: Collect hosts with security update findings
  ansible.builtin.set_fact:
    security_patching_hosts_with_findings: "{{ security_patching_hosts_with_findings + [item] }}"
  loop: "{{ groups[security_patching_target_group] | default([]) }}"
  when: (hostvars[item].security_patching_update_entries | default([]) | length) > 0

- name: Report clean security update scan
  ansible.builtin.debug:
    msg: "No available security updates were reported for {{ security_patching_target_group }}."
  when: security_patching_hosts_with_findings | length == 0

- name: Initialize scanner issue action list
  ansible.builtin.set_fact:
    security_patching_scanner_issue_actions: []

- name: Collect scanner issue actions
  ansible.builtin.set_fact:
    security_patching_scanner_issue_actions: >-
      {{
        (
          security_patching_scanner_issue_actions
          + [hostvars[item].security_patching_next_action | default('investigate') | trim]
        )
        | unique
        | sort
      }}
  loop: "{{ security_patching_hosts_with_findings }}"

- name: Resolve scanner issue next action
  ansible.builtin.set_fact:
    security_patching_next_action: >-
      {% if security_patching_hosts_with_findings | length == 0 %}
      close
      {% elif security_patching_scanner_issue_actions | length == 1 %}
      {{ security_patching_scanner_issue_actions[0] }}
      {% else %}
      investigate
      {% endif %}

- name: Resolve scanner issue approval label
  ansible.builtin.set_fact:
    security_patching_next_action_label: >-
      {{
        {
          'update': security_patching_update_approval_label,
          'reboot': security_patching_reboot_approval_label
        }.get(security_patching_next_action | trim, '')
      }}
    security_patching_report_approval_label: "{{ security_patching_next_action_label | trim }}"

- name: Build GitHub issues URLs
  ansible.builtin.set_fact:
    security_patching_issues_url: >-
      {{
        [
          security_patching_github_api_url,
          'repos',
          security_patching_github_repository,
          'issues'
        ] | join('/')
      }}

- name: Build open GitHub issues URL
  ansible.builtin.set_fact:
    security_patching_open_issues_url: >-
      {{ security_patching_issues_url }}?state=open&labels=security-patching,patch-scan-open&per_page=100

- name: Set OpenSCAP report status
  ansible.builtin.set_fact:
    security_patching_enrichment_status: >-
      {{
        'degraded'
        if (
          security_patching_hosts_with_findings
          | map('extract', hostvars, 'security_patching_scan_status')
          | reject('equalto', 'complete')
          | list
          | length
        ) > 0
        else 'complete'
      }}
    security_patching_enrichment_message: >-
      {{
        'Oracle Linux OpenSCAP OVAL evaluation completed.'
        if (
          security_patching_hosts_with_findings
          | map('extract', hostvars, 'security_patching_scan_status')
          | reject('equalto', 'complete')
          | list
          | length
        ) == 0
        else 'Oracle Linux OpenSCAP OVAL evaluation completed with degraded host parser output.'
      }}
    security_patching_enrichment_by_host: {}

- name: Index OpenSCAP findings by host
  ansible.builtin.set_fact:
    security_patching_enrichment_by_host: >-
      {{
        security_patching_enrichment_by_host
        | combine(
            {
              item: {
                'advisories': hostvars[item].security_patching_update_advisories | default([]),
                'entries': hostvars[item].security_patching_update_entries | default([])
              }
            },
            recursive=True
          )
      }}
  loop: "{{ security_patching_hosts_with_findings }}"

- name: Ensure GitHub labels exist
  ansible.builtin.uri:
    url: "{{ security_patching_github_api_url }}/repos/{{ security_patching_github_repository }}/labels"
    method: POST
    headers: "{{ security_patching_github_headers }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      color: "{{ item.color }}"
      description: "{{ item.description }}"
    status_code:
      - 201
      - 422
  loop: "{{ security_patching_managed_labels }}"
  when: security_patching_hosts_with_findings | length > 0
  no_log: true

- name: Render production security update issue body
  ansible.builtin.template:
    src: security-report.md.j2
    dest: "{{ security_patching_report_path }}"
    mode: "0600"

- name: Inspect rendered production security update issue body
  ansible.builtin.stat:
    path: "{{ security_patching_report_path }}"
  register: security_patching_report_file

- name: Require GitHub issue body within safety limit
  ansible.builtin.assert:
    that:
      - (security_patching_report_file.stat.size | int) <= (security_patching_report_max_body_bytes | int)
    fail_msg: >-
      Rendered security update issue body is {{ security_patching_report_file.stat.size | int }} bytes,
      above the configured {{ security_patching_report_max_body_bytes | int }} byte safety limit.
      Reduce visible security report detail or split the target group before creating a GitHub issue.

- name: Read rendered production security update issue body
  ansible.builtin.set_fact:
    security_patching_report_body: "{{ lookup('ansible.builtin.file', security_patching_report_path) }}"

- name: Read open production security update issues
  ansible.builtin.uri:
    url: "{{ security_patching_open_issues_url }}"
    method: GET
    headers: "{{ security_patching_github_headers }}"
    status_code: 200
  register: security_patching_open_issues
  no_log: true

- name: Find existing scan issue for target group
  ansible.builtin.set_fact:
    security_patching_existing_issue_numbers: >-
      {{
        security_patching_open_issues.json
        | default([])
        | rejectattr('pull_request', 'defined')
        | selectattr('body', 'search', 'target_group: "' ~ security_patching_target_group ~ '"')
        | map(attribute='number')
        | list
      }}

- name: Update existing production security update issue
  ansible.builtin.uri:
    url: "{{ security_patching_issues_url }}/{{ security_patching_existing_issue_numbers[0] }}"
    method: PATCH
    headers: "{{ security_patching_github_headers }}"
    body_format: json
    body:
      title: "Production security update report - {{ security_patching_scan_timestamp }}"
      body: "{{ security_patching_report_body }}"
      labels: "{{ security_patching_issue_labels }}"
    status_code: 200
  register: security_patching_updated_issue
  when:
    - security_patching_hosts_with_findings | length > 0
    - security_patching_existing_issue_numbers | default([]) | length > 0
  no_log: true

- name: Close stale production security update issue after clean scan
  ansible.builtin.uri:
    url: "{{ security_patching_issues_url }}/{{ security_patching_existing_issue_numbers[0] }}"
    method: PATCH
    headers: "{{ security_patching_github_headers }}"
    body_format: json
    body:
      title: "Production security update report - {{ security_patching_scan_timestamp }}"
      body: "{{ security_patching_report_body }}"
      labels: "{{ security_patching_issue_labels | reject('equalto', 'patch-scan-open') | list }}"
      state: closed
      state_reason: completed
    status_code: 200
  register: security_patching_closed_issue
  when:
    - security_patching_hosts_with_findings | length == 0
    - security_patching_existing_issue_numbers | default([]) | length > 0
  no_log: true

- name: Create production security update issue
  ansible.builtin.uri:
    url: "{{ security_patching_issues_url }}"
    method: POST
    headers: "{{ security_patching_github_headers }}"
    body_format: json
    body:
      title: "Production security update report - {{ security_patching_scan_timestamp }}"
      body: "{{ security_patching_report_body }}"
      labels: "{{ security_patching_issue_labels }}"
    status_code: 201
  register: security_patching_created_issue
  when:
    - security_patching_hosts_with_findings | length > 0
    - security_patching_existing_issue_numbers | default([]) | length == 0
  no_log: true

- name: Report production security update issue number
  ansible.builtin.debug:
    msg: >-
      Production security update issue #{{
        security_patching_updated_issue.json.number
        | default(security_patching_created_issue.json.number)
      }} is ready for review.
  when: security_patching_hosts_with_findings | length > 0
