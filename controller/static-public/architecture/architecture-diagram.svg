  <text x="315.0" y="404" text-anchor="middle" class="box-title">CF apply</text>
  <text x="315.0" y="422" text-anchor="middle" class="box-small">reviewed Terraform</text>
  <rect x="510" y="205" width="115" height="65" rx="12" class="box" />
  <text x="567.5" y="229" text-anchor="middle" class="box-title">DNS zone</text>
  <text x="567.5" y="247" text-anchor="middle" class="box-small">proxied A record</text>
  <rect x="645" y="205" width="115" height="65" rx="12" class="box" />
  <text x="702.5" y="229" text-anchor="middle" class="box-title">HTTPS proxy</text>
  <text x="702.5" y="247" text-anchor="middle" class="box-small">edge cache</text>
  <rect x="510" y="315" width="250" height="95" rx="12" class="box" />
  <text x="635.0" y="337" text-anchor="middle" class="box-title">Rules + Full (strict)</text>
  <text x="635.0" y="355" text-anchor="middle" class="box-small">cache media; bypass admin</text>
  <text x="635.0" y="370" text-anchor="middle" class="box-small">fresh public HTML and JSON</text>
  <rect x="925" y="335" width="95" height="60" rx="12" class="box" />
  <text x="972.5" y="359" text-anchor="middle" class="box-title">Caddy</text>
  <text x="972.5" y="377" text-anchor="middle" class="box-small">HTTPS origin</text>
  <rect x="1060" y="335" width="105" height="60" rx="12" class="box" />
  <text x="1112.5" y="359" text-anchor="middle" class="box-title">Rust</text>
  <text x="1112.5" y="377" text-anchor="middle" class="box-small">private API</text>
  <rect x="925" y="445" width="240" height="70" rx="12" class="box" />
  <text x="1045.0" y="467" text-anchor="middle" class="box-title">Podman volume</text>
  <text x="1045.0" y="485" text-anchor="middle" class="box-small">hosts static content</text>
  <text x="1045.0" y="500" text-anchor="middle" class="box-small">HTML, JSON, WebP</text>
