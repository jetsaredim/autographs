<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 810" role="img" aria-labelledby="title desc">
  <title id="title">Autographs architecture diagram</title>
  <desc id="desc">GitHub release workflows deploy to OCI and manage Cloudflare through a controlled Terraform workflow. Browsers reach Caddy through Cloudflare. The Rust controller reads OCI Vault secrets with instance-principal credentials, uses Autonomous Database metadata and private Object Storage, and publishes static releases. OCI rotates the database password with the Vault secret.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f66" />
    </marker>
    <style>
  .page-title { fill:#111; font:700 28px Arial,Helvetica,sans-serif; }
  .subtitle { fill:#3f3f46; font:13px Arial,Helvetica,sans-serif; }
  .zone { fill:#f4f4f5; stroke:#a1a1aa; stroke-width:1.5; }
  .edge-zone { fill:#eef6f7; stroke:#6b9aa0; }
  .panel { fill:#fff; stroke:#b8c3bf; stroke-width:1.5; }
  .box { fill:#fff; stroke:#52525b; stroke-width:1.4; }
  .accent { fill:#eef8f6; }
  .flow { fill:none; stroke:#315f66; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
  .zone-title { fill:#111; font:700 20px Arial,Helvetica,sans-serif; }
  .zone-small { fill:#3f3f46; font:12px Arial,Helvetica,sans-serif; }
  .box-title { fill:#111; font:700 15px Arial,Helvetica,sans-serif; }
  .box-small { fill:#3f3f46; font:11px Arial,Helvetica,sans-serif; }
  .flow-label { fill:#315f66; font:600 11px Arial,Helvetica,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
</style>
  </defs>
  <text x="50" y="55" class="page-title">Autographs architecture</text>
  <text x="50" y="84" class="subtitle">Cloudflare fronts the public site; OCI runs Caddy, the Rust controller, private media, metadata, and Vault secrets.</text>
  <rect x="50" y="135" width="360" height="315" rx="16" class="zone" />
  <text x="70" y="168" class="zone-title">GitHub</text>
  <text x="70" y="188" class="zone-small">Source, CI, releases, and workflows</text>
  <rect x="490" y="135" width="300" height="315" rx="16" class="zone edge-zone" />
  <text x="510" y="168" class="zone-title">Cloudflare</text>
  <text x="510" y="188" class="zone-small">Authoritative DNS and HTTPS edge</text>
  <rect x="860" y="135" width="590" height="640" rx="16" class="zone" />
  <text x="880" y="168" class="zone-title">Oracle Cloud Infrastructure</text>
  <text x="880" y="188" class="zone-small">Runtime, database, private media, and secrets</text>
  <rect x="900" y="250" width="290" height="330" rx="16" class="panel" />
  <text x="920" y="283" class="zone-title">Runtime VM</text>
  <text x="920" y="303" class="zone-small">Podman containers and static releases</text>
  <polyline points="65,572 30,572 30,237 75,237" class="flow" />
  <polyline points="220,237 245,237" class="flow" />
  <polyline points="315,270 315,285" class="flow" />
  <polyline points="245,322 220,395" class="flow" />
  <polyline points="385,322 440,322 440,113 1015,113 1015,250" class="flow" />
  <text x="658" y="108" text-anchor="middle" class="flow-label">Terraform + Ansible</text>
  <polyline points="220,395 440,395 440,470 900,470" class="flow" />
  <text x="607" y="462" text-anchor="middle" class="flow-label">image pull</text>
  <polyline points="385,407 470,407 470,363 510,363" class="flow" />
  <polyline points="225,682 465,682 465,237 510,237" class="flow" />
  <text x="364" y="672" text-anchor="middle" class="flow-label">NS delegation</text>
  <polyline points="645,540 805,540 805,237 760,237" class="flow" />
  <text x="761" y="526" text-anchor="middle" class="flow-label">public + admin HTTPS</text>
  <polyline points="625,237 645,237" class="flow" />
  <polyline points="635,315 635,285 700,285 700,270" class="flow" />
  <polyline points="760,220 835,220 835,335 925,335" class="flow" />
  <text x="832" y="275" text-anchor="middle" class="flow-label">Full (strict)</text>
  <polyline points="755,682 845,682 845,355 925,355" class="flow" />
  <text x="835" y="664" text-anchor="middle" class="flow-label">origin TLS</text>
  <polyline points="1020,335 1060,335" class="flow" />
  <polyline points="972,365 972,445" class="flow" />
  <polyline points="1112,365 1112,445" class="flow" />
  <polyline points="1165,325 1210,325 1210,280 1240,280" class="flow" />
  <polyline points="1165,340 1200,340 1200,400 1240,400" class="flow" />
  <polyline points="1165,355 1190,355 1190,530 1240,530" class="flow" />
  <polyline points="1405,530 1430,530 1430,280 1405,280" class="flow" />
  <rect x="75" y="205" width="145" height="65" rx="12" class="box" />
  <text x="147.5" y="229" text-anchor="middle" class="box-title">Repository</text>
  <text x="147.5" y="247" text-anchor="middle" class="box-small">Rust, static site, IaC</text>
  <rect x="245" y="205" width="140" height="65" rx="12" class="box" />
  <text x="315.0" y="229" text-anchor="middle" class="box-title">PR checks</text>
  <text x="315.0" y="247" text-anchor="middle" class="box-small">validate changes</text>
  <rect x="245" y="285" width="140" height="75" rx="12" class="box" />
  <text x="315.0" y="309" text-anchor="middle" class="box-title">Release PR</text>
  <text x="315.0" y="327" text-anchor="middle" class="box-small">gates deployment</text>
  <rect x="75" y="365" width="145" height="60" rx="12" class="box" />
  <text x="147.5" y="389" text-anchor="middle" class="box-title">GHCR</text>
  <text x="147.5" y="407" text-anchor="middle" class="box-small">controller image</text>
  <rect x="245" y="380" width="140" height="55" rx="12" class="box" />
  <text x="315.0" y="404" text-anchor="middle" class="box-title">CF apply</text>
  <text x="315.0" y="422" text-anchor="middle" class="box-small">reviewed Terraform</text>
  <rect x="510" y="205" width="115" height="65" rx="12" class="box" />
  <text x="567.5" y="229" text-anchor="middle" class="box-title">DNS zone</text>
  <text x="567.5" y="247" text-anchor="middle" class="box-small">proxied A record</text>
  <rect x="645" y="205" width="115" height="65" rx="12" class="box" />
  <text x="702.5" y="229" text-anchor="middle" class="box-title">HTTPS proxy</text>
  <text x="702.5" y="247" text-anchor="middle" class="box-small">edge cache</text>
  <rect x="510" y="315" width="250" height="95" rx="12" class="box" />
  <text x="635.0" y="337" text-anchor="middle" class="box-title">Rules + Full (strict)</text>
  <text x="635.0" y="355" text-anchor="middle" class="box-small">cache media; bypass admin</text>
  <text x="635.0" y="370" text-anchor="middle" class="box-small">fresh public HTML and JSON</text>
  <rect x="925" y="305" width="95" height="60" rx="12" class="box" />
  <text x="972.5" y="329" text-anchor="middle" class="box-title">Caddy</text>
  <text x="972.5" y="347" text-anchor="middle" class="box-small">HTTPS origin</text>
  <rect x="1060" y="305" width="105" height="60" rx="12" class="box" />
  <text x="1112.5" y="329" text-anchor="middle" class="box-title">Rust</text>
  <text x="1112.5" y="347" text-anchor="middle" class="box-small">private API</text>
  <rect x="925" y="445" width="240" height="70" rx="12" class="box" />
  <text x="1045.0" y="469" text-anchor="middle" class="box-title">Static releases</text>
  <text x="1045.0" y="487" text-anchor="middle" class="box-small">public HTML, JSON, WebP</text>
  <rect x="1240" y="245" width="165" height="70" rx="12" class="box" />
  <text x="1322.5" y="269" text-anchor="middle" class="box-title">Autonomous DB</text>
  <text x="1322.5" y="287" text-anchor="middle" class="box-small">catalog metadata</text>
  <rect x="1240" y="365" width="165" height="70" rx="12" class="box" />
  <text x="1322.5" y="389" text-anchor="middle" class="box-title">Object Storage</text>
  <text x="1322.5" y="407" text-anchor="middle" class="box-small">private originals</text>
  <rect x="1240" y="485" width="165" height="90" rx="12" class="box accent" />
  <text x="1322.5" y="507" text-anchor="middle" class="box-title">OCI Vault</text>
  <text x="1322.5" y="525" text-anchor="middle" class="box-small">DB password, wallet secret</text>
  <text x="1322.5" y="540" text-anchor="middle" class="box-small">admin password hash</text>
  <rect x="65" y="540" width="160" height="65" rx="12" class="box external" />
  <text x="145.0" y="564" text-anchor="middle" class="box-title">Owner</text>
  <text x="145.0" y="582" text-anchor="middle" class="box-small">source and operations</text>
  <rect x="65" y="650" width="160" height="65" rx="12" class="box external" />
  <text x="145.0" y="674" text-anchor="middle" class="box-title">Porkbun</text>
  <text x="145.0" y="692" text-anchor="middle" class="box-small">registrar delegation</text>
  <rect x="535" y="540" width="220" height="65" rx="12" class="box external" />
  <text x="645.0" y="564" text-anchor="middle" class="box-title">Browsers</text>
  <text x="645.0" y="582" text-anchor="middle" class="box-small">public visitors + admin</text>
  <rect x="535" y="650" width="220" height="65" rx="12" class="box external" />
  <text x="645.0" y="674" text-anchor="middle" class="box-title">Let's Encrypt</text>
  <text x="645.0" y="692" text-anchor="middle" class="box-small">Caddy origin certificate</text>
</svg>
