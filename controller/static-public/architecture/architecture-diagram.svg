  <rect x="1240" y="365" width="165" height="70" rx="12" class="box" />
  <text x="1322.5" y="389" text-anchor="middle" class="box-title">Object Storage</text>
  <text x="1322.5" y="407" text-anchor="middle" class="box-small">private originals</text>
  <rect x="1240" y="485" width="165" height="90" rx="12" class="box accent" />
