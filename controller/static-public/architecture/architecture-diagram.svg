  <text x="320" y="163" class="zone-title">GitHub</text>
  <text x="320" y="183" class="zone-small">Source, CI, releases, and workflows</text>
  <rect x="300" y="480" width="420" height="340" rx="16" class="zone edge-zone" />
  <text x="320" y="513" class="zone-title">Cloudflare</text>
  <text x="320" y="533" class="zone-small">Authoritative DNS and HTTPS edge</text>
  <rect x="900" y="130" width="650" height="690" rx="16" class="zone" />
  <text x="920" y="163" class="zone-title">Oracle Cloud Infrastructure</text>
  <text x="920" y="183" class="zone-small">Runtime, database, private media, and secrets</text>
  <rect x="940" y="275" width="310" height="385" rx="16" class="panel" />
  <text x="960" y="308" class="zone-title">Runtime VM</text>
  <text x="960" y="328" class="zone-small">Podman containers and volume</text>
