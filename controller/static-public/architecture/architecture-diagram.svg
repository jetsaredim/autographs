  .zone { fill:#f4f4f5; stroke:#a1a1aa; stroke-width:1.5; }
  .edge-zone { fill:#eef6f7; stroke:#6b9aa0; }
  .panel { fill:#fff; stroke:#b8c3bf; stroke-width:1.5; }
  .box { fill:#fff; stroke:#52525b; stroke-width:1.4; }
  .accent { fill:#eef8f6; }
  .flow { fill:none; stroke:#315f66; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
  .zone-title { fill:#111; font:700 20px Arial,Helvetica,sans-serif; }
  .zone-small { fill:#3f3f46; font:12px Arial,Helvetica,sans-serif; }
  .box-title { fill:#111; font:700 15px Arial,Helvetica,sans-serif; }
  .box-small { fill:#3f3f46; font:11px Arial,Helvetica,sans-serif; }
