<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 810" role="img" aria-labelledby="title desc">
  <title id="title">Autographs architecture diagram</title>
  <desc id="desc">GitHub release workflows deploy to OCI and manage Cloudflare through a controlled Terraform workflow. Browsers reach Caddy through Cloudflare. The Rust controller reads OCI Vault secrets with instance-principal credentials, uses Autonomous Database metadata and private Object Storage, and publishes static releases. OCI rotates the database password with the Vault secret.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f66" />
    </marker>
    <style>
  .page-title { fill:#111; font:700 28px Arial,Helvetica,sans-serif; }
  .subtitle { fill:#3f3f46; font:13px Arial,Helvetica,sans-serif; }
  .zone { fill:#f4f4f5; stroke:#a1a1aa; stroke-width:1.5; }
  .edge-zone { fill:#eef6f7; stroke:#6b9aa0; }
  .panel { fill:#fff; stroke:#b8c3bf; stroke-width:1.5; }
  .box { fill:#fff; stroke:#52525b; stroke-width:1.4; }
  .accent { fill:#eef8f6; }
  .flow { fill:none; stroke:#315f66; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
  .zone-title { fill:#111; font:700 20px Arial,Helvetica,sans-serif; }
  .zone-small { fill:#3f3f46; font:12px Arial,Helvetica,sans-serif; }
  .box-title { fill:#111; font:700 15px Arial,Helvetica,sans-serif; }
  .box-small { fill:#3f3f46; font:11px Arial,Helvetica,sans-serif; }
  .flow-label { fill:#315f66; font:600 11px Arial,Helvetica,sans-serif; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
</style>
  </defs>
  <text x="50" y="55" class="page-title">Autographs architecture</text>
  <text x="50" y="84" class="subtitle">Cloudflare fronts the public site; OCI runs Caddy, the Rust controller, private media, metadata, and Vault secrets.</text>
  <rect x="50" y="135" width="360" height="315" rx="16" class="zone" />
  <text x="70" y="168" class="zone-title">GitHub</text>
  <text x="70" y="188" class="zone-small">Source, CI, releases, and workflows</text>
  <rect x="490" y="135" width="300" height="315" rx="16" class="zone edge-zone" />
  <text x="510" y="168" class="zone-title">Cloudflare</text>
  <text x="510" y="188" class="zone-small">Authoritative DNS and HTTPS edge</text>
  <rect x="860" y="135" width="590" height="640" rx="16" class="zone" />
  <text x="880" y="168" class="zone-title">Oracle Cloud Infrastructure</text>
  <text x="880" y="188" class="zone-small">Runtime, database, private media, and secrets</text>
  <rect x="900" y="250" width="290" height="330" rx="16" class="panel" />
  <text x="920" y="283" class="zone-title">Runtime VM</text>
  <text x="920" y="303" class="zone-small">Podman containers and volume</text>
