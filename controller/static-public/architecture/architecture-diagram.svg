  <rect x="75" y="205" width="145" height="65" rx="12" class="box" />
  <text x="147.5" y="229" text-anchor="middle" class="box-title">Repository</text>
  <text x="147.5" y="247" text-anchor="middle" class="box-small">Rust, static site, IaC</text>
  <rect x="245" y="205" width="140" height="65" rx="12" class="box" />
  <text x="315.0" y="229" text-anchor="middle" class="box-title">PR checks</text>
  <text x="315.0" y="247" text-anchor="middle" class="box-small">validate changes</text>
  <rect x="245" y="285" width="140" height="75" rx="12" class="box" />
  <text x="315.0" y="309" text-anchor="middle" class="box-title">Release PR</text>
  <text x="315.0" y="327" text-anchor="middle" class="box-small">gates deployment</text>
  <rect x="75" y="365" width="145" height="60" rx="12" class="box" />
  <text x="147.5" y="389" text-anchor="middle" class="box-title">GHCR</text>
  <text x="147.5" y="407" text-anchor="middle" class="box-small">controller image</text>
