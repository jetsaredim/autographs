<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 960" role="img" aria-labelledby="title desc">
  <title id="title">Autographs architecture diagram</title>
  <desc id="desc">Public visitors reach Caddy through the Cloudflare public cache and proxy route. The admin user develops through GitHub and reaches Caddy through the Cloudflare edge with caching bypassed. Porkbun delegates DNS to Cloudflare CDN configuration. GitHub deployment workflows use Terraform and Ansible for the OCI runtime and reviewed Terraform for Cloudflare. Lets Encrypt provides the Caddy origin certificate.</desc>
