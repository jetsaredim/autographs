  <text x="1322.5" y="525" text-anchor="middle" class="box-small">DB password, wallet secret</text>
  <text x="1322.5" y="540" text-anchor="middle" class="box-small">admin password hash</text>
  <rect x="65" y="540" width="160" height="65" rx="12" class="box external" />
  <text x="145.0" y="564" text-anchor="middle" class="box-title">Owner</text>
  <text x="145.0" y="582" text-anchor="middle" class="box-small">source and operations</text>
  <rect x="65" y="650" width="160" height="65" rx="12" class="box external" />
  <text x="145.0" y="674" text-anchor="middle" class="box-title">Porkbun</text>
  <text x="145.0" y="692" text-anchor="middle" class="box-small">registrar delegation</text>
  <rect x="535" y="540" width="220" height="65" rx="12" class="box external" />
  <text x="645.0" y="564" text-anchor="middle" class="box-title">Browsers</text>
  <text x="645.0" y="582" text-anchor="middle" class="box-small">public visitors + admin</text>
  <rect x="535" y="650" width="220" height="65" rx="12" class="box external" />
  <text x="645.0" y="674" text-anchor="middle" class="box-title">Let's Encrypt</text>
  <text x="645.0" y="692" text-anchor="middle" class="box-small">Caddy origin certificate</text>
</svg>
