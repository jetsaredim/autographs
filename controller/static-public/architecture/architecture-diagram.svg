  <text x="320" y="163" class="zone-title">Cloudflare</text>
  <text x="320" y="183" class="zone-small">Authoritative DNS and HTTPS edge</text>
  <rect x="300" y="500" width="420" height="310" rx="16" class="zone" />
  <text x="320" y="533" class="zone-title">GitHub</text>
  <text x="320" y="553" class="zone-small">Source, CI, releases, and workflows</text>
  <rect x="930" y="230" width="610" height="570" rx="16" class="zone" />
  <text x="950" y="263" class="zone-title">Oracle Cloud Infrastructure</text>
  <text x="950" y="283" class="zone-small">Runtime, database, private media, and secrets</text>
  <rect x="960" y="345" width="290" height="345" rx="16" class="panel" />
  <text x="980" y="378" class="zone-title">Runtime VM</text>
  <text x="980" y="398" class="zone-small">Podman containers and volume</text>
