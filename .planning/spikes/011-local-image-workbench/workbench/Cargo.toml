[package]
name = "autographs-image-workbench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
autographs-image-processing = { path = "../../../../controller/image-processing" }
axum = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
