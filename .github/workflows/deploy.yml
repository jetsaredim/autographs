name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recreate_runtime_instance:
        description: "Force Terraform to recreate the runtime VM before deploying"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_runtime_image_build:
        description: "Force rebuilding the controller image before deploying"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}
  AUTOGRAPHS_HTTP_PORT: "80"
  AUTOGRAPHS_HTTPS_PORT: "443"
  AUTOGRAPHS_DOMAIN: ${{ vars.AUTOGRAPHS_DOMAIN || 'autographs.jetsaredim.net' }}
  AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_DB_PROVIDER || 'oracle' }}
  AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER || 'oci-instance-principal' }}

jobs:
  detect-release-impact:
    name: Detect release impact
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}

    outputs:
      controller_image_impact: ${{ steps.detect.outputs.controller_image_impact }}
      runtime_deploy_impact: ${{ steps.detect.outputs.runtime_deploy_impact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect runtime image changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            controller_image:
              - "controller/**"
              - ".github/docker-bake.hcl"
            runtime_deploy:
              - "deploy/ansible/**"
              - "infra/terraform/**"
              - ".github/actions/resolve-runtime-ip/**"
              - ".github/workflows/deploy.yml"

      - name: Resolve release impact decision
        id: detect
        env:
          CONTROLLER_IMAGE_IMPACT: ${{ steps.changes.outputs.controller_image == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_runtime_image_build == 'true') }}
          RUNTIME_DEPLOY_IMPACT: ${{ steps.changes.outputs.runtime_deploy == 'true' || (github.event_name == 'workflow_dispatch' && inputs.recreate_runtime_instance == 'true') }}
        run: |
          {
            echo "controller_image_impact=${CONTROLLER_IMAGE_IMPACT}"
            echo "runtime_deploy_impact=${RUNTIME_DEPLOY_IMPACT}"
          } >> "$GITHUB_OUTPUT"

  prepare-release-version:
    name: Prepare release version
    runs-on: ubuntu-latest
    needs: detect-release-impact
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}

    outputs:
      version: ${{ steps.prepare.outputs.version }}
      bump: ${{ steps.prepare.outputs.bump }}
      deploy_impact: ${{ steps.prepare.outputs.deploy_impact }}
      deploy_required: ${{ steps.prepare.outputs.deploy_required }}
      controller_image_build: ${{ steps.prepare.outputs.controller_image_build }}
      controller_deploy_version: ${{ steps.prepare.outputs.controller_deploy_version }}
      reused_existing_version: ${{ steps.prepare.outputs.reused_existing_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve merged PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0] // {}' > "$RUNNER_TEMP/merged-pr.json"

      - name: Fetch current release status
        run: |
          git fetch origin main:refs/remotes/origin/main --tags

      - name: Prepare release status
        id: prepare
        run: |
          prepare_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            prepare_args+=(--reuse-current-status)
          fi

          python3 scripts/release-version.py prepare \
            --pr-json "$RUNNER_TEMP/merged-pr.json" \
            --controller-image-impact "${{ needs.detect-release-impact.outputs.controller_image_impact }}" \
            --runtime-deploy-impact "${{ needs.detect-release-impact.outputs.runtime_deploy_impact }}" \
            --source-revision "${GITHUB_SHA}" \
            --committed-status-ref origin/main \
            --github-output "$GITHUB_OUTPUT" \
            "${prepare_args[@]}"

      - name: Refuse duplicate Git release tag
        if: steps.prepare.outputs.reused_existing_version != 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Git tag ${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Refuse duplicate GHCR semver tag
        if: steps.prepare.outputs.controller_image_build == 'true' && steps.prepare.outputs.reused_existing_version != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          python3 scripts/release-version.py assert-ghcr-tag-absent \
            --image-repository "${GHCR_CONTROLLER_IMAGE_REPOSITORY}" \
            --tag "${RELEASE_VERSION}"

      - name: Commit release status and tag
        if: steps.prepare.outputs.reused_existing_version != 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status.json README.md
          git commit -m "chore: update release status to ${RELEASE_VERSION} [skip ci]"
          git tag "${RELEASE_VERSION}"
          git push origin HEAD:main
          git push origin "${RELEASE_VERSION}"

  build-images:
    name: Build and publish controller image
    runs-on: ubuntu-latest
    needs: prepare-release-version
    if: needs.prepare-release-version.outputs.controller_image_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve GHCR semver tag
        id: ghcr_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
        run: |
          python3 scripts/release-version.py ghcr-tag-exists \
            --image-repository "${GHCR_CONTROLLER_IMAGE_REPOSITORY}" \
            --tag "${RELEASE_VERSION}" \
            --github-output "$GITHUB_OUTPUT"

          if [ "${{ needs.prepare-release-version.outputs.reused_existing_version }}" != "true" ]; then
            if grep -qx "exists=true" "$GITHUB_OUTPUT"; then
              echo "GHCR image tag ${RELEASE_VERSION} already exists and must not be overwritten." >&2
              exit 1
            fi
          fi

      - name: Build and publish controller image
        if: steps.ghcr_tag.outputs.exists != 'true'
        uses: docker/bake-action@v7
        env:
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        with:
          files: |
            .github/docker-bake.hcl
          push: true

  resolve-controller-image:
    name: Resolve controller image
    runs-on: ubuntu-latest
    needs:
      - prepare-release-version
      - build-images
    if: always() && needs.prepare-release-version.outputs.deploy_required == 'true'

    outputs:
      controller_image: ${{ steps.resolve.outputs.controller_image }}

    steps:
      - name: Resolve deploy image references
        id: resolve
        env:
          CONTROLLER_IMAGE_BUILD: ${{ needs.prepare-release-version.outputs.controller_image_build }}
          BUILD_IMAGES_RESULT: ${{ needs.build-images.result }}
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          CONTROLLER_DEPLOY_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
        run: |
          set -euo pipefail

          if [ "$CONTROLLER_IMAGE_BUILD" = "true" ]; then
            if [ "$BUILD_IMAGES_RESULT" != "success" ]; then
              echo "Controller image build was required but build-images finished with result: $BUILD_IMAGES_RESULT" >&2
              exit 1
            fi
          fi

          if [ -z "$CONTROLLER_DEPLOY_VERSION" ]; then
            echo "No controller deploy version was resolved." >&2
            exit 1
          fi

          {
            echo "controller_image=${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_DEPLOY_VERSION}"
          } >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: prepare-release-version
    if: needs.prepare-release-version.outputs.deploy_required == 'true'

    outputs:
      runtime_public_ip: ${{ steps.terraform_apply.outputs.runtime_public_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-version.outputs.version }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Terraform apply
        id: terraform_apply
        working-directory: infra/terraform
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_shape: ${{ vars.OCI_RUNTIME_SHAPE || 'VM.Standard.E2.1.Micro' }}
          TF_VAR_runtime_ocpus: ${{ vars.OCI_RUNTIME_OCPUS || 1 }}
          TF_VAR_runtime_memory_gbs: ${{ vars.OCI_RUNTIME_MEMORY_GBS || 1 }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_create_autonomous_database: ${{ vars.OCI_CREATE_AUTONOMOUS_DATABASE || 'false' }}
          TF_VAR_autonomous_database_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_NAME || 'autographsdb' }}
          TF_VAR_autonomous_database_display_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_DISPLAY_NAME || 'autographs-prod-adb' }}
          TF_VAR_autonomous_database_admin_password: ${{ secrets.ADB_ADMIN_PASSWORD }}
          TF_VAR_autonomous_database_is_mtls_connection_required: ${{ vars.OCI_AUTONOMOUS_DATABASE_IS_MTLS_CONNECTION_REQUIRED || 'true' }}
          TF_VAR_create_media_bucket: ${{ vars.OCI_CREATE_MEDIA_BUCKET || 'false' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_media_bucket_name: ${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_domain: ${{ vars.AUTOGRAPHS_DNS_DOMAIN || 'jetsaredim.net' }}
          TF_VAR_autographs_dns_subdomain: ${{ vars.AUTOGRAPHS_DNS_SUBDOMAIN || 'autographs' }}
          TF_VAR_autographs_dns_ttl: ${{ vars.AUTOGRAPHS_DNS_TTL || 600 }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
        run: |
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recreate_runtime_instance }}" = "true" ]; then
            if terraform state list | grep -Fxq 'module.compute.oci_core_instance.runtime[0]'; then
              terraform taint 'module.compute.oci_core_instance.runtime[0]'
            else
              echo "Runtime instance is not in Terraform state; skipping taint."
            fi
          fi
          terraform apply -auto-approve
          echo "runtime_public_ip=$(terraform output -raw runtime_public_ip)" >> "$GITHUB_OUTPUT"

  deploy-runtime:
    name: Deploy runtime to VM
    runs-on: ubuntu-latest

    needs:
      - prepare-release-version
      - resolve-controller-image
      - terraform-apply
    if: needs.prepare-release-version.outputs.deploy_required == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-version.outputs.version }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          AUTOGRAPHS_OPERATOR_API_TOKEN: ${{ secrets.AUTOGRAPHS_OPERATOR_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
        with:
          playbook: playbooks/deploy.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ needs.terraform-apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_controller_image=${{ needs.resolve-controller-image.outputs.controller_image }}
            --extra-vars autographs_deploy_repo_version=${{ needs.prepare-release-version.outputs.version }}
            --extra-vars autographs_deploy_deployed_controller_version=${{ needs.prepare-release-version.outputs.controller_deploy_version }}
            --extra-vars autographs_deploy_source_revision=${{ github.sha }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_deploy_http_port=${{ env.AUTOGRAPHS_HTTP_PORT }}
            --extra-vars autographs_deploy_https_port=${{ env.AUTOGRAPHS_HTTPS_PORT }}
            --extra-vars autographs_deploy_controller_db_provider=${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
            --extra-vars autographs_deploy_controller_media_storage_provider=${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
            --extra-vars oci_media_namespace=${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
            --extra-vars oci_media_bucket_name=${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
            --extra-vars autographs_deploy_ssh_ready_timeout_seconds=${{ vars.DEPLOY_SSH_READY_TIMEOUT_SECONDS || '900' }}
            --extra-vars autographs_deploy_ssh_ready_interval_seconds=${{ vars.DEPLOY_SSH_READY_INTERVAL_SECONDS || '10' }}

      - name: Verify deployment health
        env:
          AUTOGRAPHS_DOMAIN: ${{ env.AUTOGRAPHS_DOMAIN }}
          AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
          AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
        run: |
          check_https_health() {
            local path="$1"
            local label="$2"

            for _ in $(seq 1 30); do
              if curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}" >/dev/null; then
                curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}"
                return 0
              fi
              sleep 5
            done

            echo "Deployment did not pass Caddy-fronted HTTPS ${label} check at ${path} for ${AUTOGRAPHS_DOMAIN}" >&2
            return 1
          }

          check_https_health "/manifest.json" "static public release"
          controller_health="$(check_https_health "/admin/api/health" "Rust controller admin API")"
          if ! printf '%s' "$controller_health" | grep -q "\"controllerDbProvider\":\"${AUTOGRAPHS_CONTROLLER_DB_PROVIDER}\""; then
            echo "Rust controller health did not report expected DB provider ${AUTOGRAPHS_CONTROLLER_DB_PROVIDER}: ${controller_health}" >&2
            exit 1
          fi
          if ! printf '%s' "$controller_health" | grep -q "\"controllerMediaStorageProvider\":\"${AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER}\""; then
            echo "Rust controller health did not report expected media provider ${AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER}: ${controller_health}" >&2
            exit 1
          fi

      - name: Mark controller deploy successful
        if: needs.prepare-release-version.outputs.controller_image_build == 'true'
        env:
          CONTROLLER_DEPLOY_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
        run: |
          python3 scripts/release-version.py mark-deployed \
            --controller-version "${CONTROLLER_DEPLOY_VERSION}"

      - name: Commit deployed release status
        if: needs.prepare-release-version.outputs.controller_image_build == 'true'
        env:
          CONTROLLER_DEPLOY_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          current_deployed="$(
            git show origin/main:.release-status.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("deployedControllerVersion", ""))'
          )"
          if [ "$current_deployed" = "$CONTROLLER_DEPLOY_VERSION" ]; then
            echo "Remote main already records deployed controller ${CONTROLLER_DEPLOY_VERSION}."
            exit 0
          fi

          git add .release-status.json README.md
          if git diff --cached --quiet; then
            echo "Release status already records deployed controller ${CONTROLLER_DEPLOY_VERSION}."
          else
            git commit -m "chore: mark deployed controller ${CONTROLLER_DEPLOY_VERSION} [skip ci]"
            git push origin HEAD:main
          fi
