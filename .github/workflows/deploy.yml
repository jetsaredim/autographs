name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recreate_runtime_instance:
        description: "Force Terraform to recreate the runtime VM before deploying"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_runtime_image_build:
        description: "Force deploying the current semver controller image"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}
  AUTOGRAPHS_HTTP_PORT: "80"
  AUTOGRAPHS_HTTPS_PORT: "443"
  AUTOGRAPHS_DOMAIN: ${{ vars.AUTOGRAPHS_DOMAIN || 'autographs.jetsaredim.net' }}
  AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_DB_PROVIDER || 'oracle' }}
  AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER || 'oci-instance-principal' }}
  AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS: ${{ vars.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS || '86400' }}

jobs:
  detect-release-status-commit:
    name: Detect release status commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    outputs:
      release_status_commit: ${{ steps.detect.outputs.release_status_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect bot-authored release status commit
        id: detect
        env:
          HEAD_ACTOR: ${{ github.actor }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          release_status_commit=false

          changed_files="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          unexpected_files="$(
            printf '%s\n' "$changed_files" \
              | grep -Ev '^(VERSION|\.release-status\.json|README\.md)$' \
              || true
          )"

          if [ "$HEAD_ACTOR" = "github-actions[bot]" ] \
            && printf '%s' "$HEAD_MESSAGE" | grep -Eq '^chore: (update release status to|mark deployed controller) v[0-9]+\.[0-9]+\.[0-9]+' \
            && [ -z "$unexpected_files" ]; then
            release_status_commit=true
          fi

          echo "release_status_commit=${release_status_commit}" >> "$GITHUB_OUTPUT"

  detect-release-impact:
    name: Detect release impact
    runs-on: ubuntu-latest
    needs: detect-release-status-commit
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.detect-release-status-commit.outputs.release_status_commit != 'true') }}

    outputs:
      controller_image_impact: ${{ steps.detect.outputs.controller_image_impact }}
      runtime_deploy_impact: ${{ steps.detect.outputs.runtime_deploy_impact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect runtime image changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            controller_image:
              - "controller/**"
              - ".github/docker-bake.hcl"
            runtime_deploy:
              - "deploy/ansible/**"
              - "infra/terraform/**"
              - ".github/actions/resolve-runtime-ip/**"
              - ".github/workflows/deploy.yml"

      - name: Resolve release impact decision
        id: detect
        env:
          CONTROLLER_IMAGE_IMPACT: ${{ steps.changes.outputs.controller_image == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_runtime_image_build == 'true') }}
          RUNTIME_DEPLOY_IMPACT: ${{ steps.changes.outputs.runtime_deploy == 'true' || (github.event_name == 'workflow_dispatch' && inputs.recreate_runtime_instance == 'true') }}
        run: |
          {
            echo "controller_image_impact=${CONTROLLER_IMAGE_IMPACT}"
            echo "runtime_deploy_impact=${RUNTIME_DEPLOY_IMPACT}"
          } >> "$GITHUB_OUTPUT"

  prepare-release-version:
    name: Prepare release version
    runs-on: ubuntu-latest
    needs: detect-release-impact
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-release-impact.result == 'success' }}

    outputs:
      version: ${{ steps.publish.outputs.version }}
      bump: ${{ steps.publish.outputs.bump }}
      deploy_impact: ${{ steps.publish.outputs.deploy_impact }}
      deploy_required: ${{ steps.publish.outputs.deploy_required }}
      controller_image_build: ${{ steps.publish.outputs.controller_image_build }}
      controller_deploy_version: ${{ steps.publish.outputs.controller_deploy_version }}
      reused_existing_version: ${{ steps.publish.outputs.reused_existing_version }}
      source_revision: ${{ steps.publish.outputs.source_revision }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse non-main manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploy workflow_dispatch must run from refs/heads/main, got ${GITHUB_REF}." >&2
          exit 1

      - name: Resolve merged PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0] // {}' > "$RUNNER_TEMP/merged-pr.json"

      - name: Fetch current release status
        run: |
          git fetch origin main:refs/remotes/origin/main --tags

      - name: Publish release status
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prepare_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            prepare_args+=(--reuse-current-status)
          fi

          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main --tags
            git switch --force-create release-status-update origin/main

            current_main_revision="$(git rev-parse HEAD)"
            release_source_revision="$current_main_revision"
            if [ "${{ github.event_name }}" = "push" ]; then
              release_source_revision="${GITHUB_SHA}"
              current_status_source="$(
                python3 -c 'import json, pathlib; path = pathlib.Path(".release-status.json"); print(json.loads(path.read_text(encoding="utf-8")).get("sourceRevision", "") if path.exists() else "")'
              )"
              if [ "$current_main_revision" != "${GITHUB_SHA}" ] && [ "$current_status_source" != "${GITHUB_SHA}" ]; then
                echo "origin/main advanced to ${current_main_revision}; publishing a version event for triggering merge ${GITHUB_SHA} on current main."
              fi
            fi

            output_file="$RUNNER_TEMP/release-output-${attempt}.txt"
            rm -f "$output_file"
            python3 scripts/release-version.py prepare \
              --pr-json "$RUNNER_TEMP/merged-pr.json" \
              --controller-image-impact "${{ needs.detect-release-impact.outputs.controller_image_impact }}" \
              --runtime-deploy-impact "${{ needs.detect-release-impact.outputs.runtime_deploy_impact }}" \
              --source-revision "$release_source_revision" \
              --committed-status-ref origin/main \
              --github-output "$output_file" \
              "${prepare_args[@]}"

            release_version="$(grep '^version=' "$output_file" | cut -d= -f2-)"
            controller_image_build="$(grep '^controller_image_build=' "$output_file" | cut -d= -f2-)"
            reused_existing_version="$(grep '^reused_existing_version=' "$output_file" | cut -d= -f2-)"

            if [ "$reused_existing_version" = "true" ]; then
              cat "$output_file" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if git rev-parse --quiet --verify "refs/tags/${release_version}" >/dev/null; then
              echo "Git tag ${release_version} already exists." >&2
              exit 1
            fi

            if [ "$controller_image_build" = "true" ]; then
              python3 scripts/release-version.py assert-ghcr-tag-absent \
                --image-repository "${GHCR_CONTROLLER_IMAGE_REPOSITORY}" \
                --tag "${release_version}"
            fi

            git add VERSION .release-status.json README.md
            if git diff --cached --quiet; then
              cat "$output_file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: update release status to ${release_version}"
            if git push origin HEAD:main; then
              cat "$output_file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main advanced while publishing release status; retrying (${attempt}/3)."
          done
          echo "Failed to publish release status after retries." >&2
          exit 1

      - name: Ensure release tag
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.version }}
          SOURCE_REVISION: ${{ steps.publish.outputs.source_revision }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if git rev-parse --quiet --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            exit 0
          fi
          release_status_revision="$(
            for revision in $(git rev-list origin/main -- .release-status.json); do
              if git show "${revision}:.release-status.json" \
                | python3 -c 'import json, os, sys; status = json.load(sys.stdin); sys.exit(0 if status.get("repoVersion") == os.environ["RELEASE_VERSION"] and status.get("sourceRevision") == os.environ["SOURCE_REVISION"] else 1)'; then
                echo "$revision"
                break
              fi
            done
          )"
          if [ -z "$release_status_revision" ]; then
            echo "Could not locate release status commit on origin/main for ${RELEASE_VERSION} (${SOURCE_REVISION})." >&2
            exit 1
          fi
          source_is_main_ancestor=false
          if git merge-base --is-ancestor "${SOURCE_REVISION}" origin/main; then
            source_is_main_ancestor=true
          else
            echo "Source revision ${SOURCE_REVISION} is not an ancestor of origin/main; tagging release status commit ${release_status_revision}." >&2
          fi
          tag_revision="$(
            python3 scripts/release-version.py tag-target \
              --release-status-revision "${release_status_revision}" \
              --source-revision "${SOURCE_REVISION}" \
              --source-is-main-ancestor "${source_is_main_ancestor}"
          )"
          git tag "${RELEASE_VERSION}" "$tag_revision"
          git push origin "${RELEASE_VERSION}"

  build-images:
    name: Build and publish controller image
    runs-on: ubuntu-latest
    needs: prepare-release-version
    if: needs.prepare-release-version.outputs.controller_image_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve GHCR semver tag
        id: ghcr_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
        run: |
          python3 scripts/release-version.py ghcr-tag-exists \
            --image-repository "${GHCR_CONTROLLER_IMAGE_REPOSITORY}" \
            --tag "${RELEASE_VERSION}" \
            --github-output "$GITHUB_OUTPUT"

          if [ "${{ needs.prepare-release-version.outputs.reused_existing_version }}" != "true" ]; then
            if grep -qx "exists=true" "$GITHUB_OUTPUT"; then
              echo "GHCR image tag ${RELEASE_VERSION} already exists and must not be overwritten." >&2
              exit 1
            fi
          fi

      - name: Build and publish controller image
        if: steps.ghcr_tag.outputs.exists != 'true'
        uses: docker/bake-action@v7
        env:
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ needs.prepare-release-version.outputs.version }}
          SOURCE_REVISION: ${{ needs.prepare-release-version.outputs.source_revision }}
        with:
          files: |
            .github/docker-bake.hcl
          push: true

  resolve-controller-image:
    name: Resolve controller image
    runs-on: ubuntu-latest
    needs:
      - prepare-release-version
      - build-images
    if: always() && needs.prepare-release-version.outputs.deploy_required == 'true'

    outputs:
      controller_image: ${{ steps.resolve.outputs.controller_image }}

    steps:
      - name: Resolve deploy image references
        id: resolve
        env:
          CONTROLLER_IMAGE_BUILD: ${{ needs.prepare-release-version.outputs.controller_image_build }}
          BUILD_IMAGES_RESULT: ${{ needs.build-images.result }}
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          CONTROLLER_DEPLOY_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
        run: |
          set -euo pipefail

          if [ "$CONTROLLER_IMAGE_BUILD" = "true" ]; then
            if [ "$BUILD_IMAGES_RESULT" != "success" ]; then
              echo "Controller image build was required but build-images finished with result: $BUILD_IMAGES_RESULT" >&2
              exit 1
            fi
          fi

          if [ -z "$CONTROLLER_DEPLOY_VERSION" ]; then
            echo "No controller deploy version was resolved." >&2
            exit 1
          fi

          {
            echo "controller_image=${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_DEPLOY_VERSION}"
          } >> "$GITHUB_OUTPUT"

  deploy-runtime:
    name: Deploy runtime to VM
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    needs:
      - prepare-release-version
      - resolve-controller-image
    if: needs.prepare-release-version.outputs.deploy_required == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-version.outputs.version }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Refuse superseded deployment
        env:
          TARGET_REPO_VERSION: ${{ needs.prepare-release-version.outputs.version }}
          TARGET_CONTROLLER_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:.release-status.json > "$RUNNER_TEMP/current-release-status.json"
          python3 scripts/release-version.py assert-deploy-current \
            --status-file "$RUNNER_TEMP/current-release-status.json" \
            --repo-version "$TARGET_REPO_VERSION" \
            --controller-version "$TARGET_CONTROLLER_VERSION"

      - name: Terraform apply
        id: terraform_apply
        working-directory: infra/terraform
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_shape: ${{ vars.OCI_RUNTIME_SHAPE || 'VM.Standard.E2.1.Micro' }}
          TF_VAR_runtime_ocpus: ${{ vars.OCI_RUNTIME_OCPUS || 1 }}
          TF_VAR_runtime_memory_gbs: ${{ vars.OCI_RUNTIME_MEMORY_GBS || 1 }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_create_autonomous_database: ${{ vars.OCI_CREATE_AUTONOMOUS_DATABASE || 'false' }}
          TF_VAR_autonomous_database_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_NAME || 'autographsdb' }}
          TF_VAR_autonomous_database_display_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_DISPLAY_NAME || 'autographs-prod-adb' }}
          TF_VAR_autonomous_database_is_mtls_connection_required: ${{ vars.OCI_AUTONOMOUS_DATABASE_IS_MTLS_CONNECTION_REQUIRED || 'true' }}
          TF_VAR_create_media_bucket: ${{ vars.OCI_CREATE_MEDIA_BUCKET || 'false' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_media_bucket_name: ${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_domain: ${{ vars.AUTOGRAPHS_DNS_DOMAIN || 'jetsaredim.net' }}
          TF_VAR_autographs_dns_subdomain: ${{ vars.AUTOGRAPHS_DNS_SUBDOMAIN || 'autographs' }}
          TF_VAR_autographs_dns_ttl: ${{ vars.AUTOGRAPHS_DNS_TTL || 600 }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
        run: |
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recreate_runtime_instance }}" = "true" ]; then
            if terraform state list | grep -Fxq 'module.compute.oci_core_instance.runtime[0]'; then
              terraform taint 'module.compute.oci_core_instance.runtime[0]'
            else
              echo "Runtime instance is not in Terraform state; skipping taint."
            fi
          fi
          terraform apply -auto-approve
          runtime_secret_ids="$(terraform output -json runtime_secret_id_env_vars)"
          if ! jq -e '
            type == "object" and
            length == 3 and
            all(.[]; type == "string" and length > 0)
          ' <<< "$runtime_secret_ids" >/dev/null; then
            echo "::error::Terraform withheld the runtime Vault secret OCIDs. The Oracle database password is OCI-generated and must not be populated or overwritten out of band. Populate only the Oracle wallet password and admin password hash CURRENT values to create version 2 or later, then rerun deploy."
            exit 1
          fi
          admin_password_hash_vault_secret_id="$(jq -er '.AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_password_vault_secret_id="$(jq -er '.ORACLE_DB_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_wallet_password_vault_secret_id="$(jq -er '.ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          {
            echo "runtime_public_ip=$(terraform output -raw runtime_public_ip)"
            echo "admin_password_hash_vault_secret_id=${admin_password_hash_vault_secret_id}"
            echo "oracle_db_password_vault_secret_id=${oracle_db_password_vault_secret_id}"
            echo "oracle_db_wallet_password_vault_secret_id=${oracle_db_wallet_password_vault_secret_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          AUTOGRAPHS_OPERATOR_API_TOKEN: ${{ secrets.AUTOGRAPHS_OPERATOR_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.admin_password_hash_vault_secret_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          ORACLE_DB_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_password_vault_secret_id }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_wallet_password_vault_secret_id }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
        with:
          playbook: playbooks/deploy.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_controller_image=${{ needs.resolve-controller-image.outputs.controller_image }}
            --extra-vars autographs_deploy_repo_version=${{ needs.prepare-release-version.outputs.version }}
            --extra-vars autographs_deploy_deployed_controller_version=${{ needs.prepare-release-version.outputs.controller_deploy_version }}
            --extra-vars autographs_deploy_source_revision=${{ needs.prepare-release-version.outputs.source_revision }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_deploy_http_port=${{ env.AUTOGRAPHS_HTTP_PORT }}
            --extra-vars autographs_deploy_https_port=${{ env.AUTOGRAPHS_HTTPS_PORT }}
            --extra-vars autographs_deploy_controller_db_provider=${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
            --extra-vars autographs_deploy_controller_media_storage_provider=${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
            --extra-vars autographs_oracle_heartbeat_interval_seconds=${{ env.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS }}
            --extra-vars oci_media_namespace=${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
            --extra-vars oci_media_bucket_name=${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
            --extra-vars autographs_deploy_ssh_ready_timeout_seconds=${{ vars.DEPLOY_SSH_READY_TIMEOUT_SECONDS || '900' }}
            --extra-vars autographs_deploy_ssh_ready_interval_seconds=${{ vars.DEPLOY_SSH_READY_INTERVAL_SECONDS || '10' }}

      - name: Verify deployment health
        env:
          AUTOGRAPHS_DOMAIN: ${{ env.AUTOGRAPHS_DOMAIN }}
          AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
          AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
        run: |
          check_https_health() {
            local path="$1"
            local label="$2"

            for _ in $(seq 1 30); do
              if curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}" >/dev/null; then
                curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}"
                return 0
              fi
              sleep 5
            done

            echo "Deployment did not pass Caddy-fronted HTTPS ${label} check at ${path} for ${AUTOGRAPHS_DOMAIN}" >&2
            return 1
          }

          check_https_health "/manifest.json" "static public release"
          controller_health="$(check_https_health "/admin/api/health" "Rust controller admin API")"
          if ! printf '%s' "$controller_health" | grep -q "\"controllerDbProvider\":\"${AUTOGRAPHS_CONTROLLER_DB_PROVIDER}\""; then
            echo "Rust controller health did not report expected DB provider ${AUTOGRAPHS_CONTROLLER_DB_PROVIDER}: ${controller_health}" >&2
            exit 1
          fi
          if ! printf '%s' "$controller_health" | grep -q "\"controllerMediaStorageProvider\":\"${AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER}\""; then
            echo "Rust controller health did not report expected media provider ${AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER}: ${controller_health}" >&2
            exit 1
          fi

      - name: Commit deployed release status
        if: needs.prepare-release-version.outputs.controller_image_build == 'true'
        env:
          CONTROLLER_DEPLOY_VERSION: ${{ needs.prepare-release-version.outputs.controller_deploy_version }}
          TARGET_REPO_VERSION: ${{ needs.prepare-release-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git switch --force-create release-status-update origin/main

            current_deployed="$(
              python3 -c 'import json; print(json.load(open(".release-status.json", encoding="utf-8")).get("deployedControllerVersion", ""))'
            )"
            if [ "$current_deployed" = "$CONTROLLER_DEPLOY_VERSION" ]; then
              echo "Remote main already records deployed controller ${CONTROLLER_DEPLOY_VERSION}."
              exit 0
            fi
            python3 scripts/release-version.py assert-deploy-current \
              --repo-version "$TARGET_REPO_VERSION" \
              --controller-version "$CONTROLLER_DEPLOY_VERSION"

            python3 scripts/release-version.py mark-deployed \
              --controller-version "${CONTROLLER_DEPLOY_VERSION}"
            git add .release-status.json README.md
            if git diff --cached --quiet; then
              echo "Release status already records deployed controller ${CONTROLLER_DEPLOY_VERSION}."
              exit 0
            fi
            git commit -m "chore: mark deployed controller ${CONTROLLER_DEPLOY_VERSION}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced while recording deployed controller; retrying (${attempt}/3)."
          done
          echo "Failed to record deployed controller ${CONTROLLER_DEPLOY_VERSION} after retries." >&2
          exit 1
