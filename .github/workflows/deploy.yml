name: Release and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - .release-status.json
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile a draft release or roll back only the controller
        required: true
        default: retry
        type: choice
        options:
          - retry
          - rollback
      release_tag:
        description: Existing semantic GitHub Release tag (vX.Y.Z)
        required: true
        type: string
      recreate_runtime_instance:
        description: Recreate the runtime VM during a retry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}
  AUTOGRAPHS_HTTP_PORT: "80"
  AUTOGRAPHS_HTTPS_PORT: "443"
  AUTOGRAPHS_DOMAIN: ${{ vars.AUTOGRAPHS_DOMAIN || 'autographs.jetsaredim.net' }}
  AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_DB_PROVIDER || 'oracle' }}
  AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER || 'oci-instance-principal' }}
  AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS: ${{ vars.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS || '86400' }}

jobs:
  release:
    name: Update Release PR or create draft Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check unresolved draft releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[]' | jq -s . > "$RUNNER_TEMP/releases.json"
          set +e
          preflight="$(python3 scripts/release.py preflight-drafts \
            --releases-json "$RUNNER_TEMP/releases.json")"
          preflight_status=$?
          set -e
          if [ "$preflight_status" -eq 2 ]; then
            draft_tag="$(jq -er '.tags[0]' <<< "$preflight")"
            echo "Unresolved draft release ${draft_tag}; reconcile it before advancing release-please." >&2
            echo "gh workflow run deploy.yml --ref main -f operation=retry -f release_tag=${draft_tag}" >&2
            exit 1
          fi
          if [ "$preflight_status" -ne 0 ]; then
            exit "$preflight_status"
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  production:
    name: Reconcile production release
    needs: release
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'push' &&
            needs.release.result == 'success' &&
            needs.release.outputs.release_created == 'true' &&
            needs.release.outputs.tag_name != ''
          ) ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Resolve release request
        id: request
        env:
          AUTOMATIC_TAG: ${{ needs.release.outputs.tag_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECREATE_RUNTIME_INSTANCE: ${{ inputs.recreate_runtime_instance }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            operation=automatic
            release_tag="$AUTOMATIC_TAG"
          else
            operation="$DISPATCH_OPERATION"
            release_tag="$DISPATCH_TAG"
          fi
          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match vX.Y.Z, got: ${release_tag}" >&2
            exit 1
          fi
          release_json="$(gh release view "$release_tag" --json isDraft,tagName)"
          if [ "$(jq -r '.tagName' <<< "$release_json")" != "$release_tag" ]; then
            echo "GitHub Release tag does not match ${release_tag}." >&2
            exit 1
          fi
          is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          if [ "$operation" = "rollback" ]; then
            if [ "$is_draft" != "false" ]; then
              echo "Controller rollback requires a published GitHub Release." >&2
              exit 1
            fi
            if [ "$RECREATE_RUNTIME_INSTANCE" = "true" ]; then
              echo "Runtime recreation is valid for retry only, not rollback." >&2
              exit 1
            fi
          elif [ "$is_draft" != "true" ]; then
            echo "Retry requires an unresolved draft release; ${release_tag} is already published." >&2
            exit 1
          fi
          {
            echo "operation=${operation}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout selected release tag
        if: steps.request.outputs.operation != 'rollback'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: ${{ steps.request.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout current main for controller rollback
        if: steps.request.outputs.operation == 'rollback'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate selected release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main --tags
          source_revision="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          python3 scripts/release.py validate-target \
            --tag "$RELEASE_TAG" \
            --source-revision "$source_revision"
          echo "source_revision=${source_revision}" >> "$GITHUB_OUTPUT"
          git show origin/main:.release-status.json > "$RUNNER_TEMP/current-release-status.json"

      - name: Load published rollback manifest
        if: steps.request.outputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release-assets"
          python3 scripts/release.py validate-manifest \
            --manifest "$RUNNER_TEMP/release-assets/release-manifest.json" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

      - name: Load retry manifest when present
        if: steps.request.outputs.operation == 'retry'
        id: retry_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          asset_count="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '[.assets[] | select(.name == "release-manifest.json")] | length')"
          if [ "$asset_count" -eq 1 ]; then
            gh release download "$RELEASE_TAG" \
              --pattern release-manifest.json \
              --dir "$RUNNER_TEMP/release-assets"
            python3 scripts/release.py validate-manifest \
              --manifest "$RUNNER_TEMP/release-assets/release-manifest.json" \
              --tag "$RELEASE_TAG" \
              --source-revision "$SOURCE_REVISION"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$asset_count" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release contains multiple release-manifest.json assets." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.request.outputs.operation != 'rollback'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve controller image plan
        if: steps.request.outputs.operation != 'rollback'
        id: image_plan
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          RETRY_MANIFEST_FOUND: ${{ steps.retry_manifest.outputs.found || 'false' }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-assets/release-manifest.json"
          if [ "$RETRY_MANIFEST_FOUND" = "true" ]; then
            controller_tag="$(jq -er '.controller.tag' "$manifest")"
            controller_digest="$(jq -er '.controller.digest' "$manifest")"
            controller_changed="$(jq -r '.controllerChanged' "$manifest")"
            image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${controller_tag}"
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Manifest-recorded controller image does not exist: ${image}" >&2
              exit 1
            fi
            if [ "$controller_changed" = "true" ]; then
              image_revision="$(docker buildx imagetools inspect "$image" \
                --format '{{json .Image.config.Labels}}' \
                | jq -er '.["org.opencontainers.image.revision"]')"
              if [ "$image_revision" != "$SOURCE_REVISION" ]; then
                echo "Existing release image revision ${image_revision} does not match ${SOURCE_REVISION}." >&2
                exit 1
              fi
            fi
            {
              echo "build_required=false"
              echo "controller_tag=${controller_tag}"
              echo "controller_digest=${controller_digest}"
              echo "manifest_authoritative=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag="$(python3 scripts/release.py previous-release --tag "$RELEASE_TAG")"
          classify_args=(--tag "$RELEASE_TAG")
          if [ -n "$previous_tag" ]; then
            classify_args+=(--previous-tag "$previous_tag")
          fi
          classification="$(python3 scripts/release.py classify-range "${classify_args[@]}")"
          controller_changed="$(jq -r '.controllerChanged' <<< "$classification")"
          if [ "$controller_changed" = "true" ]; then
            controller_tag="$RELEASE_TAG"
          else
            controller_tag="$(jq -er '.deployedControllerVersion' "$RUNNER_TEMP/current-release-status.json")"
          fi
          image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${controller_tag}"
          image_exists=false
          inspect_error="$RUNNER_TEMP/controller-image-inspect-error.txt"
          if docker buildx imagetools inspect "$image" >/dev/null 2>"$inspect_error"; then
            image_exists=true
          elif ! grep -Eiq '(manifest unknown|not found|404)' "$inspect_error"; then
            echo "Unable to determine whether controller image ${image} exists:" >&2
            sed 's/^/  /' "$inspect_error" >&2
            exit 1
          fi
          build_required=false
          if [ "$controller_changed" = "true" ]; then
            if [ "$image_exists" = "true" ]; then
              if [ "$OPERATION" != "retry" ]; then
                echo "Controller release tag ${image} already exists and will not be overwritten." >&2
                exit 1
              fi
              image_revision="$(docker buildx imagetools inspect "$image" \
                --format '{{json .Image.config.Labels}}' \
                | jq -er '.["org.opencontainers.image.revision"]')"
              if [ "$image_revision" != "$SOURCE_REVISION" ]; then
                echo "Existing release image revision ${image_revision} does not match ${SOURCE_REVISION}." >&2
                exit 1
              fi
            else
              build_required=true
            fi
          elif [ "$image_exists" != "true" ]; then
            echo "Active controller image required for reuse does not exist: ${image}" >&2
            exit 1
          fi
          {
            echo "build_required=${build_required}"
            echo "controller_tag=${controller_tag}"
            echo "manifest_authoritative=false"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish semantic controller image
        if: steps.image_plan.outputs.build_required == 'true'
        uses: docker/bake-action@v7
        env:
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        with:
          files: |
            .github/docker-bake.hcl
          push: true

      - name: Reconcile release manifest
        if: steps.request.outputs.operation != 'rollback'
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_AUTHORITATIVE: ${{ steps.image_plan.outputs.manifest_authoritative }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          CONTROLLER_TAG: ${{ steps.image_plan.outputs.controller_tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          manifest="$asset_dir/release-manifest.json"
          mkdir -p "$asset_dir"
          if [ "$MANIFEST_AUTHORITATIVE" = "true" ]; then
            python3 scripts/release.py reconcile-asset \
              --generated "$manifest" \
              --existing "$manifest" >/dev/null
          else
            image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}"
            controller_digest="$(docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            python3 scripts/release.py plan \
              --tag "$RELEASE_TAG" \
              --source-revision "$SOURCE_REVISION" \
              --status-file "$RUNNER_TEMP/current-release-status.json" \
              --controller-digest "$controller_digest" \
              --output "$RUNNER_TEMP/release-plan.json"
            generated="$RUNNER_TEMP/generated-release-manifest.json"
            python3 scripts/release.py manifest \
              --plan-json "$RUNNER_TEMP/release-plan.json" \
              --output "$generated"
            existing_args=()
            asset_count="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')"
            if [ "$asset_count" -eq 1 ]; then
              gh release download "$RELEASE_TAG" \
                --pattern release-manifest.json \
                --dir "$asset_dir"
              existing_args+=(--existing "$manifest")
            elif [ "$asset_count" -ne 0 ]; then
              echo "Release contains multiple release-manifest.json assets." >&2
              exit 1
            fi
            reconciliation="$(python3 scripts/release.py reconcile-asset \
              --generated "$generated" "${existing_args[@]}")"
            if [ "$reconciliation" = "create" ]; then
              cp "$generated" "$manifest"
              gh release upload "$RELEASE_TAG" "$manifest"
            fi
          fi
          python3 scripts/release.py validate-manifest \
            --manifest "$manifest" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          {
            echo "impact=$(jq -er '.impact' "$manifest")"
            echo "production_mutation_required=$(jq -r '.impact != \"repo-only\"' "$manifest")"
            echo "controller_tag=$(jq -er '.controller.tag' "$manifest")"
            echo "controller_digest=$(jq -er '.controller.digest' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Select rollback controller from published manifest
        if: steps.request.outputs.operation == 'rollback'
        id: rollback_manifest
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-assets/release-manifest.json"
          {
            echo "controller_tag=$(jq -er '.controller.tag' "$manifest")"
            echo "controller_digest=$(jq -er '.controller.digest' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Write OCI API private key
        if: steps.manifest.outputs.production_mutation_required == 'true' || steps.request.outputs.operation == 'rollback'
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Resolve runtime VM IP for rollback
        if: steps.request.outputs.operation == 'rollback'
        id: rollback_runtime
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-private-key-pem: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          oci-cli-user-ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          vm-public-ip: ${{ vars.VM_PUBLIC_IP }}

      - name: Recheck controller digest before full deployment
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        env:
          CONTROLLER_TAG: ${{ steps.manifest.outputs.controller_tag }}
          EXPECTED_DIGEST: ${{ steps.manifest.outputs.controller_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(docker buildx imagetools inspect \
            "${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          python3 scripts/release.py assert-digest \
            --expected "$EXPECTED_DIGEST" \
            --actual "$actual_digest"

      - name: Terraform apply
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        id: terraform_apply
        working-directory: infra/terraform
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_shape: ${{ vars.OCI_RUNTIME_SHAPE || 'VM.Standard.E2.1.Micro' }}
          TF_VAR_runtime_ocpus: ${{ vars.OCI_RUNTIME_OCPUS || 1 }}
          TF_VAR_runtime_memory_gbs: ${{ vars.OCI_RUNTIME_MEMORY_GBS || 1 }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_create_autonomous_database: ${{ vars.OCI_CREATE_AUTONOMOUS_DATABASE || 'false' }}
          TF_VAR_autonomous_database_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_NAME || 'autographsdb' }}
          TF_VAR_autonomous_database_display_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_DISPLAY_NAME || 'autographs-prod-adb' }}
          TF_VAR_autonomous_database_is_mtls_connection_required: ${{ vars.OCI_AUTONOMOUS_DATABASE_IS_MTLS_CONNECTION_REQUIRED || 'true' }}
          TF_VAR_create_media_bucket: ${{ vars.OCI_CREATE_MEDIA_BUCKET || 'false' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_media_bucket_name: ${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_domain: ${{ vars.AUTOGRAPHS_DNS_DOMAIN || 'jetsaredim.net' }}
          TF_VAR_autographs_dns_subdomain: ${{ vars.AUTOGRAPHS_DNS_SUBDOMAIN || 'autographs' }}
          TF_VAR_autographs_dns_ttl: ${{ vars.AUTOGRAPHS_DNS_TTL || 600 }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && [ "${{ steps.request.outputs.operation }}" = "retry" ] \
            && [ "${{ inputs.recreate_runtime_instance }}" = "true" ]; then
            if terraform state list | grep -Fxq 'module.compute.oci_core_instance.runtime[0]'; then
              terraform taint 'module.compute.oci_core_instance.runtime[0]'
            else
              echo "Runtime instance is not in Terraform state; skipping taint."
            fi
          fi
          terraform apply -auto-approve
          runtime_secret_ids="$(terraform output -json runtime_secret_id_env_vars)"
          if ! jq -e '
            type == "object" and
            length == 3 and
            all(.[]; type == "string" and length > 0)
          ' <<< "$runtime_secret_ids" >/dev/null; then
            echo "::error::Terraform withheld the runtime Vault secret OCIDs. The Oracle database password is OCI-generated and must not be populated or overwritten out of band. Populate only the Oracle wallet password and admin password hash CURRENT values, then retry."
            exit 1
          fi
          admin_password_hash_vault_secret_id="$(jq -er '.AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_password_vault_secret_id="$(jq -er '.ORACLE_DB_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_wallet_password_vault_secret_id="$(jq -er '.ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          {
            echo "runtime_public_ip=$(terraform output -raw runtime_public_ip)"
            echo "admin_password_hash_vault_secret_id=${admin_password_hash_vault_secret_id}"
            echo "oracle_db_password_vault_secret_id=${oracle_db_password_vault_secret_id}"
            echo "oracle_db_wallet_password_vault_secret_id=${oracle_db_wallet_password_vault_secret_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Run full deployment
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          AUTOGRAPHS_OPERATOR_API_TOKEN: ${{ secrets.AUTOGRAPHS_OPERATOR_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.admin_password_hash_vault_secret_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          ORACLE_DB_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_password_vault_secret_id }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_wallet_password_vault_secret_id }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
        with:
          playbook: playbooks/deploy.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_controller_image=${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}:${{ steps.manifest.outputs.controller_tag }}
            --extra-vars autographs_deploy_controller_digest=${{ steps.manifest.outputs.controller_digest }}
            --extra-vars autographs_deploy_repo_version=${{ steps.request.outputs.release_tag }}
            --extra-vars autographs_deploy_deployed_controller_version=${{ steps.manifest.outputs.controller_tag }}
            --extra-vars autographs_deploy_source_revision=${{ steps.source.outputs.source_revision }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_deploy_http_port=${{ env.AUTOGRAPHS_HTTP_PORT }}
            --extra-vars autographs_deploy_https_port=${{ env.AUTOGRAPHS_HTTPS_PORT }}
            --extra-vars autographs_deploy_controller_db_provider=${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
            --extra-vars autographs_deploy_controller_media_storage_provider=${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
            --extra-vars autographs_oracle_heartbeat_interval_seconds=${{ env.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS }}
            --extra-vars oci_media_namespace=${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
            --extra-vars oci_media_bucket_name=${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
            --extra-vars autographs_deploy_ssh_ready_timeout_seconds=${{ vars.DEPLOY_SSH_READY_TIMEOUT_SECONDS || '900' }}
            --extra-vars autographs_deploy_ssh_ready_interval_seconds=${{ vars.DEPLOY_SSH_READY_INTERVAL_SECONDS || '10' }}

      - name: Verify deployment health
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        env:
          EXPECTED_DB_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
          EXPECTED_MEDIA_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
        run: |
          set -euo pipefail
          check_https_health() {
            local path="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if response="$(curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep 5
            done
            echo "Deployment did not pass ${label} check at ${path}." >&2
            return 1
          }
          check_https_health "/manifest.json" "static public release" >/dev/null
          controller_health="$(check_https_health "/admin/api/health" "controller")"
          jq -e \
            --arg db "$EXPECTED_DB_PROVIDER" \
            --arg media "$EXPECTED_MEDIA_PROVIDER" \
            '.controllerDbProvider == $db and .controllerMediaStorageProvider == $media' \
            <<< "$controller_health" >/dev/null

      - name: Recheck controller digest before rollback
        if: steps.request.outputs.operation == 'rollback'
        env:
          CONTROLLER_TAG: ${{ steps.rollback_manifest.outputs.controller_tag }}
          EXPECTED_DIGEST: ${{ steps.rollback_manifest.outputs.controller_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(docker buildx imagetools inspect \
            "${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          python3 scripts/release.py assert-digest \
            --expected "$EXPECTED_DIGEST" \
            --actual "$actual_digest"

      - name: Run controller-only rollback
        if: steps.request.outputs.operation == 'rollback'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          playbook: playbooks/controller-rollback.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.rollback_runtime.outputs.runtime_public_ip }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_rollback_controller_image=${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}:${{ steps.rollback_manifest.outputs.controller_tag }}
            --extra-vars autographs_rollback_controller_version=${{ steps.rollback_manifest.outputs.controller_tag }}
            --extra-vars autographs_rollback_controller_digest=${{ steps.rollback_manifest.outputs.controller_digest }}

      - name: Commit production release status
        env:
          CONTROLLER_TAG: ${{ steps.manifest.outputs.controller_tag || steps.rollback_manifest.outputs.controller_tag }}
          CONTROLLER_DIGEST: ${{ steps.manifest.outputs.controller_digest || steps.rollback_manifest.outputs.controller_digest }}
          OPERATION: ${{ steps.request.outputs.operation }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git switch --force-create production-status origin/main
            if [ "$OPERATION" = "rollback" ]; then
              python3 scripts/release.py rollback-status \
                --controller-tag "$CONTROLLER_TAG" \
                --controller-digest "$CONTROLLER_DIGEST" \
                --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              python3 scripts/release.py update-status \
                --manifest "$RUNNER_TEMP/release-assets/release-manifest.json" \
                --mode "$OPERATION" \
                --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fi
            git add .release-status.json
            if git diff --cached --quiet; then
              echo "Production release status already matches the verified state."
              break
            fi
            git commit -m "chore(release): record production ${RELEASE_TAG}"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to commit production release status after retries." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        if: steps.request.outputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
