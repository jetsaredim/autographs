name: Release and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - .release-status.json
  workflow_dispatch:
    inputs:
      operation:
        description: Retry or roll back a release, or plan/apply reviewed Cloudflare changes
        required: true
        default: retry
        type: choice
        options:
          - bootstrap_secrets
          - retry
          - rollback
          - cloudflare_plan
          - cloudflare_apply
      release_tag:
        description: Existing semantic GitHub Release tag (vX.Y.Z)
        required: false
        type: string
      expected_plan_sha:
        description: Reviewed Cloudflare plan fingerprint; required for cloudflare_apply
        required: false
        type: string
      recreate_runtime_instance:
        description: Recreate the runtime VM during a retry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}
  AUTOGRAPHS_HTTP_PORT: "80"
  AUTOGRAPHS_HTTPS_PORT: "443"
  AUTOGRAPHS_DOMAIN: ${{ vars.AUTOGRAPHS_DOMAIN || 'autographs.jetsaredim.net' }}
  AUTOGRAPHS_CONTROLLER_DB_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_DB_PROVIDER || 'oracle' }}
  AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER: ${{ vars.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER || 'oci-instance-principal' }}
  AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS: ${{ vars.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS || '86400' }}

jobs:
  release:
    name: Update Release PR or create draft Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate short-lived release token
        id: release_app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check unresolved draft releases
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[]' | jq -s . > "$RUNNER_TEMP/releases.json"
          set +e
          preflight="$(python3 scripts/release.py preflight-drafts \
            --releases-json "$RUNNER_TEMP/releases.json")"
          preflight_status=$?
          set -e
          if [ "$preflight_status" -eq 2 ]; then
            draft_tag="$(jq -er '.tags[0]' <<< "$preflight")"
            echo "Unresolved draft release ${draft_tag}; reconcile it before advancing release-please." >&2
            echo "gh workflow run deploy.yml --ref main -f operation=retry -f release_tag=${draft_tag}" >&2
            exit 1
          fi
          if [ "$preflight_status" -ne 0 ]; then
            exit "$preflight_status"
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release_app_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  production:
    name: Reconcile production release
    needs: release
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'push' &&
            needs.release.result == 'success' &&
            needs.release.outputs.release_created == 'true' &&
            needs.release.outputs.tag_name != ''
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            (inputs.operation == 'retry' || inputs.operation == 'rollback')
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Resolve release request
        id: request
        env:
          AUTOMATIC_TAG: ${{ needs.release.outputs.tag_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECREATE_RUNTIME_INSTANCE: ${{ inputs.recreate_runtime_instance }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production workflow_dispatch must run from refs/heads/main, got ${GITHUB_REF}." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            operation=automatic
            release_tag="$AUTOMATIC_TAG"
          else
            operation="$DISPATCH_OPERATION"
            release_tag="$DISPATCH_TAG"
          fi
          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match vX.Y.Z, got: ${release_tag}" >&2
            exit 1
          fi
          release_json="$(gh release view "$release_tag" --json isDraft,tagName)"
          if [ "$(jq -r '.tagName' <<< "$release_json")" != "$release_tag" ]; then
            echo "GitHub Release tag does not match ${release_tag}." >&2
            exit 1
          fi
          is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          if [ "$operation" = "rollback" ]; then
            if [ "$is_draft" != "false" ]; then
              echo "Controller rollback requires a published GitHub Release." >&2
              exit 1
            fi
            if [ "$RECREATE_RUNTIME_INSTANCE" = "true" ]; then
              echo "Runtime recreation is valid for retry only, not rollback." >&2
              exit 1
            fi
          elif [ "$is_draft" != "true" ]; then
            echo "Retry requires an unresolved draft release; ${release_tag} is already published." >&2
            exit 1
          fi
          {
            echo "operation=${operation}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout selected release tag
        if: steps.request.outputs.operation != 'rollback'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: ${{ steps.request.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout current Vault verification code
        if: steps.request.outputs.operation != 'rollback'
        uses: actions/checkout@v7
        with:
          ref: main
          path: .vault-automation
          sparse-checkout: scripts/sync_runtime_vault_secrets.py
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout dispatched main retry guard
        if: steps.request.outputs.operation == 'retry'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: ${{ github.sha }}
          path: .retry-automation
          sparse-checkout: |
            scripts/retry_recovery.py
            scripts/retry-recovery-contracts.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout current main for controller rollback
        if: steps.request.outputs.operation == 'rollback'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate selected release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main --tags
          source_revision="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          python3 scripts/release.py validate-target \
            --tag "$RELEASE_TAG" \
            --source-revision "$source_revision"
          echo "source_revision=${source_revision}" >> "$GITHUB_OUTPUT"
          git show origin/main:.release-status.json > "$RUNNER_TEMP/current-release-status.json"

      - name: Prepare retry recovery contract
        if: steps.request.outputs.operation == 'retry'
        id: retry_recovery
        env:
          AUTOMATION_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          audit="$asset_dir/retry-recovery-audit.json"
          attempt_asset="retry-recovery-attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          attempt="$asset_dir/$attempt_asset"
          mkdir -p "$asset_dir"
          python3 .retry-automation/scripts/retry_recovery.py \
            --repo . \
            --contract .retry-automation/scripts/retry-recovery-contracts.json \
            --release-tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --automation-revision "$AUTOMATION_REVISION" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$audit" \
            --attempt-output "$attempt"

          asset_count="$(gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[] | select(.name == "retry-recovery-audit.json")] | length')"
          if [ "$asset_count" -eq 1 ]; then
            existing_dir="$RUNNER_TEMP/existing-retry-recovery-audit"
            mkdir -p "$existing_dir"
            gh release download "$RELEASE_TAG" \
              --pattern retry-recovery-audit.json \
              --dir "$existing_dir"
            python3 scripts/release.py reconcile-asset \
              --generated "$audit" \
              --existing "$existing_dir/retry-recovery-audit.json" >/dev/null
          elif [ "$asset_count" -eq 0 ]; then
            gh release upload "$RELEASE_TAG" "$audit"
          else
            echo "Release contains multiple retry-recovery-audit.json assets." >&2
            exit 1
          fi

          attempt_count="$(gh release view "$RELEASE_TAG" --json assets \
            --jq "[.assets[] | select(.name == \"${attempt_asset}\")] | length")"
          if [ "$attempt_count" -eq 1 ]; then
            existing_attempt_dir="$RUNNER_TEMP/existing-retry-recovery-attempt"
            mkdir -p "$existing_attempt_dir"
            gh release download "$RELEASE_TAG" \
              --pattern "$attempt_asset" \
              --dir "$existing_attempt_dir"
            python3 scripts/release.py reconcile-asset \
              --generated "$attempt" \
              --existing "$existing_attempt_dir/$attempt_asset" >/dev/null
          elif [ "$attempt_count" -eq 0 ]; then
            gh release upload "$RELEASE_TAG" "$attempt"
          else
            echo "Release contains multiple ${attempt_asset} assets." >&2
            exit 1
          fi
          {
            echo "verified=true"
            echo "recovery_revision=$(jq -er '.recoveryRevision' "$audit")"
            echo "attempt_asset=${attempt_asset}"
          } >> "$GITHUB_OUTPUT"

      - name: Load published rollback manifest
        if: steps.request.outputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release-assets"
          python3 scripts/release.py validate-manifest \
            --manifest "$RUNNER_TEMP/release-assets/release-manifest.json" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

      - name: Load retry manifest when present
        if: steps.request.outputs.operation == 'retry'
        id: retry_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          # The REST release-by-tag endpoint returns 404 for draft releases.
          asset_count="$(gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[] | select(.name == "release-manifest.json")] | length')"
          if [ "$asset_count" -eq 1 ]; then
            gh release download "$RELEASE_TAG" \
              --pattern release-manifest.json \
              --dir "$RUNNER_TEMP/release-assets"
            python3 scripts/release.py validate-manifest \
              --manifest "$RUNNER_TEMP/release-assets/release-manifest.json" \
              --tag "$RELEASE_TAG" \
              --source-revision "$SOURCE_REVISION"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$asset_count" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release contains multiple release-manifest.json assets." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.request.outputs.operation != 'rollback'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ghcr.io for rollback inspection
        if: steps.request.outputs.operation == 'rollback'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve controller image plan
        if: steps.request.outputs.operation != 'rollback'
        id: image_plan
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          RETRY_MANIFEST_FOUND: ${{ steps.retry_manifest.outputs.found || 'false' }}
        run: |
          set -euo pipefail
          probe_controller_image() {
            local image="$1"
            local inspect_error="$RUNNER_TEMP/controller-image-inspect-error.txt"
            if docker buildx imagetools inspect "$image" >/dev/null 2>"$inspect_error"; then
              return 0
            fi
            if grep -Eiq '(manifest unknown|not found|404)' "$inspect_error"; then
              return 1
            fi
            echo "Unable to determine whether controller image ${image} exists:" >&2
            sed 's/^/  /' "$inspect_error" >&2
            return 2
          }

          manifest="$RUNNER_TEMP/release-assets/release-manifest.json"
          if [ "$RETRY_MANIFEST_FOUND" = "true" ]; then
            controller_tag="$(jq -er '.controller.tag' "$manifest")"
            controller_digest="$(jq -er '.controller.digest' "$manifest")"
            controller_changed="$(jq -r '.controllerChanged' "$manifest")"
            if [ "$controller_changed" = "false" ]; then
              python3 scripts/release.py validate-reused-controller \
                --manifest "$manifest" \
                --status-file "$RUNNER_TEMP/current-release-status.json"
            fi
            image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${controller_tag}"
            if probe_controller_image "$image"; then
              :
            else
              probe_status=$?
              if [ "$probe_status" -eq 1 ]; then
                echo "Manifest-recorded controller image does not exist: ${image}" >&2
              fi
              exit "$probe_status"
            fi
            if [ "$controller_changed" = "true" ]; then
              image_revision="$(docker buildx imagetools inspect "$image" \
                --format '{{json .Image.Config.Labels}}' \
                | jq -er '.["org.opencontainers.image.revision"]')"
              if [ "$image_revision" != "$SOURCE_REVISION" ]; then
                echo "Existing release image revision ${image_revision} does not match ${SOURCE_REVISION}." >&2
                exit 1
              fi
            fi
            {
              echo "build_required=false"
              echo "controller_tag=${controller_tag}"
              echo "controller_digest=${controller_digest}"
              echo "manifest_authoritative=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag="$(python3 scripts/release.py previous-release --tag "$RELEASE_TAG")"
          classify_args=(--tag "$RELEASE_TAG")
          if [ -n "$previous_tag" ]; then
            classify_args+=(--previous-tag "$previous_tag")
          fi
          classification="$(python3 scripts/release.py classify-range "${classify_args[@]}")"
          controller_changed="$(jq -r '.controllerChanged' <<< "$classification")"
          if [ "$controller_changed" = "true" ]; then
            controller_tag="$RELEASE_TAG"
          else
            controller_tag="$(jq -er '.deployedControllerVersion' "$RUNNER_TEMP/current-release-status.json")"
          fi
          image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${controller_tag}"
          image_exists=false
          if probe_controller_image "$image"; then
            image_exists=true
          else
            probe_status=$?
            if [ "$probe_status" -ne 1 ]; then
              exit "$probe_status"
            fi
          fi
          build_required=false
          if [ "$controller_changed" = "true" ]; then
            if [ "$image_exists" = "true" ]; then
              if [ "$OPERATION" != "retry" ]; then
                echo "Controller release tag ${image} already exists and will not be overwritten." >&2
                exit 1
              fi
              image_revision="$(docker buildx imagetools inspect "$image" \
                --format '{{json .Image.Config.Labels}}' \
                | jq -er '.["org.opencontainers.image.revision"]')"
              if [ "$image_revision" != "$SOURCE_REVISION" ]; then
                echo "Existing release image revision ${image_revision} does not match ${SOURCE_REVISION}." >&2
                exit 1
              fi
            else
              build_required=true
            fi
          elif [ "$image_exists" != "true" ]; then
            echo "Active controller image required for reuse does not exist: ${image}" >&2
            exit 1
          fi
          {
            echo "build_required=${build_required}"
            echo "controller_tag=${controller_tag}"
            echo "manifest_authoritative=false"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish semantic controller image
        if: steps.image_plan.outputs.build_required == 'true'
        uses: docker/bake-action@v7
        env:
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        with:
          files: |
            .github/docker-bake.hcl
          push: true
          provenance: false

      - name: Reconcile release manifest
        if: steps.request.outputs.operation != 'rollback'
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_AUTHORITATIVE: ${{ steps.image_plan.outputs.manifest_authoritative }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          CONTROLLER_TAG: ${{ steps.image_plan.outputs.controller_tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          manifest="$asset_dir/release-manifest.json"
          mkdir -p "$asset_dir"
          if [ "$MANIFEST_AUTHORITATIVE" = "true" ]; then
            python3 scripts/release.py reconcile-asset \
              --generated "$manifest" \
              --existing "$manifest" >/dev/null
          else
            image="${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}"
            controller_digest="$(docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            python3 scripts/release.py plan \
              --tag "$RELEASE_TAG" \
              --source-revision "$SOURCE_REVISION" \
              --status-file "$RUNNER_TEMP/current-release-status.json" \
              --controller-digest "$controller_digest" \
              --output "$RUNNER_TEMP/release-plan.json"
            generated="$RUNNER_TEMP/generated-release-manifest.json"
            python3 scripts/release.py manifest \
              --plan-json "$RUNNER_TEMP/release-plan.json" \
              --output "$generated"
            existing_args=()
            # The REST release-by-tag endpoint returns 404 for draft releases.
            asset_count="$(gh release view "$RELEASE_TAG" --json assets \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')"
            if [ "$asset_count" -eq 1 ]; then
              gh release download "$RELEASE_TAG" \
                --pattern release-manifest.json \
                --dir "$asset_dir"
              existing_args+=(--existing "$manifest")
            elif [ "$asset_count" -ne 0 ]; then
              echo "Release contains multiple release-manifest.json assets." >&2
              exit 1
            fi
            reconciliation="$(python3 scripts/release.py reconcile-asset \
              --generated "$generated" "${existing_args[@]}")"
            if [ "$reconciliation" = "create" ]; then
              cp "$generated" "$manifest"
              gh release upload "$RELEASE_TAG" "$manifest"
            fi
          fi
          python3 scripts/release.py validate-manifest \
            --manifest "$manifest" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          if ! production_mutation_required="$(jq -r '.impact != "repo-only"' "$manifest")"; then
            echo "Unable to classify the release manifest deployment impact." >&2
            exit 1
          fi
          case "$production_mutation_required" in
            true|false) ;;
            *)
              echo "Release manifest deployment impact must resolve to true or false." >&2
              exit 1
              ;;
          esac
          {
            echo "impact=$(jq -er '.impact' "$manifest")"
            echo "production_mutation_required=${production_mutation_required}"
            echo "controller_tag=$(jq -er '.controller.tag' "$manifest")"
            echo "controller_digest=$(jq -er '.controller.digest' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Select rollback controller from published manifest
        if: steps.request.outputs.operation == 'rollback'
        id: rollback_manifest
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-assets/release-manifest.json"
          {
            echo "controller_tag=$(jq -er '.controller.tag' "$manifest")"
            echo "controller_digest=$(jq -er '.controller.digest' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Select OCI CLI Python version
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OCI CLI for Vault verification
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check 'oci-cli==3.96.2'

      - name: Write OCI API private key
        if: steps.manifest.outputs.production_mutation_required == 'true' || steps.request.outputs.operation == 'rollback'
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Configure OCI CLI for Vault verification
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          set -euo pipefail
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER_OCID"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci/api_key.pem"
            printf 'region=us-ashburn-1\n'
          } > "$RUNNER_TEMP/oci/config"
          chmod 600 "$RUNNER_TEMP/oci/config"

      - name: Resolve runtime VM IP for rollback
        if: steps.request.outputs.operation == 'rollback'
        id: rollback_runtime
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-private-key-pem: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          oci-cli-user-ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          vm-public-ip: ${{ vars.VM_PUBLIC_IP }}

      - name: Recheck controller digest before full deployment
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        env:
          CONTROLLER_TAG: ${{ steps.manifest.outputs.controller_tag }}
          EXPECTED_DIGEST: ${{ steps.manifest.outputs.controller_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(docker buildx imagetools inspect \
            "${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          python3 scripts/release.py assert-digest \
            --expected "$EXPECTED_DIGEST" \
            --actual "$actual_digest"

      - name: Terraform apply
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        id: terraform_apply
        working-directory: infra/terraform
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
          TF_VAR_cloudflare_mode: ${{ vars.CLOUDFLARE_MODE || 'off' }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$TF_VAR_cloudflare_mode" != "off" ]; then
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "::error::Set the CLOUDFLARE_API_TOKEN secret before using a Cloudflare mode."
              exit 1
            fi
          fi
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          python3 "$GITHUB_WORKSPACE/.vault-automation/scripts/sync_runtime_vault_secrets.py" verify \
            --oci-bin "$RUNNER_TEMP/oci-cli/bin/oci" \
            --oci-config-file "$RUNNER_TEMP/oci/config"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && [ "${{ steps.request.outputs.operation }}" = "retry" ] \
            && [ "${{ inputs.recreate_runtime_instance }}" = "true" ]; then
            runtime_state_address=""
            for address in \
              'module.compute.oci_core_instance.runtime' \
              'module.compute.oci_core_instance.runtime[0]'; do
              if terraform state list | grep -Fxq "$address"; then
                runtime_state_address="$address"
                break
              fi
            done
            if [ -n "$runtime_state_address" ]; then
              terraform taint -lock-timeout=10m "$runtime_state_address"
            else
              echo "Runtime instance is not in Terraform state; skipping taint."
            fi
          fi
          terraform_plan_file="$RUNNER_TEMP/runtime.tfplan"
          terraform plan -input=false -lock-timeout=10m -out="$terraform_plan_file"
          terraform show -json "$terraform_plan_file" | jq -e '
            [ .resource_changes[]?
              | select(.address | test("^(cloudflare_|porkbun_dns_record\\.)"))
              | select(.change.actions != ["no-op"])
            ] | length == 0
          ' >/dev/null || {
            echo "::error::Routine deploy cannot change Cloudflare or Porkbun DNS resources. Review and apply the DNS plan through the controlled operator procedure."
            exit 1
          }
          terraform apply -input=false -lock-timeout=10m "$terraform_plan_file"
          rotation_plan_file="$RUNNER_TEMP/runtime-rotation.tfplan"
          terraform plan -input=false -lock-timeout=10m -out="$rotation_plan_file"
          terraform show -json "$rotation_plan_file" | jq -e \
            --arg adb_id "$(terraform output -raw autonomous_database_id)" '
            all(.resource_changes[]?;
              .mode != "managed" or
              .change.actions == ["no-op"] or
              (
                .address == "oci_vault_secret.runtime[\"oracle_db_password\"]" and
                .change.actions == ["update"] and
                ((.change.before.rotation_config // []) | length) == 0 and
                .change.after.rotation_config[0].target_system_details[0].adb_id == $adb_id and
                .change.after.rotation_config[0].is_scheduled_rotation_enabled == true and
                .change.after.rotation_config[0].rotation_interval == "P90D"
              )
            )
          ' >/dev/null || {
            echo "::error::Post-ADB plan contains changes beyond attaching the expected database password rotation target."
            exit 1
          }
          terraform apply -input=false -lock-timeout=10m "$rotation_plan_file"
          runtime_secret_ids="$(terraform output -json runtime_secret_id_env_vars)"
          if ! jq -e '
            type == "object" and
            length == 3 and
            all(.[]; type == "string" and length > 0)
          ' <<< "$runtime_secret_ids" >/dev/null; then
            echo "::error::Terraform withheld the runtime Vault secret OCIDs; verify the GitHub/Vault values and retry."
            exit 1
          fi
          admin_password_hash_vault_secret_id="$(jq -er '.AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_password_vault_secret_id="$(jq -er '.ORACLE_DB_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          oracle_db_wallet_password_vault_secret_id="$(jq -er '.ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID' <<< "$runtime_secret_ids")"
          {
            echo "runtime_public_ip=$(terraform output -raw runtime_public_ip)"
            echo "autonomous_database_name=$(terraform output -raw autonomous_database_name)"
            echo "media_bucket_name=$(terraform output -raw media_bucket_name)"
            echo "admin_password_hash_vault_secret_id=${admin_password_hash_vault_secret_id}"
            echo "oracle_db_password_vault_secret_id=${oracle_db_password_vault_secret_id}"
            echo "oracle_db_wallet_password_vault_secret_id=${oracle_db_wallet_password_vault_secret_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Freeze and verify publisher cutover preflight
        id: publish_freeze_preflight
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ format('{0}/deploy/ansible/ansible.cfg', github.workspace) }}
        with:
          playbook: playbooks/publish-freeze-preflight.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_deploy_repo_version=${{ steps.request.outputs.release_tag }}
            --extra-vars autographs_deploy_controller_digest=${{ steps.manifest.outputs.controller_digest }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}

      - name: Run full deployment
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true' && steps.publish_freeze_preflight.outcome == 'success'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ format('{0}/deploy/ansible/ansible.cfg', github.workspace) }}
          AUTOGRAPHS_OPERATOR_API_TOKEN: ${{ secrets.AUTOGRAPHS_OPERATOR_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.admin_password_hash_vault_secret_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ORACLE_DB_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_password_vault_secret_id }}
          ORACLE_DB_WALLET_PASSWORD_VAULT_SECRET_ID: ${{ steps.terraform_apply.outputs.oracle_db_wallet_password_vault_secret_id }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
        with:
          playbook: playbooks/deploy.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_controller_image=${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}:${{ steps.manifest.outputs.controller_tag }}
            --extra-vars autographs_deploy_controller_digest=${{ steps.manifest.outputs.controller_digest }}
            --extra-vars autographs_deploy_repo_version=${{ steps.request.outputs.release_tag }}
            --extra-vars autographs_deploy_deployed_controller_version=${{ steps.manifest.outputs.controller_tag }}
            --extra-vars autographs_deploy_source_revision=${{ steps.source.outputs.source_revision }}
            --extra-vars autographs_deploy_publish_frozen=true
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_deploy_http_port=${{ env.AUTOGRAPHS_HTTP_PORT }}
            --extra-vars autographs_deploy_https_port=${{ env.AUTOGRAPHS_HTTPS_PORT }}
            --extra-vars autographs_deploy_controller_db_provider=${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
            --extra-vars autographs_deploy_controller_media_storage_provider=${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
            --extra-vars autographs_oracle_heartbeat_interval_seconds=${{ env.AUTOGRAPHS_ORACLE_HEARTBEAT_INTERVAL_SECONDS }}
            --extra-vars oracle_db_connect_string=${{ steps.terraform_apply.outputs.autonomous_database_name }}_medium
            --extra-vars oci_media_namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
            --extra-vars oci_media_bucket_name=${{ steps.terraform_apply.outputs.media_bucket_name }}
            --extra-vars autographs_deploy_ssh_ready_timeout_seconds=${{ vars.DEPLOY_SSH_READY_TIMEOUT_SECONDS || '900' }}
            --extra-vars autographs_deploy_ssh_ready_interval_seconds=${{ vars.DEPLOY_SSH_READY_INTERVAL_SECONDS || '10' }}

      - name: Verify deployment health
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true'
        id: deployment_health
        env:
          EXPECTED_DB_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_DB_PROVIDER }}
          EXPECTED_MEDIA_PROVIDER: ${{ env.AUTOGRAPHS_CONTROLLER_MEDIA_STORAGE_PROVIDER }}
          EXPECTED_REPO_VERSION: ${{ steps.request.outputs.release_tag }}
          EXPECTED_CONTROLLER_VERSION: ${{ steps.manifest.outputs.controller_tag }}
          EXPECTED_SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        run: |
          set -euo pipefail
          check_https_health() {
            local path="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if response="$(curl --fail --silent "https://${AUTOGRAPHS_DOMAIN}${path}")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep 5
            done
            echo "Deployment did not pass ${label} check at ${path}." >&2
            return 1
          }
          check_https_health "/manifest.json" "static public release" >/dev/null
          controller_health="$(check_https_health "/admin/api/health" "controller")"
          jq -e \
            --arg db "$EXPECTED_DB_PROVIDER" \
            --arg media "$EXPECTED_MEDIA_PROVIDER" \
            --arg repo "$EXPECTED_REPO_VERSION" \
            --arg controller "$EXPECTED_CONTROLLER_VERSION" \
            --arg source "$EXPECTED_SOURCE_REVISION" \
            '.controllerDbProvider == $db
              and .controllerMediaStorageProvider == $media
              and .release.repoVersion == $repo
              and .release.controllerVersion == $controller
              and .release.sourceRevision == $source' \
            <<< "$controller_health" >/dev/null
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Verify frozen origin readiness
        id: frozen_origin_readiness
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true' && steps.deployment_health.outputs.verified == 'true'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ format('{0}/deploy/ansible/ansible.cfg', github.workspace) }}
        with:
          playbook: playbooks/publish-unfreeze.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_deploy_repo_version=${{ steps.request.outputs.release_tag }}
            --extra-vars autographs_deploy_controller_digest=${{ steps.manifest.outputs.controller_digest }}
            --extra-vars autographs_deploy_source_revision=${{ steps.source.outputs.source_revision }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_publish_unfreeze_verify_only=true

      - name: Explicitly unfreeze verified production publication
        id: publish_unfreeze
        if: steps.request.outputs.operation != 'rollback' && steps.manifest.outputs.production_mutation_required == 'true' && steps.deployment_health.outputs.verified == 'true' && steps.frozen_origin_readiness.outcome == 'success'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ format('{0}/deploy/ansible/ansible.cfg', github.workspace) }}
        with:
          playbook: playbooks/publish-unfreeze.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.terraform_apply.outputs.runtime_public_ip || vars.VM_PUBLIC_IP }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_deploy_repo_version=${{ steps.request.outputs.release_tag }}
            --extra-vars autographs_deploy_controller_digest=${{ steps.manifest.outputs.controller_digest }}
            --extra-vars autographs_deploy_source_revision=${{ steps.source.outputs.source_revision }}
            --extra-vars autographs_deploy_domain=${{ env.AUTOGRAPHS_DOMAIN }}
            --extra-vars autographs_publish_unfreeze_verify_only=false

      - name: Validate release completion gate
        if: steps.request.outputs.operation != 'rollback'
        id: release_gate
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          PRODUCTION_MUTATION_REQUIRED: ${{ steps.manifest.outputs.production_mutation_required }}
          DEPLOYMENT_VERIFIED: ${{ steps.deployment_health.outputs.verified }}
          PUBLISH_UNFREEZE_OUTCOME: ${{ steps.publish_unfreeze.outcome }}
          RETRY_RECOVERY_VERIFIED: ${{ steps.retry_recovery.outputs.verified }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "retry" ] && [ "$RETRY_RECOVERY_VERIFIED" != "true" ]; then
            echo "Retry completion requires a verified recovery audit." >&2
            exit 1
          fi
          case "$PRODUCTION_MUTATION_REQUIRED" in
            true)
              if [ "$DEPLOYMENT_VERIFIED" != "true" ]; then
                echo "Release requires production mutation but deployment health was not verified." >&2
                exit 1
              fi
              if [ "$PUBLISH_UNFREEZE_OUTCOME" != "success" ]; then
                echo "Release requires explicit verified publication unfreeze." >&2
                exit 1
              fi
              ;;
            false) ;;
            *)
              echo "Release completion requires an explicit true or false mutation classification." >&2
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Recheck controller digest before rollback
        if: steps.request.outputs.operation == 'rollback'
        env:
          CONTROLLER_TAG: ${{ steps.rollback_manifest.outputs.controller_tag }}
          EXPECTED_DIGEST: ${{ steps.rollback_manifest.outputs.controller_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(docker buildx imagetools inspect \
            "${GHCR_CONTROLLER_IMAGE_REPOSITORY}:${CONTROLLER_TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          python3 scripts/release.py assert-digest \
            --expected "$EXPECTED_DIGEST" \
            --actual "$actual_digest"

      - name: Run controller-only rollback
        if: steps.request.outputs.operation == 'rollback'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          playbook: playbooks/controller-rollback.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ steps.rollback_runtime.outputs.runtime_public_ip }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_rollback_controller_image=${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}:${{ steps.rollback_manifest.outputs.controller_tag }}
            --extra-vars autographs_rollback_controller_version=${{ steps.rollback_manifest.outputs.controller_tag }}
            --extra-vars autographs_rollback_controller_digest=${{ steps.rollback_manifest.outputs.controller_digest }}

      - name: Checkout current main for production status
        if: steps.request.outputs.operation == 'rollback' || steps.release_gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          ref: main
          path: .production-status
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout trusted production status tooling
        if: steps.request.outputs.operation == 'rollback' || steps.release_gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: "1"
          ref: ${{ github.sha }}
          path: .status-automation
          sparse-checkout: scripts/release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Commit production release status
        if: steps.request.outputs.operation == 'rollback' || steps.release_gate.outputs.ready == 'true'
        working-directory: .production-status
        env:
          CONTROLLER_TAG: ${{ steps.manifest.outputs.controller_tag || steps.rollback_manifest.outputs.controller_tag }}
          CONTROLLER_DIGEST: ${{ steps.manifest.outputs.controller_digest || steps.rollback_manifest.outputs.controller_digest }}
          OPERATION: ${{ steps.request.outputs.operation }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git switch --force-create production-status origin/main
            if [ "$OPERATION" = "rollback" ]; then
              python3 "$GITHUB_WORKSPACE/.status-automation/scripts/release.py" rollback-status \
                --controller-tag "$CONTROLLER_TAG" \
                --controller-digest "$CONTROLLER_DIGEST" \
                --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              update_args=(
                --manifest "$RUNNER_TEMP/release-assets/release-manifest.json"
                --mode "$OPERATION"
                --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              )
              if [ "$OPERATION" = "retry" ]; then
                update_args+=(
                  --retry-recovery-audit "$RUNNER_TEMP/release-assets/retry-recovery-audit.json"
                )
              fi
              python3 "$GITHUB_WORKSPACE/.status-automation/scripts/release.py" update-status "${update_args[@]}"
            fi
            git add .release-status.json
            if git diff --cached --quiet; then
              echo "Production release status already matches the verified state."
              break
            fi
            git commit -m "chore(release): record production ${RELEASE_TAG}"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to commit production release status after retries." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        if: steps.request.outputs.operation != 'rollback' && steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  cloudflare:
    name: Plan or apply reviewed Cloudflare changes
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'cloudflare_plan' || inputs.operation == 'cloudflare_apply') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Plan or apply reviewed Cloudflare changes
        working-directory: infra/terraform
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_PLAN_SHA: ${{ inputs.expected_plan_sha }}
          CLOUDFLARE_ZONE_ID: 52477e17b9f51fea6920515dead94e07
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
          TF_VAR_cloudflare_mode: ${{ vars.CLOUDFLARE_MODE }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          case "$OPERATION" in
            cloudflare_plan|cloudflare_apply) ;;
            *) echo "::error::Unsupported Cloudflare operation."; exit 1 ;;
          esac
          if [ "$TF_VAR_cloudflare_mode" != proxied ] && [ "$TF_VAR_cloudflare_mode" != dns_only ]; then
            echo "::error::Cloudflare mode must be proxied or dns_only for operator changes."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare token and account ID are required."
            exit 1
          fi
          if [ "$OPERATION" = cloudflare_apply ] && ! [[ "$EXPECTED_PLAN_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Apply requires the 64-character fingerprint from a reviewed plan run."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID" \
            > "$RUNNER_TEMP/cloudflare-zone.json"
          jq -e --arg zone "$CLOUDFLARE_ZONE_ID" --arg account "$CLOUDFLARE_ACCOUNT_ID" '
            .success == true and .result.id == $zone and
            .result.name == "jetsaredim.net" and .result.account.id == $account and
            .result.type == "full" and .result.status == "active"
          ' "$RUNNER_TEMP/cloudflare-zone.json" >/dev/null || {
            echo "::error::The active Cloudflare zone does not match the reviewed account and zone."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          for address in \
            'cloudflare_zone.domain[0]' \
            'cloudflare_dns_record.autographs[0]' \
            'cloudflare_dns_record.mail[0]' \
            'cloudflare_dns_record.spf[0]' \
            'cloudflare_zone_setting.strict_tls[0]' \
            'cloudflare_ruleset.autographs_cache[0]'; do
            if ! terraform state list | grep -Fxq "$address"; then
              echo "::error::Required Cloudflare state address $address is missing. Stop for state review."
              exit 1
            fi
          done
          terraform state pull | jq -e --arg zone "$CLOUDFLARE_ZONE_ID" '
            [.resources[] | select(.module == null and .mode == "managed" and
              .type == "cloudflare_zone" and .name == "domain") |
              .instances[] | select(.index_key == 0) | .attributes.id] == [$zone]
          ' >/dev/null || {
            echo "::error::The Terraform zone state does not match the reviewed Cloudflare zone."
            exit 1
          }
          plan_file="$RUNNER_TEMP/cloudflare-terraform.tfplan"
          plan_json="$RUNNER_TEMP/cloudflare-terraform-plan.json"
          terraform plan -input=false -lock-timeout=10m -out="$plan_file"
          terraform show -json "$plan_file" > "$plan_json"
          jq -e '
            [.resource_changes[]? | select(.change.actions != ["no-op"])] |
            all(.[]; .mode == "managed" and (.address | startswith("cloudflare_")))
          ' "$plan_json" >/dev/null || {
            echo "::error::Plan includes a change outside Cloudflare-managed resources. No apply ran."
            exit 1
          }
          jq -r '
            .resource_changes[]? | select(.change.actions != ["no-op"]) |
            "\(.address): \(.change.actions | join(","))"
          ' "$plan_json"
          change_count="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' "$plan_json")"
          plan_sha="$(jq -cS '
            [.resource_changes[]? | select(.change.actions != ["no-op"])] | sort
          ' "$plan_json" | sha256sum | cut -d' ' -f1)"
          echo "Cloudflare change count: $change_count"
          echo "Cloudflare plan fingerprint: $plan_sha"
          if [ "$OPERATION" = cloudflare_apply ]; then
            if [ "$change_count" -eq 0 ] || [ "$plan_sha" != "$EXPECTED_PLAN_SHA" ]; then
              echo "::error::The current plan does not match the reviewed nonempty plan fingerprint. No apply ran."
              exit 1
            fi
            terraform apply -input=false -lock-timeout=10m "$plan_file"
            echo "Applied the exact saved Cloudflare plan with the reviewed fingerprint."
          else
            echo "Plan only: no Terraform apply was run."
          fi

  bootstrap_secrets:
    name: Populate initial runtime Vault secrets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap_secrets' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: secret-audit
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Require both GitHub source secrets
        env:
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOGRAPHS_ADMIN_PASSWORD_HASH" ] || [ -z "$ORACLE_DB_WALLET_PASSWORD" ]; then
            echo "::error::Both manual runtime values must be configured as GitHub Secrets before bootstrap."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Select OCI CLI Python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OCI CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check 'oci-cli==3.96.2'

      - name: Configure OCI API authentication
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 0600 "$RUNNER_TEMP/oci/api_key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER_OCID"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci/api_key.pem"
            printf 'region=us-ashburn-1\n'
          } > "$RUNNER_TEMP/oci/config"
          chmod 0600 "$RUNNER_TEMP/oci/config"

      - name: Create Vault resources and populate only untouched placeholders
        working-directory: infra/terraform
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_bootstrap_runtime_secrets: 'true'
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_cloudflare_mode: ${{ vars.CLOUDFLARE_MODE || 'off' }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          bootstrap_plan="$RUNNER_TEMP/runtime-vault-bootstrap.tfplan"
          terraform plan -input=false -lock-timeout=10m \
            -target=oci_vault_secret.runtime -out="$bootstrap_plan"
          terraform show -json "$bootstrap_plan" | jq -e '
            ([.prior_state.values.root_module.child_modules[]?.resources[]?
              | select(.type == "oci_database_autonomous_database")] | length) == 0 and
            ([.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"])] |
              all(.[];
                .change.actions == ["create"] and
                (.address == "oci_kms_vault.runtime_secrets" or
                 .address == "oci_kms_key.runtime_secrets" or
                 (.address | startswith("oci_vault_secret.runtime[")))))
          ' >/dev/null || {
            echo "::error::Bootstrap plan is not limited to new Vault resources, or ADB already exists in state. No apply ran."
            exit 1
          }
          terraform apply -input=false -lock-timeout=10m "$bootstrap_plan"
          python3 ../../scripts/sync_runtime_vault_secrets.py bootstrap \
            --oci-bin "$RUNNER_TEMP/oci-cli/bin/oci" \
            --oci-config-file "$RUNNER_TEMP/oci/config"
