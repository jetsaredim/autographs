name: Complete frozen v0.5.0 release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Complete the frozen release, or finish GitHub bookkeeping after a verified unfreeze
        required: true
        default: complete
        type: choice
        options: [complete, finalize]
      unfreeze_run_id:
        description: Prior run ID whose unfreeze step succeeded (finalize only)
        required: false
        type: string
      unfreeze_run_attempt:
        description: Prior run attempt number (finalize only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  complete:
    name: Verify, unfreeze, and publish v0.5.0
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.5.0
      SOURCE_REVISION: 13d8df0c1e83ebaebba03c32c45158dd10f3942f
      RUNTIME_IP: 129.213.166.159
      AUTOGRAPHS_DOMAIN: autographs.jetsaredim.net
      ASSET_DIR: /tmp/autographs-v0.5.0-assets
      OPERATION: ${{ inputs.operation }}
      UNFREEZE_RUN_ID: ${{ inputs.unfreeze_run_id }}
      UNFREEZE_RUN_ATTEMPT: ${{ inputs.unfreeze_run_attempt }}

    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = refs/heads/main

      - name: Checkout reviewed completion source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable release inputs and exact playbook correction
        id: inputs
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          test "$(git rev-parse 'refs/tags/v0.5.0^{commit}')" = "$SOURCE_REVISION"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --pattern release-manifest.json --dir "$ASSET_DIR"
          gh release download "$RELEASE_TAG" --pattern retry-recovery-audit.json --dir "$ASSET_DIR"
          if [ "$OPERATION" = finalize ]; then
            [[ "$UNFREEZE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$UNFREEZE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            prior_step="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UNFREEZE_RUN_ID}/attempts/${UNFREEZE_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Verify, unfreeze, and publish v0.5.0") | .steps[] | select(.name == "Explicitly unfreeze verified v0.5.0 publication") | .conclusion')"
            test "$prior_step" = success
            prior_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UNFREEZE_RUN_ID}/attempts/${UNFREEZE_RUN_ATTEMPT}")"
            jq -e --argjson attempt "$UNFREEZE_RUN_ATTEMPT" \
              '.event == "workflow_dispatch" and .head_branch == "main" and
               .path == ".github/workflows/complete-v0.5.0.yml" and .run_attempt == $attempt' \
              <<< "$prior_run" >/dev/null
            gh release download "$RELEASE_TAG" \
              --pattern "completion-attempt-${UNFREEZE_RUN_ID}-${UNFREEZE_RUN_ATTEMPT}.json" \
              --dir "$ASSET_DIR"
            jq -e --arg sha "$(jq -er .head_sha <<< "$prior_run")" \
              '.automationRevision == $sha' \
              "$ASSET_DIR/completion-attempt-${UNFREEZE_RUN_ID}-${UNFREEZE_RUN_ATTEMPT}.json" >/dev/null
          fi
          python3 scripts/release.py validate-manifest \
            --manifest "$ASSET_DIR/release-manifest.json" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["ASSET_DIR"])
          source = os.environ["SOURCE_REVISION"]
          audit_path = root / "retry-recovery-audit.json"
          audit = json.loads(audit_path.read_text())
          assert audit == {
              "schemaVersion": 1,
              "releaseTag": "v0.5.0",
              "releaseSourceRevision": source,
              "recoveryApplied": False,
              "recoveryRevision": source,
              "approvedFiles": [],
          }, "the existing retry audit is not the expected immutable tag-only record"
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert manifest["repositoryVersion"] == "v0.5.0"
          assert manifest["sourceRevision"] == source
          assert manifest["impact"] != "repo-only"
          path = "deploy/ansible/playbooks/publish-unfreeze.yml"
          tagged = subprocess.check_output(["git", "show", f"{source}:{path}"])
          reviewed = pathlib.Path(path).read_bytes()
          before = b"(unfreeze_manifest.stdout | from_json).release_id is defined"
          after = b"(unfreeze_manifest.stdout | from_json).releaseId is defined"
          assert tagged.count(before) == 1, "tagged assertion differs from expected source"
          digest = lambda value: "sha256:" + hashlib.sha256(value).hexdigest()
          old_start = b"    - name: Require operator token for authenticated status proof\n"
          new_start = b"    - name: Verify publish status requires an admin session\n"
          end = b"    - name: Probe public current and frozen publish routes\n"
          assert tagged.count(old_start) == 1 and reviewed.count(new_start) == 1
          assert tagged.count(end) == 1 and reviewed.count(end) == 1
          old_prefix, old_rest = tagged.split(old_start, 1)
          old_body, old_suffix = old_rest.split(end, 1)
          new_prefix, new_rest = reviewed.split(new_start, 1)
          new_body, new_suffix = new_rest.split(end, 1)
          assert old_prefix.replace(before, after) == new_prefix
          assert digest(old_start + old_body) == "sha256:339cd6e54fa2baa176d15251b1bdb05b85d21f584f69505f8582663d15ec2a1a"
          assert digest(new_start + new_body) == "sha256:1f93a34b20f8c0a904f8067e07f13b763b09228c83ab54f762a07215eadcd5fc"
          old_post_start = b"        - name: Verify authenticated status after unfreeze\n"
          new_post_start = b"        - name: Verify publish status requires an admin session after unfreeze\n"
          post_end = b"        - name: Verify selected origin and exact marker denial after Caddy restart\n"
          assert old_suffix.count(old_post_start) == 1 and new_suffix.count(new_post_start) == 1
          assert old_suffix.count(post_end) == 1 and new_suffix.count(post_end) == 1
          old_middle, old_post_rest = old_suffix.split(old_post_start, 1)
          old_post_body, old_trailing = old_post_rest.split(post_end, 1)
          new_middle, new_post_rest = new_suffix.split(new_post_start, 1)
          new_post_body, new_trailing = new_post_rest.split(post_end, 1)
          assert old_middle == new_middle and old_trailing == new_trailing
          assert digest(old_post_start + old_post_body) == "sha256:2ffecc27042dacfcfed1d11ebe3fef592bbfdcb757275fa7d1d41a363b0ee665"
          assert digest(new_post_start + new_post_body) == "sha256:5e01e6524801f14564557eef7611711226db641ff5db741282f3ad121d88e7f6"
          attempt = {
              "schemaVersion": 1,
              "action": "complete-frozen-v0.5.0",
              "releaseTag": "v0.5.0",
              "releaseSourceRevision": source,
              "automationRevision": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "taggedPlaybookSha256": digest(tagged),
              "reviewedPlaybookSha256": digest(reviewed),
              "originalRetryAuditSha256": digest(audit_path.read_bytes()),
              "releaseManifestSha256": digest((root / "release-manifest.json").read_bytes()),
          }
          if os.environ["OPERATION"] == "complete":
              (root / "completion-attempt.json").write_text(json.dumps(attempt, indent=2, sort_keys=True) + "\n")
          else:
              prior = json.loads((root / f"completion-attempt-{os.environ['UNFREEZE_RUN_ID']}-{os.environ['UNFREEZE_RUN_ATTEMPT']}.json").read_text())
              for key in ("schemaVersion", "action", "releaseTag", "releaseSourceRevision",
                          "taggedPlaybookSha256", "reviewedPlaybookSha256",
                          "originalRetryAuditSha256", "releaseManifestSha256"):
                  assert prior[key] == attempt[key], f"prior recovery asset mismatch: {key}"
              assert prior["workflowRunId"] == os.environ["UNFREEZE_RUN_ID"]
              assert prior["workflowRunAttempt"] == os.environ["UNFREEZE_RUN_ATTEMPT"]
          PY
          if [ "$OPERATION" = complete ]; then
            asset_name="completion-attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            mv "$ASSET_DIR/completion-attempt.json" "$ASSET_DIR/$asset_name"
            gh release upload "$RELEASE_TAG" "$ASSET_DIR/$asset_name"
          fi
          echo "controller_digest=$(jq -er '.controller.digest' "$ASSET_DIR/release-manifest.json")" >> "$GITHUB_OUTPUT"

      - name: Require expected production state
        run: |
          set -euo pipefail
          test "$(getent ahostsv4 "$AUTOGRAPHS_DOMAIN" | awk 'NR == 1 {print $1}')" = "$RUNTIME_IP"
          expected_publish_status=503
          if [ "$OPERATION" = finalize ]; then
            expected_publish_status=401
          fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "https://$AUTOGRAPHS_DOMAIN/admin/api/publish/full")" = "$expected_publish_status"
          curl --fail --silent --show-error "https://$AUTOGRAPHS_DOMAIN/manifest.json" \
            | jq -e '.releaseId == "a0805fb9-4570-4ad1-8f75-8c06a0e44f7a"' >/dev/null
          curl --fail --silent --show-error "https://$AUTOGRAPHS_DOMAIN/admin/api/health" \
            | jq -e '.release.repoVersion == "v0.5.0" and .release.sourceRevision == "13d8df0c1e83ebaebba03c32c45158dd10f3942f"' >/dev/null

      - name: Verify frozen origin readiness with corrected assertion
        if: inputs.operation == 'complete'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/deploy/ansible/ansible.cfg
        with:
          playbook: playbooks/publish-unfreeze.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            129.213.166.159 ansible_user=opc
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_deploy_repo_version=v0.5.0
            --extra-vars autographs_deploy_controller_digest=${{ steps.inputs.outputs.controller_digest }}
            --extra-vars autographs_deploy_source_revision=13d8df0c1e83ebaebba03c32c45158dd10f3942f
            --extra-vars autographs_deploy_domain=autographs.jetsaredim.net
            --extra-vars autographs_publish_unfreeze_verify_only=true

      - name: Explicitly unfreeze verified v0.5.0 publication
        if: inputs.operation == 'complete'
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/deploy/ansible/ansible.cfg
        with:
          playbook: playbooks/publish-unfreeze.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            129.213.166.159 ansible_user=opc
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_deploy_repo_version=v0.5.0
            --extra-vars autographs_deploy_controller_digest=${{ steps.inputs.outputs.controller_digest }}
            --extra-vars autographs_deploy_source_revision=13d8df0c1e83ebaebba03c32c45158dd10f3942f
            --extra-vars autographs_deploy_domain=autographs.jetsaredim.net
            --extra-vars autographs_publish_unfreeze_verify_only=false

      - name: Commit production release status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git switch --force-create production-status origin/main
            python3 scripts/release.py update-status \
              --manifest "$ASSET_DIR/release-manifest.json" \
              --mode retry \
              --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --retry-recovery-audit "$ASSET_DIR/retry-recovery-audit.json"
            git add .release-status.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'chore(release): record production v0.5.0'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done

      - name: Publish existing v0.5.0 draft
        run: gh release edit "$RELEASE_TAG" --draft=false
