name: Weekly Security Scan

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  issues: write

concurrency:
  group: production-security-patching
  cancel-in-progress: false

env:
  AUTOGRAPHS_DEPLOY_SSH_USER_OVERRIDE: ${{ vars.DEPLOY_SSH_USER }}

jobs:
  scan:
    name: Scan production security updates
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenSCAP runner tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 openscap-utils

      - name: Write deploy SSH key for OpenSCAP
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/autographs-deploy-key"
          chmod 600 "$RUNNER_TEMP/autographs-deploy-key"

      - name: Load OCI deploy signing key
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_DEPLOY_USER_OCID: ${{ vars.OCI_DEPLOY_USER_OCID }}
          OCI_DEPLOY_KEY_A: ${{ secrets.OCI_DEPLOY_KEY_A }}
          OCI_DEPLOY_KEY_B: ${{ secrets.OCI_DEPLOY_KEY_B }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: python3 scripts/oci_deploy_identity.py load

      - name: Resolve runtime VM IP
        id: resolve
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          vm-public-ip: ${{ vars.VM_PUBLIC_IP }}

      - name: Run security scan playbook
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          SECURITY_PATCHING_SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/autographs-deploy-key
        with:
          playbook: playbooks/security-scan.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            production ansible_host=${{ steps.resolve.outputs.runtime_public_ip }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars security_patching_target_group=runtime
