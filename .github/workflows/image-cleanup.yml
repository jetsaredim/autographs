name: Image Cleanup

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview local and GHCR image cleanup without deleting images"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: read
  packages: write

env:
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}
  GHCR_CLEANUP_RETAIN_TAGGED: ${{ vars.GHCR_CLEANUP_RETAIN_TAGGED || '3' }}
  GHCR_CLEANUP_RETAIN_SEMVER_TAGGED: ${{ vars.GHCR_CLEANUP_RETAIN_SEMVER_TAGGED || vars.GHCR_CLEANUP_RETAIN_TAGGED || '3' }}
  GHCR_CLEANUP_MIN_AGE_DAYS: ${{ vars.GHCR_CLEANUP_MIN_AGE_DAYS || '7' }}
  GHCR_CLEANUP_PROTECTED_TAGS: ${{ vars.GHCR_CLEANUP_PROTECTED_TAGS || '' }}
  GHCR_CLEANUP_DRY_RUN: ${{ inputs.dry_run || 'false' }}
  LOCAL_CLEANUP_DRY_RUN: ${{ inputs.dry_run || 'false' }}
  AUTOGRAPHS_LOCAL_IMAGE_RETAIN_COUNT: ${{ vars.AUTOGRAPHS_LOCAL_IMAGE_RETAIN_COUNT || '3' }}
  AUTOGRAPHS_DEPLOY_PATH_OVERRIDE: ${{ vars.DEPLOY_PATH }}
  AUTOGRAPHS_DEPLOY_SSH_USER_OVERRIDE: ${{ vars.DEPLOY_SSH_USER }}

jobs:
  resolve-runtime:
    name: Resolve runtime VM
    runs-on: ubuntu-latest
    environment: production
    outputs:
      runtime_public_ip: ${{ steps.resolve.outputs.runtime_public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load OCI deploy signing key
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          OCI_DEPLOY_USER_OCID: ${{ vars.OCI_DEPLOY_USER_OCID }}
          OCI_DEPLOY_KEY_A: ${{ secrets.OCI_DEPLOY_KEY_A }}
          OCI_DEPLOY_KEY_B: ${{ secrets.OCI_DEPLOY_KEY_B }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: python3 scripts/oci_deploy_identity.py load --ref main

      - name: Resolve runtime VM IP
        id: resolve
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          vm-public-ip: ${{ vars.VM_PUBLIC_IP }}

  runtime-cleanup:
    name: Remove old runtime images
    runs-on: ubuntu-latest
    needs: resolve-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean up local Podman images
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
        with:
          playbook: playbooks/system-cleanup.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            ${{ needs.resolve-runtime.outputs.runtime_public_ip }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars autographs_system_cleanup_controller_image_repository=${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
            --extra-vars autographs_system_cleanup_retain_count=${{ env.AUTOGRAPHS_LOCAL_IMAGE_RETAIN_COUNT }}
            --extra-vars 'autographs_system_cleanup_protected_tags=${{ env.GHCR_CLEANUP_PROTECTED_TAGS }}'
            --extra-vars autographs_system_cleanup_dry_run=${{ env.LOCAL_CLEANUP_DRY_RUN }}

  ghcr-cleanup:
    name: Remove old GHCR controller images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean up GHCR controller images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
        run: python3 scripts/cleanup-ghcr-images.py
