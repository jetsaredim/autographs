name: Reboot Security Runtime

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: production-security-updates
  cancel-in-progress: false

env:
  AUTOGRAPHS_DOMAIN: ${{ vars.AUTOGRAPHS_DOMAIN || 'autographs.jetsaredim.net' }}

jobs:
  reboot:
    name: Reboot production runtime for approved security cleanup
    if: >-
      github.event.label.name == 'approved-production-reboot' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenSCAP runner tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 openscap-utils

      - name: Write deploy SSH key for OpenSCAP
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/autographs-deploy-key"
          chmod 600 "$RUNNER_TEMP/autographs-deploy-key"

      - name: Install cleanup Ansible tooling
        run: python3 -m pip install --user ansible

      - name: Install cleanup Ansible collections
        run: ansible-galaxy collection install -r deploy/ansible/collections/requirements.yml

      - name: Resolve runtime VM IP
        id: resolve
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-private-key-pem: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          oci-cli-user-ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          vm-public-ip: ${{ vars.VM_PUBLIC_IP }}

      - name: Run security reboot playbook
        id: security_reboot
        continue-on-error: true
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          AUTOGRAPHS_DOMAIN: ${{ env.AUTOGRAPHS_DOMAIN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PATCH_APPROVER: ${{ github.actor }}
          PATCH_ISSUE_NUMBER: ${{ github.event.issue.number }}
          SECURITY_PATCHING_FAILURE_CONTEXT_PATH: ${{ github.workspace }}/.security-patching-failure-context.md
          SECURITY_PATCHING_FAILURE_REFRESH_PATH: ${{ github.workspace }}/.security-patching-failure-refresh.json
          SECURITY_PATCHING_SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/autographs-deploy-key
        with:
          playbook: playbooks/security-reboot.yml
          directory: deploy/ansible
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          inventory: |
            [runtime]
            production ansible_host=${{ steps.resolve.outputs.runtime_public_ip }} ansible_user=${{ vars.DEPLOY_SSH_USER || 'opc' }}
          requirements: collections/requirements.yml
          options: |
            --extra-vars security_patching_issue_number=${{ github.event.issue.number }}
            --extra-vars security_patching_approver=${{ github.actor }}
            --extra-vars security_patching_approval_label=approved-production-reboot
            --extra-vars security_patching_target_group=runtime
            --extra-vars security_patching_reboot_health_domain=${{ env.AUTOGRAPHS_DOMAIN }}

      - name: Cleanup failed security reboot request
        if: always() && steps.security_reboot.outcome != 'success'
        env:
          ANSIBLE_CONFIG: deploy/ansible/ansible.cfg
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          SECURITY_PATCHING_FAILURE_CONTEXT_PATH: ${{ github.workspace }}/.security-patching-failure-context.md
          SECURITY_PATCHING_FAILURE_REFRESH_PATH: ${{ github.workspace }}/.security-patching-failure-refresh.json
        run: |
          ansible-playbook \
            --extra-vars security_patching_issue_number=${{ github.event.issue.number }} \
            --extra-vars security_patching_approval_label=approved-production-reboot \
            --extra-vars '{"security_patching_failed_request_message":"Production security reboot workflow did not complete successfully."}' \
            --extra-vars security_patching_workflow_outcome=${{ steps.security_reboot.outcome }} \
            deploy/ansible/playbooks/security-patch-cleanup.yml

      - name: Fail after cleanup if reboot failed
        if: steps.security_reboot.outcome != 'success'
        run: exit 1
