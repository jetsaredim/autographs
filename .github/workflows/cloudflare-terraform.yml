name: Plan or apply Cloudflare Terraform changes

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan changes or apply an identical reviewed plan
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      expected_plan_sha:
        description: SHA-256 fingerprint printed by a reviewed plan run; required for apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  cloudflare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Plan or apply reviewed Cloudflare changes
        working-directory: infra/terraform
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_PLAN_SHA: ${{ inputs.expected_plan_sha }}
          CLOUDFLARE_ZONE_ID: 52477e17b9f51fea6920515dead94e07
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_shape: ${{ vars.OCI_RUNTIME_SHAPE || 'VM.Standard.E2.1.Micro' }}
          TF_VAR_runtime_ocpus: ${{ vars.OCI_RUNTIME_OCPUS || 1 }}
          TF_VAR_runtime_memory_gbs: ${{ vars.OCI_RUNTIME_MEMORY_GBS || 1 }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_create_autonomous_database: ${{ vars.OCI_CREATE_AUTONOMOUS_DATABASE || 'false' }}
          TF_VAR_autonomous_database_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_NAME || 'autographsdb' }}
          TF_VAR_autonomous_database_display_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_DISPLAY_NAME || 'autographs-prod-adb' }}
          TF_VAR_autonomous_database_is_mtls_connection_required: ${{ vars.OCI_AUTONOMOUS_DATABASE_IS_MTLS_CONNECTION_REQUIRED || 'true' }}
          TF_VAR_create_media_bucket: ${{ vars.OCI_CREATE_MEDIA_BUCKET || 'false' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_media_bucket_name: ${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_domain: ${{ vars.AUTOGRAPHS_DNS_DOMAIN || 'jetsaredim.net' }}
          TF_VAR_autographs_dns_subdomain: ${{ vars.AUTOGRAPHS_DNS_SUBDOMAIN || 'autographs' }}
          TF_VAR_autographs_dns_ttl: ${{ vars.AUTOGRAPHS_DNS_TTL || 600 }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
          TF_VAR_cloudflare_mode: ${{ vars.CLOUDFLARE_MODE }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          case "$OPERATION" in
            plan|apply) ;;
            *) echo "::error::Unsupported Cloudflare operation."; exit 1 ;;
          esac
          if [ "$TF_VAR_cloudflare_mode" != proxied ] && [ "$TF_VAR_cloudflare_mode" != dns_only ]; then
            echo "::error::Cloudflare mode must be proxied or dns_only for operator changes."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare token and account ID are required."
            exit 1
          fi
          if [ "$OPERATION" = apply ] && ! [[ "$EXPECTED_PLAN_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Apply requires the 64-character fingerprint from a reviewed plan run."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID" \
            > "$RUNNER_TEMP/cloudflare-zone.json"
          jq -e --arg zone "$CLOUDFLARE_ZONE_ID" --arg account "$CLOUDFLARE_ACCOUNT_ID" '
            .success == true and .result.id == $zone and
            .result.name == "jetsaredim.net" and .result.account.id == $account and
            .result.type == "full" and .result.status == "active"
          ' "$RUNNER_TEMP/cloudflare-zone.json" >/dev/null || {
            echo "::error::The active Cloudflare zone does not match the reviewed account and zone."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          for address in \
            'cloudflare_zone.domain[0]' \
            'cloudflare_dns_record.autographs[0]' \
            'cloudflare_dns_record.mail[0]' \
            'cloudflare_dns_record.spf[0]' \
            'cloudflare_zone_setting.strict_tls[0]' \
            'cloudflare_ruleset.autographs_cache[0]'; do
            if ! terraform state list | grep -Fxq "$address"; then
              echo "::error::Required Cloudflare state address $address is missing. Stop for state review."
              exit 1
            fi
          done
          terraform state pull | jq -e --arg zone "$CLOUDFLARE_ZONE_ID" '
            [.resources[] | select(.module == null and .mode == "managed" and
              .type == "cloudflare_zone" and .name == "domain") |
              .instances[] | select(.index_key == 0) | .attributes.id] == [$zone]
          ' >/dev/null || {
            echo "::error::The Terraform zone state does not match the reviewed Cloudflare zone."
            exit 1
          }
          plan_file="$RUNNER_TEMP/cloudflare-terraform.tfplan"
          plan_json="$RUNNER_TEMP/cloudflare-terraform-plan.json"
          terraform plan -input=false -lock-timeout=5m -out="$plan_file"
          terraform show -json "$plan_file" > "$plan_json"
          jq -e '
            [.resource_changes[]? | select(.change.actions != ["no-op"])] |
            all(.[]; .mode == "managed" and (.address | startswith("cloudflare_")))
          ' "$plan_json" >/dev/null || {
            echo "::error::Plan includes a change outside Cloudflare-managed resources. No apply ran."
            exit 1
          }
          jq -r '
            .resource_changes[]? | select(.change.actions != ["no-op"]) |
            "\(.address): \(.change.actions | join(","))"
          ' "$plan_json"
          change_count="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' "$plan_json")"
          plan_sha="$(jq -cS '
            [.resource_changes[]? | select(.change.actions != ["no-op"])] | sort
          ' "$plan_json" | sha256sum | cut -d' ' -f1)"
          echo "Cloudflare change count: $change_count"
          echo "Cloudflare plan fingerprint: $plan_sha"
          if [ "$OPERATION" = apply ]; then
            if [ "$change_count" -eq 0 ] || [ "$plan_sha" != "$EXPECTED_PLAN_SHA" ]; then
              echo "::error::The current plan does not match the reviewed nonempty plan fingerprint. No apply ran."
              exit 1
            fi
            terraform apply -input=false -lock-timeout=5m "$plan_file"
            echo "Applied the exact saved Cloudflare plan with the reviewed fingerprint."
          else
            echo "Plan only: no Terraform apply was run."
          fi
