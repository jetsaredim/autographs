name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ vars.GHCR_CONTROLLER_IMAGE_REPOSITORY || format('ghcr.io/{0}/controller', github.repository) }}

jobs:
  impact:
    name: Classify CI impact
    runs-on: ubuntu-latest
    outputs:
      controller-image: ${{ steps.classify.outputs.controller-image }}
      controller-checks: ${{ steps.classify.outputs.controller-checks }}
      terraform-checks: ${{ steps.classify.outputs.terraform-checks }}
      ansible-checks: ${{ steps.classify.outputs.ansible-checks }}
      dockerfile-checks: ${{ steps.classify.outputs.dockerfile-checks }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' \
              'controller-image=true' \
              'controller-checks=true' \
              'terraform-checks=true' \
              'ansible-checks=true' \
              'dockerfile-checks=true' >> "$GITHUB_OUTPUT"
          else
            classification="$(python3 scripts/release.py classify-refs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA")"
            jq -r '
              .changedPaths as $paths |
              ($paths | index(".github/workflows/ci.yml") != null) as $ci |
              ($paths | any(.[];
                startswith("deploy/ansible/") or
                startswith("quality/ast-grep/") or
                . == "sgconfig.yml" or
                . == "scripts/validate-runtime.sh" or
                . == ".gitignore" or
                . == ".env.example" or
                . == ".github/.env.github.example" or
                . == "docs/cdn-cache-contract.md" or
                . == "docs/configuration-contract.md" or
                . == "docs/deployment-runbook.md" or
                . == "docs/oci-bootstrap.md" or
                . == "docs/static-runtime-runbook.md"
              )) as $runtime_contract |
              {
                "controller-image": (.controllerChanged or $ci),
                "controller-checks": (.controllerChanged or .terraformChanged or .ansibleOrDeployChanged or $runtime_contract or $ci),
                "terraform-checks": (.terraformChanged or ($paths | index(".github/workflows/deploy.yml") != null) or $ci or ($head_ref | startswith("release-please--branches--main"))),
                "ansible-checks": (.ansibleOrDeployChanged or $ci),
                "dockerfile-checks": (.controllerChanged or $ci)
              } | to_entries[] | "\(.key)=\(.value)"
            ' --arg head_ref "$HEAD_REF" <<<"$classification" >> "$GITHUB_OUTPUT"
          fi

  workflow-checks:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Validate Terraform version alignment
        run: python3 scripts/validate-terraform-version-alignment.py

      - name: Validate repository hygiene
        run: python3 scripts/validate_repo_hygiene.py

      - name: Run repository automation tests
        run: |
          python3 -m unittest \
            scripts/test_release.py \
            scripts/test_release_workflow.py \
            scripts/test_sync_runtime_vault_secrets.py \
            scripts/test_validate_release_please_inputs.py \
            scripts/test_select_removable_images.py \
            scripts/test_cleanup_ghcr_images.py \
            scripts/test_validate_repo_hygiene.py \
            scripts/test_oracle_linux_advisory_enrichment.py \
            scripts/test_oracle_linux_oscap_results.py \
            scripts/test_security_patching_create_issue_tasks.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dockerfile-checks:
    name: Dockerfile checks
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.dockerfile-checks == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint controller Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: controller/Dockerfile
          verbose: true

  controller-checks:
    name: Controller checks
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.controller-checks == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust structural tooling
        run: npm install --global @ast-grep/cli@0.45.0

      - name: Test and scan Rust structural rules
        run: |
          ast-grep test --skip-snapshot-tests
          ast-grep scan \
            --error=unused-suppression \
            --error=no-suppress-all \
            controller/src \
            controller/image-processing/src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Rust coverage tooling
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            controller/target
            controller/image-processing/target
          key: cargo-controller-${{ runner.os }}-${{ hashFiles('controller/Cargo.lock', 'controller/image-processing/Cargo.toml') }}
          restore-keys: |
            cargo-controller-${{ runner.os }}-

      - name: Check formatting
        run: |
          cargo fmt --manifest-path controller/Cargo.toml --check
          cargo fmt --manifest-path controller/image-processing/Cargo.toml --check

      - name: Test shared image processing crate
        run: cargo test --manifest-path controller/image-processing/Cargo.toml

      - name: Validate runtime persistence artifacts
        run: bash scripts/validate-runtime.sh

      - name: Run production-feature tests with coverage
        run: |
          cargo llvm-cov \
            --manifest-path controller/Cargo.toml \
            --features production-persistence \
            --summary-only \
            --fail-under-lines 62

      - name: Run Clippy
        run: |
          cargo clippy \
            --manifest-path controller/image-processing/Cargo.toml \
            --all-targets \
            -- -D warnings
          cargo clippy \
            --manifest-path controller/Cargo.toml \
            --all-targets \
            --features production-persistence \
            -- -D warnings

  image-build:
    name: Build runtime images
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.controller-image == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build controller image
        uses: docker/bake-action@v7
        env:
          GHCR_CONTROLLER_IMAGE_REPOSITORY: ${{ env.GHCR_CONTROLLER_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ci
          SOURCE_REVISION: ${{ github.sha }}
        with:
          files: |
            .github/docker-bake.hcl
          push: false
          provenance: false

  terraform-checks:
    name: Terraform checks
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.terraform-checks == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive -list=true -diff

      - name: Terraform tenancy validate
        working-directory: infra/terraform/tenancy
        run: |
          # Tenancy plans require an operator/admin OCI identity, so PR CI
          # validates syntax and provider schemas while live plans stay local.
          terraform init -backend=false
          terraform validate

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Terraform plan
        id: terraform_plan
        working-directory: infra/terraform
        env:
          DESTRUCTIVE_PLAN_APPROVED: ${{ github.event.action == 'labeled' && github.event.label.name == 'terraform-destructive-plan-approved' }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
          CLOUDFLARE_MODE_OVERRIDE: ${{ vars.CLOUDFLARE_MODE }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_MODE_OVERRIDE" ]; then
            export TF_VAR_cloudflare_mode="$CLOUDFLARE_MODE_OVERRIDE"
          fi
          if [ "$CLOUDFLARE_MODE_OVERRIDE" != "off" ]; then
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "::error::Set the CLOUDFLARE_API_TOKEN secret before using a Cloudflare mode."
              exit 1
            fi
          fi
          terraform init \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          terraform validate
          terraform_plan_file="$RUNNER_TEMP/ci-runtime.tfplan"
          terraform plan -no-color -input=false -lock-timeout=10m -out="$terraform_plan_file"
          destructive_actions="$(terraform show -json "$terraform_plan_file" | jq -r '
            .resource_changes[]?
            | select(.mode == "managed")
            | select((.change.actions | index("delete")) or (.change.actions | index("forget")))
            | "\(.address): \(.change.actions | join(","))"
          ')"
          if [ -n "$destructive_actions" ]; then
            printf 'Destructive managed-resource actions:\n%s\n' "$destructive_actions"
            if [ "$DESTRUCTIVE_PLAN_APPROVED" != "true" ]; then
              echo "::error::Review the actions above, then add the terraform-destructive-plan-approved PR label for this PR head. If already present, remove and re-add it."
              exit 1
            fi
            echo "::warning::Destructive Terraform plan acknowledged by PR label; review the actions above before merge."
          fi
          echo "Production Terraform state addresses:"
          terraform state list | sort
          echo "Changed managed-resource actions:"
          terraform show -json "$terraform_plan_file" \
            | jq -r '.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"]) | "\(.address): \(.change.actions | join(","))"'

  validate-ansible:
    name: Ansible syntax and lint
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.ansible-checks == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ansible tooling
        run: python3 -m pip install --user ansible ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r deploy/ansible/collections/requirements.yml

      - name: Syntax check Ansible playbook
        run: |
          ANSIBLE_CONFIG=deploy/ansible/ansible.cfg ansible-playbook --syntax-check \
            deploy/ansible/playbooks/deploy.yml \
            deploy/ansible/playbooks/publish-freeze-preflight.yml \
            deploy/ansible/playbooks/publish-unfreeze.yml \
            deploy/ansible/playbooks/publish-freeze-render-test.yml \
            deploy/ansible/playbooks/publish-freeze-deploy-test.yml \
            deploy/ansible/playbooks/publish-freeze-role-reaudit-test.yml \
            deploy/ansible/playbooks/controller-rollback.yml \
            deploy/ansible/playbooks/system-cleanup.yml \
            deploy/ansible/playbooks/security-scan.yml \
            deploy/ansible/playbooks/security-patch.yml \
            deploy/ansible/playbooks/security-reboot.yml \
            deploy/ansible/playbooks/security-patch-cleanup.yml \
            deploy/ansible/playbooks/security-report-render-test.yml \
            deploy/ansible/playbooks/security-request-metadata-validate-test.yml \
            deploy/ansible/playbooks/security-create-issue-status-validate-test.yml \
            deploy/ansible/playbooks/security-finding-classification-validate-test.yml \
            deploy/ansible/playbooks/security-kernel-posture-validate-test.yml \
            deploy/ansible/playbooks/security-post-result-status-validate-test.yml \
            deploy/ansible/playbooks/security-post-result-refresh-validate-test.yml \
            deploy/ansible/playbooks/security-target-scope-validate-test.yml \
            deploy/ansible/playbooks/security-update-reconciliation-validate-test.yml \
            deploy/ansible/playbooks/security-reboot-preflight-validate-test.yml \
            deploy/ansible/playbooks/security-reboot-kernel-selection-validate-test.yml \
            deploy/ansible/playbooks/security-reboot-state-validate-test.yml \
            deploy/ansible/playbooks/security-reboot-result-validate-test.yml \
            deploy/ansible/playbooks/deploy-admin-credentials-validate-test.yml \
            deploy/ansible/playbooks/runtime-kernel-persistence-validate-test.yml

      - name: Lint Ansible playbook
        run: ANSIBLE_CONFIG=deploy/ansible/ansible.cfg ansible-lint deploy/ansible/
