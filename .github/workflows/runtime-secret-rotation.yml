name: Runtime Secret Rotation

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true

env:
  APPROVAL_LABEL: approved-secret-rotation
  STATUS_CONTEXT: Runtime secret drift
  AUTOGRAPHS_DEPLOY_PATH_OVERRIDE: ${{ vars.DEPLOY_PATH }}
  AUTOGRAPHS_DEPLOY_SSH_USER_OVERRIDE: ${{ vars.DEPLOY_SSH_USER }}

jobs:
  rotation:
    name: Check PR drift or apply approved credential rotation
    concurrency:
      group: ${{ inputs.mode == 'apply' && 'deploy-production' || format('runtime-secret-check-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve PR and label approval
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          case "$MODE:$GITHUB_EVENT_NAME:$GITHUB_REF" in
            check:pull_request_target:refs/heads/main)
              number="$EVENT_PR"
              pr="$(gh api "$repo/pulls/$number")"
              if ! jq -e --arg head "$EVENT_HEAD" \
                '.state == "open" and .base.ref == "main" and .head.sha == $head' <<< "$pr" >/dev/null; then
                exit 0
              fi
              ;;
            apply:push:refs/heads/main)
              pr="$(gh api "$repo/commits/$GITHUB_SHA/pulls" | jq -c --arg sha "$GITHUB_SHA" \
                --arg repository "$GITHUB_REPOSITORY" --arg label "$APPROVAL_LABEL" '
                map(select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha
                  and .head.repo.full_name == $repository and .user.login != "dependabot[bot]"
                  and any(.labels[]; .name == $label))) | first // empty')"
              if [[ -z "$pr" ]]; then
                exit 0
              fi
              number="$(jq -er '.number' <<< "$pr")"
              ;;
            *) echo 'Unexpected event for runtime secret rotation.' >&2; exit 1 ;;
          esac
          head="$(jq -er '.head.sha' <<< "$pr")"
          [[ "$number" =~ ^[1-9][0-9]*$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == check ]] && ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.head.repo.full_name == $repo and .user.login != "dependabot[bot]"' <<< "$pr" >/dev/null; then
            echo 'PR is outside the live-secret check scope.'
            exit 0
          fi

          # Only a fresh label event can authorize the check. The merge uses the same event ID.
          label_present="$(jq -r --arg label "$APPROVAL_LABEL" 'any(.labels[]; .name == $label)' <<< "$pr")"
          label_event=0
          if [[ "$MODE" == apply || ( "$GITHUB_RUN_ATTEMPT" == 1 && "$label_present" == true &&
            "$EVENT_ACTION" == labeled && "$EVENT_LABEL" == "$APPROVAL_LABEL" && "$EVENT_SENDER" == "$OWNER" ) ]]; then
            latest="$(gh api "$repo/issues/$number/events" --paginate | jq -cs --arg label "$APPROVAL_LABEL" '
              flatten | map(select((.event == "labeled" or .event == "unlabeled") and .label.name == $label))
              | sort_by(.id) | last // empty')"
            if [[ -n "$latest" ]]; then
              label_event="$(jq -r --arg owner "$OWNER" \
                'if .event == "labeled" and .actor.login == $owner then .id else 0 end' <<< "$latest")"
            fi
          fi
          [[ "$label_event" =~ ^[0-9]+$ ]]

          if [[ "$MODE" == apply ]]; then
            merged_at="$(jq -er '.merged_at' <<< "$pr")"
            [[ "$label_event" != 0 ]]
            jq -e --arg merged "$merged_at" '.created_at <= $merged' <<< "$latest" >/dev/null
            approval="$(gh api "$repo/issues/$number/comments" --paginate | jq -cs --arg merged "$merged_at" \
              --arg head "$head" --argjson event "$label_event" '
                flatten | map(select(.user.login == "github-actions[bot]" and .created_at <= $merged)
                  | .body | split("\n")[0] | select(startswith("<!-- AUTOGRAPHS_PR_ROTATION "))
                  | ltrimstr("<!-- AUTOGRAPHS_PR_ROTATION ") | rtrimstr(" -->") | fromjson?
                  | select(.request.head == $head and .request.label_event == $event)) | last // empty')"
            if [[ -z "$approval" ]]; then
              echo 'No checked rotation approval was found for the merged head and label event.' >&2
              exit 1
            fi
            printf '%s\n' "$approval" > "$RUNNER_TEMP/runtime-rotation.json"
            echo "merged_at=$merged_at" >> "$GITHUB_OUTPUT"
            credential="$(jq -er '.request.credential' <<< "$approval")"
            case "$credential" in
              admin_password_hash|oracle_db_wallet_password) ;;
              *) echo 'Unknown rotation credential.' >&2; exit 1 ;;
            esac
            echo "credential=$credential" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "pr=$number" "label_event=$label_event" "label_present=$label_present" >> "$GITHUB_OUTPUT"

      - name: Mark runtime secret check pending on the PR head
        if: inputs.mode == 'check' && steps.request.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ steps.request.outputs.head }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" \
            -f context="$STATUS_CONTEXT" -f state=pending \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Check out trusted base or merged code
        if: steps.request.outputs.pr != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve runtime coordinates from Terraform
        if: steps.request.outputs.pr != ''
        id: runtime
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-private-key-pem: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          oci-cli-user-ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}

      - name: Select OCI CLI Python version
        if: steps.request.outputs.pr != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'

      - name: Set up OCI CLI
        if: steps.request.outputs.pr != ''
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check 'oci-cli==3.96.2'
          umask 077
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER_OCID"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci/api_key.pem"
            printf 'region=us-ashburn-1\n'
          } > "$RUNNER_TEMP/oci/config"

      - name: Check deployed runtime before a Vault update
        if: inputs.mode == 'apply' && steps.request.outputs.pr != ''
        working-directory: deploy/ansible
        env:
          RUNTIME_IP: ${{ steps.runtime.outputs.runtime_public_ip }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ROTATION_CREDENTIAL: ${{ steps.request.outputs.credential }}
        run: |
          set -euo pipefail
          python3 -m pip install ansible
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/rotation-ssh-key"
          printf '[runtime]\n%s\n' "$RUNTIME_IP" > "$RUNNER_TEMP/rotation-inventory"
          ansible-playbook --private-key "$RUNNER_TEMP/rotation-ssh-key" \
            -i "$RUNNER_TEMP/rotation-inventory" playbooks/rotate-runtime-secret.yml \
            --tags rotation_preflight

      - name: Check or apply the candidate in OCI Vault
        if: steps.request.outputs.pr != ''
        working-directory: infra/terraform
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ROTATION_PR: ${{ steps.request.outputs.pr }}
          PR_HEAD: ${{ steps.request.outputs.head }}
          LABEL_EVENT: ${{ steps.request.outputs.label_event }}
          LABEL_PRESENT: ${{ steps.request.outputs.label_present }}
          MERGED_AT: ${{ steps.request.outputs.merged_at }}
          RUNTIME_SECRET_ROTATION_AUTH_KEY: ${{ secrets.RUNTIME_SECRET_ROTATION_AUTH_KEY }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
        run: |
          set -euo pipefail
          umask 077
          approval="$RUNNER_TEMP/runtime-rotation.json"
          arguments=(--pull-request "$ROTATION_PR" --head "$PR_HEAD" --label-event "$LABEL_EVENT"
            --approval "$approval" --oci-bin "$RUNNER_TEMP/oci-cli/bin/oci"
            --oci-config-file "$RUNNER_TEMP/oci/config")
          if [[ "$MODE" == apply ]]; then
            python3 ../../scripts/sync_runtime_vault_secrets.py rotation-apply "${arguments[@]}" \
              --merged-at "$MERGED_AT" --wallet-output "$RUNNER_TEMP/rotation-wallet.b64"
          else
            if [[ "$LABEL_PRESENT" == true ]]; then
              arguments+=(--label-present)
            fi
            python3 ../../scripts/sync_runtime_vault_secrets.py rotation-check "${arguments[@]}"
            if [[ -f "$approval" ]]; then
              version="$(jq -er '.request.version' "$approval")"
              credential="$(jq -er '.request.credential' "$approval")"
              {
                printf '<!-- AUTOGRAPHS_PR_ROTATION %s -->\n\n' "$(cat "$approval")"
                printf 'Checked **%s** against Vault CURRENT version %s for commit %s.\n' \
                  "$credential" "$version" "$PR_HEAD"
                printf 'Merging this checked PR within 24 hours authorizes its runtime secret rotation.\n'
              } | gh pr comment "$ROTATION_PR" --repo "$GITHUB_REPOSITORY" --body-file -
            fi
          fi

      - name: Apply runtime credentials and verify controller health
        if: inputs.mode == 'apply' && steps.request.outputs.pr != ''
        working-directory: deploy/ansible
        env:
          ROTATION_CREDENTIAL: ${{ steps.request.outputs.credential }}
        run: |
          set -euo pipefail
          if [[ "$ROTATION_CREDENTIAL" == 'oracle_db_wallet_password' ]]; then
            ORACLE_DB_WALLET_ZIP_BASE64="$(cat "$RUNNER_TEMP/rotation-wallet.b64")"
            export ORACLE_DB_WALLET_ZIP_BASE64
          fi
          ansible-playbook --private-key "$RUNNER_TEMP/rotation-ssh-key" \
            -i "$RUNNER_TEMP/rotation-inventory" playbooks/rotate-runtime-secret.yml

      - name: Report runtime secret check on the PR head
        if: always() && inputs.mode == 'check' && steps.request.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ steps.request.outputs.head }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" \
            -f context="$STATUS_CONTEXT" -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
