name: Runtime Secret Rotation

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue number for the rotation request
        type: number
        required: true
      credential:
        description: Runtime credential to check
        type: choice
        required: true
        options:
          - admin_password_hash
          - oracle_db_wallet_password
      operation:
        description: Rotate a changed value or reconcile the runtime after a partial rotation
        type: choice
        required: true
        default: rotate
        options:
          - rotate
          - reconcile
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: read

env:
  APPROVAL_LABEL: approved-secret-rotation
  ROTATION_ISSUE: ${{ github.event.issue.number || inputs.issue }}
  AUTOGRAPHS_DEPLOY_PATH_OVERRIDE: ${{ vars.DEPLOY_PATH }}
  AUTOGRAPHS_DEPLOY_SSH_USER_OVERRIDE: ${{ vars.DEPLOY_SSH_USER }}

jobs:
  rotation:
    name: Check or apply an approved runtime credential rotation
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
       (github.event_name == 'issues' && github.event.label.name == 'approved-secret-rotation' &&
        github.event.issue.pull_request == null && github.event.sender.login == github.repository_owner))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read issue and checked rotation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          INPUT_CREDENTIAL: ${{ inputs.credential }}
        run: |
          set -euo pipefail
          [[ "$ROTATION_ISSUE" =~ ^[1-9][0-9]*$ ]]
          issue_api="repos/$GITHUB_REPOSITORY/issues/$ROTATION_ISSUE"
          issue="$(gh api "$issue_api")"
          jq -e --arg owner "$OWNER" \
            '.state == "open" and .pull_request == null and .user.login == $owner' <<< "$issue" >/dev/null
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if jq -e --arg label "$APPROVAL_LABEL" 'any(.labels[]; .name == $label)' <<< "$issue" >/dev/null; then
              echo 'Remove the outstanding approval label before running a new check.' >&2
              exit 1
            fi
            credential="$INPUT_CREDENTIAL"
          else
            jq -e --arg label "$APPROVAL_LABEL" 'any(.labels[]; .name == $label)' <<< "$issue" >/dev/null
            run_start="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            request="$(gh api "$issue_api/comments" --paginate | jq -cse '
              flatten | map(select(.user.login == "github-actions[bot]" and
                (.body | startswith("<!-- AUTOGRAPHS_ROTATION_")))) | last')"
            jq -e --arg start "$run_start" '.created_at < $start' <<< "$request" >/dev/null
            jq -er '.body | split("\n")[0] |
              select(startswith("<!-- AUTOGRAPHS_ROTATION_PREFLIGHT ")) |
              ltrimstr("<!-- AUTOGRAPHS_ROTATION_PREFLIGHT ") | rtrimstr(" -->")' \
              <<< "$request" > "$RUNNER_TEMP/runtime-rotation.json"
            jq -er '.body' <<< "$request" > "$RUNNER_TEMP/runtime-rotation-comment"
            credential="$(jq -er '.request.credential' "$RUNNER_TEMP/runtime-rotation.json")"
            jq -er '.id' <<< "$request" > "$RUNNER_TEMP/runtime-rotation-comment-id"
          fi
          case "$credential" in
            admin_password_hash|oracle_db_wallet_password) ;;
            *) echo 'Unknown rotation credential.' >&2; exit 1 ;;
          esac
          echo "credential=$credential" >> "$GITHUB_OUTPUT"

      - name: Resolve runtime coordinates from Terraform
        id: runtime
        uses: ./.github/actions/resolve-runtime-ip
        with:
          oci-private-key-pem: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          oci-cli-user-ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-object-storage-namespace: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}

      - name: Select OCI CLI Python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'

      - name: Set up OCI CLI
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check 'oci-cli==3.96.2'
          umask 077
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER_OCID"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci/api_key.pem"
            printf 'region=us-ashburn-1\n'
          } > "$RUNNER_TEMP/oci/config"

      - name: Prepare runtime check
        working-directory: deploy/ansible
        env:
          RUNTIME_IP: ${{ steps.runtime.outputs.runtime_public_ip }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install ansible
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/rotation-ssh-key"
          printf '[runtime]\n%s\n' "$RUNTIME_IP" > "$RUNNER_TEMP/rotation-inventory"

      - name: Check runtime prerequisites
        working-directory: deploy/ansible
        env:
          ROTATION_CREDENTIAL: ${{ steps.request.outputs.credential }}
        run: |
          ansible-playbook --private-key "$RUNNER_TEMP/rotation-ssh-key" \
            -i "$RUNNER_TEMP/rotation-inventory" playbooks/rotate-runtime-secret.yml \
            --tags rotation_preflight

      - name: Consume the checked request and approval
        if: github.event_name == 'issues'
        id: consume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_id="$(cat "$RUNNER_TEMP/runtime-rotation-comment-id")"
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          issue_api="repos/$GITHUB_REPOSITORY/issues/$ROTATION_ISSUE"
          gh api "$issue_api" | jq -e --arg label "$APPROVAL_LABEL" \
            '.state == "open" and any(.labels[]; .name == $label)' >/dev/null
          comment_api="repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          body="$(sed '1c<!-- AUTOGRAPHS_ROTATION_CONSUMED -->' "$RUNNER_TEMP/runtime-rotation-comment")"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method PATCH "$comment_api" \
            -f body="$(printf '%s\n\n[Approval consumed](%s).\n' "$body" "$run_url")" >/dev/null
          gh api --method DELETE "$issue_api/labels/$APPROVAL_LABEL" >/dev/null

      - name: Check or apply the candidate in OCI Vault
        working-directory: infra/terraform
        env:
          GH_TOKEN: ${{ github.token }}
          ROTATION_CREDENTIAL: ${{ steps.request.outputs.credential }}
          ROTATION_OPERATION: ${{ inputs.operation }}
          RUNTIME_SECRET_ROTATION_AUTH_KEY: ${{ secrets.RUNTIME_SECRET_ROTATION_AUTH_KEY }}
          AUTOGRAPHS_ADMIN_PASSWORD_HASH: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          ORACLE_DB_WALLET_ZIP_BASE64: ${{ secrets.ORACLE_DB_WALLET_ZIP_BASE64 }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'issues' ]]; then
            umask 077
            python3 ../../scripts/sync_runtime_vault_secrets.py rotation-apply \
              --wallet-output "$RUNNER_TEMP/rotation-wallet.b64" \
              --issue "$ROTATION_ISSUE" --approval "$RUNNER_TEMP/runtime-rotation.json" \
              --oci-bin "$RUNNER_TEMP/oci-cli/bin/oci" --oci-config-file "$RUNNER_TEMP/oci/config"
            exit
          fi
          python3 ../../scripts/sync_runtime_vault_secrets.py rotation-preflight \
            --credential "$ROTATION_CREDENTIAL" --operation "$ROTATION_OPERATION" \
            --issue "$ROTATION_ISSUE" --approval "$RUNNER_TEMP/runtime-rotation.json" \
            --oci-bin "$RUNNER_TEMP/oci-cli/bin/oci" --oci-config-file "$RUNNER_TEMP/oci/config"
          version="$(jq -er '.request.version' "$RUNNER_TEMP/runtime-rotation.json")"
          {
            printf '<!-- AUTOGRAPHS_ROTATION_PREFLIGHT %s -->\n\n' "$(cat "$RUNNER_TEMP/runtime-rotation.json")"
            printf 'Checked **%s** for **%s** at Vault CURRENT version %s.\n\n' \
              "$ROTATION_OPERATION" "$ROTATION_CREDENTIAL" "$version"
            if [[ "$ROTATION_CREDENTIAL" == 'oracle_db_wallet_password' ]]; then
              printf 'This request also covers installing the checked wallet ZIP.\n\n'
            fi
            printf 'Apply `%s` within 24 hours to approve this request.\n' "$APPROVAL_LABEL"
          } | gh issue comment "$ROTATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Apply runtime credentials and verify controller health
        if: github.event_name == 'issues'
        working-directory: deploy/ansible
        env:
          ROTATION_CREDENTIAL: ${{ steps.request.outputs.credential }}
        run: |
          set -euo pipefail
          if [[ "$ROTATION_CREDENTIAL" == 'oracle_db_wallet_password' ]]; then
            ORACLE_DB_WALLET_ZIP_BASE64="$(cat "$RUNNER_TEMP/rotation-wallet.b64")"
            export ORACLE_DB_WALLET_ZIP_BASE64
          fi
          ansible-playbook --private-key "$RUNNER_TEMP/rotation-ssh-key" \
            -i "$RUNNER_TEMP/rotation-inventory" playbooks/rotate-runtime-secret.yml

      - name: Record approval outcome
        if: always() && github.event_name == 'issues' && steps.request.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          CONSUMED: ${{ steps.consume.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CONSUMED" != success ]]; then
            issue_api="repos/$GITHUB_REPOSITORY/issues/$ROTATION_ISSUE"
            if gh api "$issue_api" | jq -e --arg label "$APPROVAL_LABEL" 'any(.labels[]; .name == $label)' >/dev/null; then
              gh api --method DELETE "$issue_api/labels/$APPROVAL_LABEL" >/dev/null
            fi
          fi
          printf 'Rotation run finished with status **%s**. [Run details](%s/%s/actions/runs/%s).\n' \
            "$RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" |
            gh issue comment "$ROTATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file -
