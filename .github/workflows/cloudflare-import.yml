name: Reconcile Cloudflare DNS state and settings

on:
  workflow_dispatch:
    inputs:
      zone_id:
        description: Cloudflare zone ID for jetsaredim.net
        required: true
        type: string
      operation:
        description: Verify state or run one guarded Cloudflare change
        required: true
        default: verify_only
        type: choice
        options:
          - verify_only
          - apply_tls_and_cache
          - apply_proxy
          - apply_dns_only

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Write OCI API private key
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci/api_key.pem"

      - name: Verify live Cloudflare inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODE: ${{ vars.CLOUDFLARE_MODE }}
          OPERATION: ${{ inputs.operation }}
          ZONE_ID: ${{ inputs.zone_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ZONE_ID" =~ ^[a-f0-9]{32}$ ]] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::A zone ID, account ID, and API token are required."
            exit 1
          fi
          case "$OPERATION:$CLOUDFLARE_MODE" in
            verify_only:dns_only|apply_tls_and_cache:dns_only)
              expected_proxied=false; expected_ttl=600 ;;
            verify_only:proxied|apply_dns_only:dns_only)
              expected_proxied=true; expected_ttl=1 ;;
            apply_proxy:proxied)
              expected_proxied=false; expected_ttl=600 ;;
            *) echo "::error::Operation and persistent Cloudflare mode do not form a valid transition."; exit 1 ;;
          esac
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID" > "$RUNNER_TEMP/cloudflare-zone.json"
          jq -e --arg zone "$ZONE_ID" --arg account "$CLOUDFLARE_ACCOUNT_ID" '
            .success == true and .result.id == $zone and
            .result.name == "jetsaredim.net" and .result.account.id == $account and
            .result.type == "full" and .result.status == "active"
          ' "$RUNNER_TEMP/cloudflare-zone.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
            > "$RUNNER_TEMP/cloudflare-records.json"
          jq -r --argjson proxied "$expected_proxied" --argjson ttl "$expected_ttl" '
            "Cloudflare count: \(.result_info.total_count); returned: \(.result | length)",
            "Record types: \(.result | group_by(.type) | map("\(.[0].type)=\(length)") | join(", "))",
            "Expected A matches: \([.result[] | select(.type == "A" and .name == "autographs.jetsaredim.net" and .content == "129.213.166.159" and .proxied == $proxied and .ttl == $ttl)] | length)",
            "Expected MX matches: \([.result[] | select(.type == "MX" and .name == "jetsaredim.net" and (.content | rtrimstr(".")) == "smtp.google.com" and .priority == 1 and .ttl == 600)] | length)",
            "Expected SPF matches: \([.result[] | select(.type == "TXT" and .name == "jetsaredim.net" and (.content | if startswith("\"") and endswith("\"") then .[1:-1] else . end) == "v=spf1 include:_spf.google.com ~all" and .ttl == 600)] | length)"
          ' "$RUNNER_TEMP/cloudflare-records.json"
          jq -e --argjson proxied "$expected_proxied" --argjson ttl "$expected_ttl" '
            .success == true and .result_info.total_count == 3 and
            (.result | length) == 3 and
            ([.result[] | select(
              .type == "A" and .name == "autographs.jetsaredim.net" and
              .content == "129.213.166.159" and .proxied == $proxied and .ttl == $ttl
            )] | length) == 1 and
            ([.result[] | select(
              .type == "MX" and .name == "jetsaredim.net" and
              (.content | rtrimstr(".")) == "smtp.google.com" and
              .priority == 1 and .ttl == 600
            )] | length) == 1 and
            ([.result[] | select(
              .type == "TXT" and .name == "jetsaredim.net" and
              (.content | if startswith("\"") and endswith("\"") then .[1:-1] else . end) == "v=spf1 include:_spf.google.com ~all" and .ttl == 600
            )] | length) == 1
          ' "$RUNNER_TEMP/cloudflare-records.json" >/dev/null || {
            echo "::error::Cloudflare DNS inventory differs from the three reviewed records and expected proxy stage."
            exit 1
          }
          if [ "$OPERATION" = apply_proxy ]; then
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/ssl/certificate_packs?per_page=50" \
              > "$RUNNER_TEMP/cloudflare-certificates.json"
            jq -e '
              .success == true and
              ([.result[]? | select(
                .status == "active" and
                any(.hosts[]?; . == "autographs.jetsaredim.net" or . == "*.jetsaredim.net")
              )] | length) > 0
            ' "$RUNNER_TEMP/cloudflare-certificates.json" >/dev/null || {
              echo "::error::No active Cloudflare edge certificate covers the app hostname."
              exit 1
            }
            curl -fsS --resolve autographs.jetsaredim.net:443:129.213.166.159 \
              -o /dev/null https://autographs.jetsaredim.net/
            echo "Verified active edge certificate coverage and valid Caddy origin HTTPS."
          fi
          echo "Verified active full zone and exactly three expected authoritative records."

      - name: Reconcile Cloudflare state and inspect saved plan
        working-directory: infra/terraform
        env:
          ZONE_ID: ${{ inputs.zone_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci/api_key.pem
          OCI_REGION: us-ashburn-1
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci/api_key.pem
          TF_VAR_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
          TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_runtime_image_ocid: ${{ vars.OCI_RUNTIME_IMAGE_OCID }}
          TF_VAR_runtime_shape: ${{ vars.OCI_RUNTIME_SHAPE || 'VM.Standard.E2.1.Micro' }}
          TF_VAR_runtime_ocpus: ${{ vars.OCI_RUNTIME_OCPUS || 1 }}
          TF_VAR_runtime_memory_gbs: ${{ vars.OCI_RUNTIME_MEMORY_GBS || 1 }}
          TF_VAR_runtime_ssh_public_keys: ${{ vars.OCI_RUNTIME_SSH_PUBLIC_KEYS || '[]' }}
          TF_VAR_runtime_deploy_user: ${{ vars.DEPLOY_SSH_USER || 'opc' }}
          TF_VAR_runtime_deploy_path: ${{ vars.DEPLOY_PATH || '/opt/autographs' }}
          TF_VAR_create_autonomous_database: ${{ vars.OCI_CREATE_AUTONOMOUS_DATABASE || 'false' }}
          TF_VAR_autonomous_database_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_NAME || 'autographsdb' }}
          TF_VAR_autonomous_database_display_name: ${{ vars.OCI_AUTONOMOUS_DATABASE_DISPLAY_NAME || 'autographs-prod-adb' }}
          TF_VAR_autonomous_database_is_mtls_connection_required: ${{ vars.OCI_AUTONOMOUS_DATABASE_IS_MTLS_CONNECTION_REQUIRED || 'true' }}
          TF_VAR_create_media_bucket: ${{ vars.OCI_CREATE_MEDIA_BUCKET || 'false' }}
          TF_VAR_media_bucket_namespace: ${{ vars.OCI_MEDIA_NAMESPACE || vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          TF_VAR_media_bucket_name: ${{ vars.OCI_MEDIA_BUCKET_NAME || 'autographs-media-prod' }}
          TF_VAR_porkbun_api_key: ${{ secrets.PORKBUN_API_KEY }}
          TF_VAR_porkbun_secret_key: ${{ secrets.PORKBUN_SECRET_KEY }}
          TF_VAR_autographs_dns_domain: ${{ vars.AUTOGRAPHS_DNS_DOMAIN || 'jetsaredim.net' }}
          TF_VAR_autographs_dns_subdomain: ${{ vars.AUTOGRAPHS_DNS_SUBDOMAIN || 'autographs' }}
          TF_VAR_autographs_dns_ttl: ${{ vars.AUTOGRAPHS_DNS_TTL || 600 }}
          TF_VAR_autographs_dns_record_id: ${{ vars.AUTOGRAPHS_DNS_RECORD_ID }}
          TF_VAR_cloudflare_mode: ${{ vars.CLOUDFLARE_MODE }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODE: ${{ vars.CLOUDFLARE_MODE }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$CLOUDFLARE_MODE" != dns_only ] && [ "$CLOUDFLARE_MODE" != proxied ]; then
            echo "::error::Persistent CLOUDFLARE_MODE must be dns_only or proxied."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=autographs-tf-state" \
            -backend-config="namespace=${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=envs/prod/terraform.tfstate" \
            -backend-config="workspace_key_prefix=envs" \
            -backend-config="auth=APIKey"
          import_if_absent() {
            local address="$1" import_id="$2" expected_id="$3"
            if ! terraform state list | grep -Fxq "$address"; then
              terraform import -input=false "$address" "$import_id"
            fi
            local resource_type="${address%%.*}"
            local resource_name="${address#*.}"
            resource_name="${resource_name%%[*}"
            local current_id
            current_id="$(terraform state pull | jq -er \
              --arg type "$resource_type" --arg name "$resource_name" '
              .resources[] |
              select(.module == null and .mode == "managed" and
                     .type == $type and .name == $name) |
              .instances[] | select(.index_key == 0) | .attributes.id
            ')"
            if [ "$current_id" != "$expected_id" ]; then
              echo "::error::Terraform address $address has a different resource ID. Stop and inspect state."
              exit 1
            fi
            echo "Verified state mapping: $address"
          }
          record_id() {
            jq -er --arg type "$1" --arg name "$2" \
              '.result[] | select(.type == $type and .name == $name) | .id' \
              "$RUNNER_TEMP/cloudflare-records.json"
          }
          import_if_absent 'cloudflare_zone.domain[0]' "$ZONE_ID" "$ZONE_ID"
          autograph_record_id="$(record_id A autographs.jetsaredim.net)"
          import_if_absent 'cloudflare_dns_record.autographs[0]' \
            "$ZONE_ID/$autograph_record_id" "$autograph_record_id"
          mail_record_id="$(record_id MX jetsaredim.net)"
          import_if_absent 'cloudflare_dns_record.mail[0]' \
            "$ZONE_ID/$mail_record_id" "$mail_record_id"
          spf_record_id="$(record_id TXT jetsaredim.net)"
          import_if_absent 'cloudflare_dns_record.spf[0]' \
            "$ZONE_ID/$spf_record_id" "$spf_record_id"
          import_if_absent 'cloudflare_zone_setting.strict_tls[0]' "$ZONE_ID/ssl" ssl
          ruleset_status="$(curl -sS -o "$RUNNER_TEMP/cloudflare-cache-ruleset.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_cache_settings/entrypoint")"
          case "$ruleset_status" in
            200)
              ruleset_id="$(jq -er '.result.id' "$RUNNER_TEMP/cloudflare-cache-ruleset.json")"
              import_if_absent 'cloudflare_ruleset.autographs_cache[0]' \
                "zones/$ZONE_ID/$ruleset_id" "$ruleset_id"
              ;;
            404) echo "No existing cache ruleset; Terraform plan may propose one." ;;
            *) echo "::error::Could not inspect existing cache ruleset (HTTP $ruleset_status)."; exit 1 ;;
          esac
          plan_file="$RUNNER_TEMP/cloudflare-import.tfplan"
          terraform plan -input=false -lock-timeout=5m -out="$plan_file"
          terraform show -json "$plan_file" | jq -r '
            .resource_changes[]? | select(.change.actions != ["no-op"]) |
            "\(.address): \(.change.actions | join(","))"
          '
          if [ "$OPERATION" = apply_tls_and_cache ]; then
            terraform show -json "$plan_file" | jq -e --arg zone "$ZONE_ID" '
              [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes |
              ($changes | map({address, actions: .change.actions}) | sort_by(.address)) == [
                {address: "cloudflare_ruleset.autographs_cache[0]", actions: ["create"]},
                {address: "cloudflare_zone_setting.strict_tls[0]", actions: ["update"]}
              ] and
              ([$changes[] | select(.address == "cloudflare_zone_setting.strict_tls[0]")][0].change |
                .before.value == "full" and .after.value == "strict" and
                .after.zone_id == $zone and .after.setting_id == "ssl") and
              ([$changes[] | select(.address == "cloudflare_ruleset.autographs_cache[0]")][0].change.after |
                .zone_id == $zone and .kind == "zone" and
                .phase == "http_request_cache_settings" and
                (.rules | map({ref, enabled, action, expression,
                  action_parameters: (.action_parameters |
                    walk(if type == "object" then with_entries(select(.value != null)) else . end))
                })) == [
                  {
                    ref: "bypass_admin_and_api", enabled: true, action: "set_cache_settings",
                    expression: "(http.host eq \"autographs.jetsaredim.net\" and (http.request.uri.path eq \"/admin\" or starts_with(http.request.uri.path, \"/admin/\")))",
                    action_parameters: {cache: false}
                  },
                  {
                    ref: "respect_rollback_documents", enabled: true, action: "set_cache_settings",
                    expression: "(http.host eq \"autographs.jetsaredim.net\" and (http.request.uri.path eq \"/\" or http.request.uri.path eq \"/index.html\" or http.request.uri.path eq \"/404.html\" or http.request.uri.path eq \"/manifest.json\" or starts_with(http.request.uri.path, \"/collection/\") or starts_with(http.request.uri.path, \"/items/\") or starts_with(http.request.uri.path, \"/architecture/\") or starts_with(http.request.uri.path, \"/data/\")))",
                    action_parameters: {cache: false}
                  },
                  {
                    ref: "cache_fingerprinted_media_and_assets", enabled: true, action: "set_cache_settings",
                    expression: "(http.host eq \"autographs.jetsaredim.net\" and (starts_with(http.request.uri.path, \"/media/\") or starts_with(http.request.uri.path, \"/assets/\")))",
                    action_parameters: {
                      cache: true,
                      edge_ttl: {mode: "respect_origin"},
                      browser_ttl: {mode: "respect_origin"}
                    }
                  }
                ])
            ' >/dev/null || {
              echo "::error::Plan does not match the reviewed strict-TLS value and cache-rule contract. No apply ran."
              exit 1
            }
            terraform apply -input=false -lock-timeout=5m "$plan_file"
            echo "Applied exactly the verified saved plan for cache rules and Full (strict) TLS."
          elif [ "$OPERATION" = apply_proxy ] || [ "$OPERATION" = apply_dns_only ]; then
            terraform show -json "$plan_file" | jq -e --arg zone "$ZONE_ID" --arg operation "$OPERATION" '
              [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes |
              ($changes | map({address, actions: .change.actions})) == [
                {address: "cloudflare_dns_record.autographs[0]", actions: ["update"]}
              ] and
              ($changes[0].change | .before.zone_id == $zone and .after.zone_id == $zone and
                .before.name == "autographs.jetsaredim.net" and
                .after.name == "autographs.jetsaredim.net" and
                .before.type == "A" and .after.type == "A" and
                .before.content == "129.213.166.159" and
                .after.content == "129.213.166.159" and
                (.before | del(.proxied, .ttl, .modified_on, .comment_modified_on, .tags_modified_on)) ==
                  (.after | del(.proxied, .ttl, .modified_on, .comment_modified_on, .tags_modified_on)) and
                (if $operation == "apply_proxy" then
                  .before.proxied == false and .before.ttl == 600 and
                  .after.proxied == true and .after.ttl == 1
                else
                  .before.proxied == true and .before.ttl == 1 and
                  .after.proxied == false and .after.ttl == 600
                end))
            ' >/dev/null || {
              echo "::error::Plan is not exactly the reviewed app A-record proxy transition. No apply ran."
              exit 1
            }
            terraform apply -input=false -lock-timeout=5m "$plan_file"
            echo "Applied exactly the verified saved app A-record proxy transition."
          else
            echo "Verification only: no Terraform apply was run. Review the plan before any DNS change."
          fi
