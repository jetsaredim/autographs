name: One-off Vault and GitHub secret comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare current secret values
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: secret-audit
    steps:
      - name: Install OCI CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check 'oci-cli==3.96.2'

      - name: Configure OCI API authentication
        env:
          OCI_CLI_USER_OCID: ${{ secrets.OCI_CLI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci/api_key.pem"
          chmod 0600 "$RUNNER_TEMP/oci/api_key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER_OCID"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci/api_key.pem"
            printf 'region=us-ashburn-1\n'
          } > "$RUNNER_TEMP/oci/config"
          chmod 0600 "$RUNNER_TEMP/oci/config"

      - name: Compare secrets without logging values
        env:
          ADMIN_HASH_GITHUB: ${{ secrets.AUTOGRAPHS_ADMIN_PASSWORD_HASH }}
          WALLET_PASSWORD_GITHUB: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
          OCI_CLI_BIN: ${{ runner.temp }}/oci-cli/bin/oci
          OCI_CONFIG_FILE: ${{ runner.temp }}/oci/config
        run: |
          python3 - <<'PY'
          import base64
          import hmac
          import json
          import os
          import subprocess
          import sys

          secrets = (
              ("admin password hash", "ADMIN_HASH_GITHUB", "ocid1.vaultsecret.oc1.iad.amaaaaaaaeqdcliavp2w56vfzsxrfjg2mkj3uquklq4v2uwj3wj5puhb4jua"),
              ("Oracle wallet password", "WALLET_PASSWORD_GITHUB", "ocid1.vaultsecret.oc1.iad.amaaaaaaaeqdcliarqhhwqyxxwldyj4bjg7drnsk5z5zsjck2nvaun6mxjva"),
          )
          all_match = True
          for label, github_env, secret_id in secrets:
              github_value = os.environ.get(github_env, "")
              if not github_value:
                  print(f"{label}: GitHub Secret is missing or empty")
                  all_match = False
                  continue
              result = subprocess.run(
                  [os.environ["OCI_CLI_BIN"], "secrets", "secret-bundle", "get",
                   "--config-file", os.environ["OCI_CONFIG_FILE"],
                   "--secret-id", secret_id, "--stage", "CURRENT"],
                  capture_output=True, check=False, text=True,
              )
              if result.returncode != 0:
                  print(f"{label}: OCI Vault read failed")
                  all_match = False
                  continue
              try:
                  encoded = json.loads(result.stdout)["data"]["secret-bundle-content"]["content"]
                  vault_value = base64.b64decode(encoded, validate=True)
              except (ValueError, KeyError, TypeError):
                  print(f"{label}: OCI Vault response was invalid")
                  all_match = False
                  continue
              matched = hmac.compare_digest(vault_value, github_value.encode("utf-8"))
              print(f"{label}: {'match' if matched else 'mismatch'}")
              all_match &= matched

          sys.exit(0 if all_match else 1)
          PY
