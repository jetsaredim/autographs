name: CI runtime secrets

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  drift:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'approved-secret-rotation'
    uses: ./.github/workflows/runtime-secret-rotation.yml
    with:
      mode: check
    secrets: inherit
